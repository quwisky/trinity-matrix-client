apply plugin: 'com.android.application'

// The release version is the single source of truth: scripts/android-version.mjs derives both values from package.json.
def androidVersion
try {
    def versionJson = providers.exec {
        commandLine 'node', file("${rootDir}/../scripts/android-version.mjs").absolutePath
    }.standardOutput.asText.get()
    androidVersion = new groovy.json.JsonSlurper().parseText(versionJson)
} catch (Exception e) {
    throw new GradleException("Could not read the Android version from scripts/android-version.mjs (is node on PATH?): ${e.message}", e)
}

// Signing is opt-in: only a complete TRINITY_ANDROID_* environment signs the release build.
def signingEnv = ['TRINITY_ANDROID_KEYSTORE', 'TRINITY_ANDROID_KEYSTORE_PASSWORD', 'TRINITY_ANDROID_KEY_ALIAS', 'TRINITY_ANDROID_KEY_PASSWORD']
        .collectEntries { [(it): System.getenv(it) ?: ''] }
def releaseSigningEnabled = signingEnv.values().every { !it.isEmpty() }

android {
    namespace = "dev.trinityproject.trinity"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.trinityproject.trinity"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersion.versionCode as int
        versionName androidVersion.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningEnabled) {
            release {
                storeFile file(signingEnv.TRINITY_ANDROID_KEYSTORE)
                storePassword signingEnv.TRINITY_ANDROID_KEYSTORE_PASSWORD
                keyAlias signingEnv.TRINITY_ANDROID_KEY_ALIAS
                keyPassword signingEnv.TRINITY_ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        secondaryDebug {
            initWith debug
            applicationIdSuffix ".secondary"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            if (releaseSigningEnabled) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // These AndroidX AARs already ship their native objects in the form we package.
            // Asking AGP to strip them only emits "Unable to strip" and copies the same bytes.
            keepDebugSymbols += ['**/libdatastore_shared_counter.so', '**/libimage_processing_util_jni.so', '**/libsurface_util_jni.so']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

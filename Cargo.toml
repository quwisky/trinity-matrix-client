[workspace]
resolver = "3"
members = ["native/engine", "native/engine-testhost"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
async-stream = "0.3"
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-base = { version = "=0.19.1", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"
tempfile = { version = "3", default-features = false }
zeroize = "1"

# Curated: lints that catch real faults here without the documentation and pedantic groups.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
as_conversions = "warn"
dbg_macro = "warn"
fn_params_excessive_bools = "warn"
todo = "warn"
unwrap_used = "warn"

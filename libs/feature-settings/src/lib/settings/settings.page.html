<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/rooms" />
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div>
    <h2
      class="px-4 pt-5 pb-1 text-xs font-semibold uppercase tracking-wide text-muted-foreground"
    >
      Profile
    </h2>
    @if (profile(); as p) {
      <div class="flex items-center gap-3 px-4 py-2">
        <trn-avatar
          [mxc]="p.avatarMxc"
          [name]="p.displayName || p.userId"
          [initial]="initial()"
          [size]="64"
        />
        <div class="min-w-0 flex-1">
          <div class="truncate text-sm font-medium text-foreground">
            {{ p.displayName || p.userId }}
          </div>
          <div class="truncate text-xs text-muted-foreground">
            {{ p.userId }}
          </div>
        </div>
        <button
          hlmBtn
          variant="ghost"
          size="sm"
          class="ml-auto shrink-0"
          [disabled]="savingAvatar()"
          (click)="pickAvatar()"
          data-testid="change-avatar"
        >
          {{ savingAvatar() ? 'Uploading…' : 'Change' }}
        </button>
      </div>
      <div
        class="flex items-end gap-3 border-b border-solid border-border px-4 py-2"
      >
        <div class="min-w-0 flex-1">
          <label hlmLabel for="display-name">Display name</label>
          <input
            id="display-name"
            hlmInput
            class="mt-1"
            [value]="nameDraft()"
            (input)="onNameInput($event)"
            data-testid="display-name-input"
          />
        </div>
        <button
          hlmBtn
          size="sm"
          class="ml-auto shrink-0"
          [disabled]="savingName() || !nameDirty()"
          (click)="saveName()"
          data-testid="save-name"
        >
          Save
        </button>
      </div>
    } @else if (loading()) {
      <div class="px-4 py-2 text-sm text-muted-foreground">
        Loading profile…
      </div>
    }
    @if (error(); as e) {
      <p class="setting-note setting-note--error">{{ e }}</p>
    }
    <input
      #avatarInput
      type="file"
      accept="image/*"
      hidden
      data-testid="avatar-input"
      (change)="onAvatarPicked($event)"
    />
  </div>

  <div>
    <h2
      class="px-4 pt-5 pb-1 text-xs font-semibold uppercase tracking-wide text-muted-foreground"
    >
      Appearance
    </h2>
    <hlm-radio-group
      class="px-4 py-2"
      [value]="theme.preference()"
      (valueChange)="onThemeChange($event)"
    >
      <label
        class="flex cursor-pointer items-center gap-3 text-sm font-medium"
        data-testid="theme-system"
      >
        <hlm-radio value="system"><hlm-radio-indicator /></hlm-radio>
        Use system setting
      </label>
      <label
        class="flex cursor-pointer items-center gap-3 text-sm font-medium"
        data-testid="theme-light"
      >
        <hlm-radio value="light"><hlm-radio-indicator /></hlm-radio>
        Light
      </label>
      <label
        class="flex cursor-pointer items-center gap-3 text-sm font-medium"
        data-testid="theme-dark"
      >
        <hlm-radio value="dark"><hlm-radio-indicator /></hlm-radio>
        Dark
      </label>
    </hlm-radio-group>
    <p class="setting-note">Showing the {{ theme.resolved() }} theme.</p>
  </div>

  <trn-devices-section />
</ion-content>

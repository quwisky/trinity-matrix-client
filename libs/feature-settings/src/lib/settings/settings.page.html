<trn-page-header title="Settings">
  <button
    trnHeaderLeading
    hlmBtn
    variant="ghost"
    size="icon"
    hlmTooltip="Back"
    aria-label="Back"
    (click)="goBack()"
  >
    <ng-icon name="lucideArrowLeft" />
  </button>
</trn-page-header>

<div class="settings" [class.settings--detail]="sectionActive()">
  <nav class="settings__menu" aria-label="Settings sections">
    @for (item of menu; track item.path) {
      <a
        class="settings__item"
        [routerLink]="item.path"
        [replaceUrl]="wide()"
        routerLinkActive="settings__item--active"
        ariaCurrentWhenActive="page"
        [attr.data-testid]="'settings-nav-' + item.path"
      >
        <ng-icon
          [name]="item.icon"
          class="settings__item-icon"
          aria-hidden="true"
        />
        <span class="settings__item-label">{{ item.label }}</span>
        <ng-icon
          name="lucideChevronRight"
          class="settings__item-chevron"
          aria-hidden="true"
        />
      </a>
    }
  </nav>
  <section class="settings__detail">
    <router-outlet />
  </section>
</div>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/rooms" />
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-list-header>Profile</ion-list-header>
    @if (profile(); as p) {
      <ion-item lines="none">
        <trn-avatar
          slot="start"
          [mxc]="p.avatarMxc"
          [name]="p.displayName || p.userId"
          [initial]="initial()"
          [size]="64"
        />
        <ion-label>
          <h2>{{ p.displayName || p.userId }}</h2>
          <p>{{ p.userId }}</p>
        </ion-label>
        <ion-button
          slot="end"
          fill="clear"
          size="small"
          [disabled]="savingAvatar()"
          (click)="pickAvatar()"
          data-testid="change-avatar"
        >
          {{ savingAvatar() ? 'Uploading…' : 'Change' }}
        </ion-button>
      </ion-item>
      <ion-item>
        <ion-input
          label="Display name"
          labelPlacement="stacked"
          [value]="nameDraft()"
          (ionInput)="onNameInput($event)"
          data-testid="display-name-input"
        />
        <ion-button
          slot="end"
          size="small"
          [disabled]="savingName() || !nameDirty()"
          (click)="saveName()"
          data-testid="save-name"
        >
          Save
        </ion-button>
      </ion-item>
    } @else if (loading()) {
      <ion-item lines="none"><ion-label>Loading profile…</ion-label></ion-item>
    }
    @if (error(); as e) {
      <p class="setting-note setting-note--error">{{ e }}</p>
    }
    <input
      #avatarInput
      type="file"
      accept="image/*"
      hidden
      data-testid="avatar-input"
      (change)="onAvatarPicked($event)"
    />
  </ion-list>

  <ion-list>
    <ion-list-header>Appearance</ion-list-header>
    <hlm-radio-group
      class="px-4 py-2"
      [value]="theme.preference()"
      (valueChange)="onThemeChange($event)"
    >
      <label
        class="flex cursor-pointer items-center gap-3 text-sm font-medium"
        data-testid="theme-system"
      >
        <hlm-radio value="system"><hlm-radio-indicator /></hlm-radio>
        Use system setting
      </label>
      <label
        class="flex cursor-pointer items-center gap-3 text-sm font-medium"
        data-testid="theme-light"
      >
        <hlm-radio value="light"><hlm-radio-indicator /></hlm-radio>
        Light
      </label>
      <label
        class="flex cursor-pointer items-center gap-3 text-sm font-medium"
        data-testid="theme-dark"
      >
        <hlm-radio value="dark"><hlm-radio-indicator /></hlm-radio>
        Dark
      </label>
    </hlm-radio-group>
    <p class="setting-note">Showing the {{ theme.resolved() }} theme.</p>
  </ion-list>

  <trn-devices-section />
</ion-content>

<div>
  <h2
    class="px-4 pt-5 pb-1 text-xs font-semibold tracking-wide text-muted-foreground uppercase"
  >
    Account
  </h2>

  <form
    [formGroup]="form"
    class="flex flex-col gap-4 px-4 py-3"
    (ngSubmit)="submit()"
  >
    <p class="text-sm text-muted-foreground">Change your account password.</p>

    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="current-password">Current password</label>
      <input
        hlmInput
        id="current-password"
        type="password"
        autocomplete="current-password"
        formControlName="currentPassword"
        data-testid="current-password"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="new-password">New password</label>
      <input
        hlmInput
        id="new-password"
        type="password"
        autocomplete="new-password"
        formControlName="newPassword"
        data-testid="new-password"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="confirm-password">Confirm new password</label>
      <input
        hlmInput
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        formControlName="confirmPassword"
        data-testid="confirm-password"
      />
    </div>

    @if (error(); as message) {
      <p class="text-sm text-destructive" data-testid="account-error">
        {{ message }}
      </p>
    }

    <button
      hlmBtn
      type="submit"
      class="self-start"
      [disabled]="saving()"
      data-testid="change-password"
    >
      {{ saving() ? 'Changing…' : 'Change password' }}
    </button>
  </form>
</div>

<div
  class="flex h-screen w-screen flex-col overflow-hidden border-l border-solid border-border bg-card text-card-foreground shadow-lg md:w-[480px]"
>
  <div class="flex items-center gap-2 border-b border-solid border-border p-3">
    <h2 class="flex-1 text-base font-semibold">Thread</h2>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      (click)="close()"
      hlmTooltip="Close thread"
      aria-label="Close thread"
    >
      <ng-icon name="lucideX" class="text-xl" />
    </button>
  </div>

  <div class="thread flex-1 overflow-y-auto" #scroll>
    @if (loadingOlder()) {
      <div class="thread__load-older">Loading older replies…</div>
    } @else if (canLoadOlder()) {
      <button type="button" class="thread__load-older" (click)="loadOlder()">
        Load older replies
      </button>
    }

    @for (row of rows(); track row.id) {
      <trn-message-row
        [row]="row"
        [editable]="isEditable(row)"
        [deletable]="row.isOwn && !row.status"
        [canThread]="false"
        (react)="onReact(row.id, $event)"
        (replyMessage)="startReply(row)"
        (copyMessage)="onCopy(row)"
        (editMessage)="startEdit(row)"
        (deleteMessage)="onDelete(row)"
        (retry)="onRetry(row.id)"
        (jumpReply)="jumpTo($event)"
      />
    } @empty {
      <div class="thread__empty">No replies in this thread yet.</div>
    }
  </div>

  <div class="thread__footer">
    <trn-message-composer
      placeholder="Reply…"
      [roomId]="rootEventId()"
      [editing]="editingId() !== null"
      [editTargetId]="editingId()"
      [draft]="editingDraft()"
      [replyingTo]="replyingToName()"
      [uploadProgress]="uploadProgress()"
      (submitText)="onSubmit($event)"
      (submitMedia)="onSendMedia($event)"
      (cancelEdit)="editingId.set(null)"
      (cancelReply)="replyingToId.set(null)"
      (editLast)="editLastOwn()"
    />
  </div>
</div>

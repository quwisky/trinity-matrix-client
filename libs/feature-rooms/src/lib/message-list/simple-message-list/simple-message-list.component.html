<span class="sr-only" role="status" aria-live="polite">{{
  announcement()
}}</span>

<div class="scroll" #scroll (scroll)="onScroll()">
  @if (loadingOlder()) {
    <div class="load-older">Loading older messages…</div>
  }

  @for (row of rows(); track row.id) {
    <trn-message-row
      [row]="row"
      [threadSummary]="threadSummaries()[row.id] ?? null"
      [caps]="rowCaps(row)"
      (action)="onRowAction(row, $event)"
    />
  } @empty {
    <div class="empty">No messages yet.</div>
  }
</div>

@if (typingLabel(); as label) {
  <div
    class="typing-indicator"
    role="status"
    aria-live="polite"
    data-testid="typing-indicator"
  >
    {{ label }}
  </div>
}

<trn-message-composer
  [roomId]="roomId()"
  [roomName]="roomName()"
  [members]="members()"
  [editing]="editingId() !== null"
  [editTargetId]="editingId()"
  [draft]="editingDraft()"
  [replyingTo]="replyingToName()"
  [uploadProgress]="uploadProgress()"
  (submitText)="onSubmit($event)"
  (submitMedia)="sendMedia.emit($event)"
  (cancelEdit)="editingId.set(null)"
  (cancelReply)="replyingToId.set(null)"
  (editLast)="editLastOwn()"
  (typing)="typing.emit($event)"
/>

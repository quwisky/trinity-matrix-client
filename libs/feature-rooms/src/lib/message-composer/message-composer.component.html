@if (editing()) {
  <div class="composer__banner">Editing message — <kbd>Esc</kbd> to cancel</div>
} @else if (replyingTo()) {
  <div class="composer__banner">
    Replying to <strong>{{ replyingTo() }}</strong>
    <button
      type="button"
      class="composer__cancel"
      aria-label="Cancel reply"
      (click)="cancelReply.emit()"
    >
      ✕
    </button>
  </div>
}

@if (uploadProgress() !== null) {
  <div class="composer__upload" data-testid="upload-progress">
    <ion-progress-bar
      [type]="uploadDeterminate() ? 'determinate' : 'indeterminate'"
      [value]="uploadProgress() ?? 0"
      aria-label="Uploading attachment"
    />
    <span class="composer__upload-label" aria-live="polite">
      Uploading…{{ uploadDeterminate() ? ' ' + uploadPercent() + '%' : '' }}
    </span>
  </div>
}

<div class="composer">
  @if (pickerOpen()) {
    <trn-emoji-picker class="composer__picker" (pick)="insertEmoji($event)" />
  }
  <textarea
    #ta
    class="composer__input"
    rows="1"
    [value]="text()"
    [placeholder]="editing() ? 'Edit message…' : 'Message #' + roomName()"
    (input)="onInput($event)"
    (keydown.enter)="onEnter($event)"
    (keydown.escape)="onEscape()"
    (keydown.arrowUp)="onArrowUp($event)"
  ></textarea>
  <input
    #fileInput
    type="file"
    class="composer__file-input"
    data-testid="composer-file-input"
    hidden
    (change)="onFilePicked($event)"
  />
  <button
    type="button"
    class="composer__attach"
    title="Attach"
    aria-label="Attach a file"
    data-testid="composer-attach"
    [disabled]="uploadProgress() !== null"
    (click)="onAttach()"
  >
    <ion-icon name="add-outline" aria-hidden="true" />
  </button>
  <button
    type="button"
    class="composer__emoji"
    title="Emoji"
    aria-label="Insert emoji"
    [attr.aria-expanded]="pickerOpen()"
    (click)="pickerOpen.set(!pickerOpen())"
  >
    <ion-icon name="happy-outline" aria-hidden="true" />
  </button>
  <!-- Touch devices have no reliable Enter-to-send, so surface an explicit send
       button there (hidden on pointer devices via CSS). -->
  <button
    type="button"
    class="composer__send"
    title="Send"
    aria-label="Send message"
    [disabled]="!text().trim()"
    (click)="submit()"
  >
    <ion-icon name="send" aria-hidden="true" />
  </button>
</div>

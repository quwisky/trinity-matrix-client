@if (visible()) {
  <trn-banner tone="accent">
    <ng-icon trnBannerIcon name="lucideLock" aria-hidden="true" />
    {{ message() }}
    <span trnBannerActions>
      @for (action of actions(); track action.kind) {
        <button
          hlmBtn
          class="banner__action"
          size="sm"
          (click)="run(action.kind)"
        >
          {{ action.label }}
        </button>
      }
    </span>
  </trn-banner>
}

<div class="picker">
  <div class="picker__tabs">
    @for (cat of categories; track cat.id) {
      <button
        type="button"
        class="picker__tab"
        [class.picker__tab--active]="active() === cat.id"
        [title]="cat.id"
        [attr.aria-label]="cat.id"
        (click)="active.set(cat.id)"
      >
        {{ cat.icon }}
      </button>
    }
  </div>

  <div class="picker__grid">
    @for (emoji of emojis(); track emoji) {
      <button
        type="button"
        class="picker__emoji"
        [title]="emoji"
        (click)="pick.emit(emoji)"
      >
        {{ emoji }}
      </button>
    }
  </div>
</div>

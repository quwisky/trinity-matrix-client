<ion-split-pane contentId="main-content" when="md">
  <ion-menu contentId="main-content" type="overlay">
    <div class="shell-side">
      <trn-server-rail
        [spaces]="rooms.spaces()"
        [activeSpaceId]="activeSpaceId()"
        (selectSpace)="onSelectSpace($event)"
      />
      <trn-channel-sidebar
        [spaceName]="activeSpaceName()"
        [rooms]="visibleRooms()"
        [activeRoomId]="activeRoomId()"
        [userName]="userName()"
        [userId]="userId()"
        [userInitial]="userInitial()"
        [userAvatarMxc]="userAvatarMxc()"
        (selectRoom)="onSelectRoom($event)"
        (logout)="logout()"
      />
    </div>
  </ion-menu>

  <div class="main" id="main-content">
    <trn-connectivity-banner />
    <trn-encryption-banner />

    <ion-header>
      <ion-toolbar class="chat-toolbar">
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button
            (click)="goToSettings()"
            aria-label="Settings"
            data-testid="open-settings"
          >
            <ion-icon slot="icon-only" name="settings-outline" />
          </ion-button>
        </ion-buttons>
        <ion-title>
          @if (activeRoom(); as room) {
            <span role="heading" aria-level="1">
              <span class="title-hash">#</span>{{ room.name }}
            </span>
            @if (room.encrypted) {
              <ion-icon
                class="title-lock"
                name="lock-closed"
                aria-label="Encrypted room"
              />
            }
          } @else {
            Trinity
          }
        </ion-title>
      </ion-toolbar>
    </ion-header>

    <div class="chat-body">
      @if (activeRoom(); as room) {
        <trn-message-list
          [messages]="timeline.messages()"
          [loadingOlder]="timeline.loadingOlder()"
          [canLoadOlder]="timeline.canLoadOlder()"
          [roomName]="room.name"
          [uploadProgress]="uploadProgress()"
          (loadOlder)="loadOlder()"
          (send)="onSend($event)"
          (sendMedia)="onSendMedia($event)"
          (retry)="timeline.retry($event)"
          (editMessage)="onEdit($event)"
          (deleteMessage)="onDelete($event)"
          (react)="onReact($event)"
          (reply)="onReply($event)"
        />
        <trn-member-list class="chat-members" [members]="members()" />
      } @else {
        <main class="chat-empty">
          <div class="hero">
            <div class="hero__badge">#</div>
            <h1 class="hero__title">{{ syncLabel() }}</h1>
            <p class="hero__meta">
              Select a channel on the left to get started.
            </p>
          </div>
        </main>
      }
    </div>
  </div>
</ion-split-pane>

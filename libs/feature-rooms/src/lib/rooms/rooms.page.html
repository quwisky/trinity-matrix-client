<ion-split-pane contentId="main-content" when="md">
  <ion-menu contentId="main-content" type="overlay">
    <div class="shell-side">
      <app-server-rail
        [spaces]="rooms.spaces()"
        [activeSpaceId]="activeSpaceId()"
        (selectSpace)="onSelectSpace($event)"
      />
      <app-channel-sidebar
        [spaceName]="activeSpaceName()"
        [rooms]="visibleRooms()"
        [activeRoomId]="activeRoomId()"
        [userName]="userName()"
        [userId]="userId()"
        [userInitial]="userInitial()"
        (selectRoom)="onSelectRoom($event)"
        (logout)="logout()"
      />
    </div>
  </ion-menu>

  <div class="main" id="main-content">
    <ion-header>
      <ion-toolbar class="chat-toolbar">
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>
          @if (activeRoom(); as room) {
            <span class="title-hash">#</span>{{ room.name }}
          } @else {
            Trinity
          }
        </ion-title>
      </ion-toolbar>
    </ion-header>

    <div class="chat-body">
      @if (activeRoom(); as room) {
        <app-message-list
          [messages]="timeline.messages()"
          [loadingOlder]="timeline.loadingOlder()"
          [canLoadOlder]="timeline.canLoadOlder()"
          [roomName]="room.name"
          (loadOlder)="loadOlder()"
          (send)="onSend($event)"
          (retry)="timeline.retry($event)"
        />
        <app-member-list class="chat-members" [members]="members()" />
      } @else {
        <main class="chat-empty">
          <div class="hero">
            <div class="hero__badge">#</div>
            <h1 class="hero__title">{{ syncLabel() }}</h1>
            <p class="hero__meta">
              Select a channel on the left to get started.
            </p>
          </div>
        </main>
      }
    </div>
  </div>
</ion-split-pane>

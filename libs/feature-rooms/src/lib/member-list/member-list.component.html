<aside class="members">
  <div class="members__header">
    <span class="category"
      >Members — {{ onlineCount() }} of {{ members().length }} online</span
    >
    <button
      class="members__close"
      (click)="closed.emit()"
      aria-label="Close member list"
      title="Close member list"
      data-testid="close-members"
    >
      <ng-icon name="lucideX" aria-hidden="true" />
    </button>
  </div>
  @for (row of rows(); track row.member.userId) {
    <div
      class="member"
      [class.member--offline]="row.presence === 'offline'"
      [title]="row.member.userId"
    >
      <trn-avatar
        [mxc]="row.member.avatarMxc"
        [initial]="row.member.initial"
        [name]="row.member.name"
        [size]="32"
        [presence]="row.presence"
      />
      <span class="member__name">{{ row.member.name }}</span>
    </div>
  }
</aside>

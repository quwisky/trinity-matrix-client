<form [formRoot]="passwordForm" (submit)="submit()" class="flex flex-col gap-4">
  <p [id]="testIdPrefix() + '-body'" class="m-0 text-sm text-muted-foreground">
    {{ body() }}
  </p>
  <div>
    <label trnLabel [for]="fieldId()">Password</label>
    <trn-password-input class="mt-1">
      <input
        trnInput
        [id]="fieldId()"
        autocomplete="current-password"
        [formField]="passwordForm.password"
        [explicitInvalid]="rejected()"
        [aria-describedby]="rejected() ? fieldId() + '-error' : null"
        [attr.data-testid]="fieldId()"
      />
    </trn-password-input>
    <p
      [id]="fieldId() + '-error'"
      class="m-0 pt-1 text-13 text-danger"
      aria-live="polite"
      [attr.data-testid]="fieldId() + '-error'"
    >
      @if (rejected()) {
        {{ rejectedMessage() }}
      }
    </p>
  </div>
  <div trnDialogActions>
    <button
      trnBtn
      type="button"
      presentation="outline"
      (click)="back.emit()"
      [attr.data-testid]="testIdPrefix() + '-back'"
    >
      Back
    </button>
    <button
      trnBtn
      type="submit"
      variant="danger"
      [attr.data-testid]="fieldId() + '-submit'"
    >
      {{ submitLabel() }}
    </button>
  </div>
</form>

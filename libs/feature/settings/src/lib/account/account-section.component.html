<trn-settings-group
  description="Manage the credentials and account controls provided by your homeserver."
>
  @if (accountManagement(); as management) {
    <!-- OIDC account: credentials + device management live at the provider. -->
    <trn-settings-row
      label="Credentials and sessions"
      description="Your password and sessions are managed by your identity provider."
    >
      <button
        trnBtn
        type="button"
        (click)="openAccountManagement()"
        data-testid="manage-account"
      >
        Manage account
      </button>
    </trn-settings-row>
  } @else {
    <form [formRoot]="form" (submit)="submit()">
      <trn-settings-row label="Current password" for="current-password">
        <div class="flex items-center gap-2">
          <input
            trnInput
            id="current-password"
            [type]="revealed().currentPassword ? 'text' : 'password'"
            class="w-56 min-w-0 max-sm:flex-1"
            autocomplete="current-password"
            [formField]="form.currentPassword"
            data-testid="current-password"
          />
          <button
            type="button"
            trnBtn
            presentation="ghost"
            shape="icon"
            size="md"
            [attr.aria-label]="
              revealed().currentPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="revealed().currentPassword"
            (click)="toggleReveal('currentPassword')"
          >
            <trn-icon
              [name]="revealed().currentPassword ? 'eye-off' : 'eye'"
              motion="pop"
            />
          </button>
        </div>
      </trn-settings-row>
      <trn-settings-row label="New password" for="new-password">
        <div class="flex items-center gap-2">
          <input
            trnInput
            id="new-password"
            [type]="revealed().newPassword ? 'text' : 'password'"
            class="w-56 min-w-0 max-sm:flex-1"
            autocomplete="new-password"
            [formField]="form.newPassword"
            data-testid="new-password"
          />
          <button
            type="button"
            trnBtn
            presentation="ghost"
            shape="icon"
            size="md"
            [attr.aria-label]="
              revealed().newPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="revealed().newPassword"
            (click)="toggleReveal('newPassword')"
          >
            <trn-icon
              [name]="revealed().newPassword ? 'eye-off' : 'eye'"
              motion="pop"
            />
          </button>
        </div>
      </trn-settings-row>
      <trn-settings-row label="Confirm new password" for="confirm-password">
        <div class="flex items-center gap-2">
          <input
            trnInput
            id="confirm-password"
            [type]="revealed().confirmPassword ? 'text' : 'password'"
            class="w-56 min-w-0 max-sm:flex-1"
            autocomplete="new-password"
            [formField]="form.confirmPassword"
            data-testid="confirm-password"
          />
          <button
            type="button"
            trnBtn
            presentation="ghost"
            shape="icon"
            size="md"
            [attr.aria-label]="
              revealed().confirmPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="revealed().confirmPassword"
            (click)="toggleReveal('confirmPassword')"
          >
            <trn-icon
              [name]="revealed().confirmPassword ? 'eye-off' : 'eye'"
              motion="pop"
            />
          </button>
        </div>
      </trn-settings-row>

      @if (error(); as message) {
        <p class="m-0 py-3 text-sm text-danger" data-testid="account-error">
          {{ message }}
        </p>
      }

      <div class="py-3">
        <button
          trnBtn
          type="submit"
          [disabled]="saving()"
          data-testid="change-password"
        >
          {{ saving() ? 'Changing…' : 'Change password' }}
        </button>
      </div>
    </form>
  }
</trn-settings-group>

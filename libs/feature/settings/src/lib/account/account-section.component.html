<div>
  <trn-settings-section-heading title="Account" [primary]="true" />

  @if (accountManagement(); as management) {
    <!-- OIDC account: credentials + device management live at the provider. -->
    <div class="flex flex-col gap-3 px-4 py-3">
      <p class="text-13 text-muted-foreground">
        Your password and sessions are managed by your identity provider.
      </p>
      <button
        hlmBtn
        type="button"
        class="self-start"
        (click)="openAccountManagement()"
        data-testid="manage-account"
      >
        Manage account
      </button>
    </div>
  } @else {
    <form
      [formRoot]="form"
      class="flex flex-col gap-4 px-4 py-3"
      (submit)="submit()"
    >
      <p class="text-13 text-muted-foreground">Change your account password.</p>

      <div class="flex flex-col gap-1.5">
        <label trnLabel for="current-password">Current password</label>
        <div class="relative">
          <input
            trnInput
            id="current-password"
            [type]="revealed().currentPassword ? 'text' : 'password'"
            class="pr-10"
            autocomplete="current-password"
            [formField]="form.currentPassword"
            data-testid="current-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-muted-foreground hover:text-foreground"
            [attr.aria-label]="
              revealed().currentPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="revealed().currentPassword"
            (click)="toggleReveal('currentPassword')"
          >
            <trn-icon [name]="revealed().currentPassword ? 'eye-off' : 'eye'" />
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label trnLabel for="new-password">New password</label>
        <div class="relative">
          <input
            trnInput
            id="new-password"
            [type]="revealed().newPassword ? 'text' : 'password'"
            class="pr-10"
            autocomplete="new-password"
            [formField]="form.newPassword"
            data-testid="new-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-muted-foreground hover:text-foreground"
            [attr.aria-label]="
              revealed().newPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="revealed().newPassword"
            (click)="toggleReveal('newPassword')"
          >
            <trn-icon [name]="revealed().newPassword ? 'eye-off' : 'eye'" />
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label trnLabel for="confirm-password">Confirm new password</label>
        <div class="relative">
          <input
            trnInput
            id="confirm-password"
            [type]="revealed().confirmPassword ? 'text' : 'password'"
            class="pr-10"
            autocomplete="new-password"
            [formField]="form.confirmPassword"
            data-testid="confirm-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-muted-foreground hover:text-foreground"
            [attr.aria-label]="
              revealed().confirmPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="revealed().confirmPassword"
            (click)="toggleReveal('confirmPassword')"
          >
            <trn-icon [name]="revealed().confirmPassword ? 'eye-off' : 'eye'" />
          </button>
        </div>
      </div>

      @if (error(); as message) {
        <p class="text-sm text-danger" data-testid="account-error">
          {{ message }}
        </p>
      }

      <button
        hlmBtn
        type="submit"
        class="self-start"
        [disabled]="saving()"
        data-testid="change-password"
      >
        {{ saving() ? 'Changing…' : 'Change password' }}
      </button>
    </form>
  }
</div>

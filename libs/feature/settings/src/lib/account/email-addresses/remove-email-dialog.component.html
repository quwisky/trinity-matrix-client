<trn-dialog-shell
  [title]="copy.removeTitle(address())"
  size="sm"
  (closed)="close()"
>
  <div class="flex flex-col gap-4">
    <p id="remove-email-body" class="m-0 text-sm text-muted-foreground">
      {{ copy.removeBody }}
    </p>
    <div trnDialogActions>
      <button
        trnBtn
        type="button"
        presentation="outline"
        data-autofocus
        (click)="close()"
        data-testid="remove-email-cancel"
      >
        Cancel
      </button>
      <button
        trnBtn
        type="button"
        variant="danger"
        (click)="close('remove')"
        data-testid="remove-email-confirm"
      >
        Remove
      </button>
    </div>
  </div>
</trn-dialog-shell>

<div class="flex flex-col gap-4">
  <p
    [attr.id]="testIdPrefix() + '-body'"
    class="m-0 text-sm text-muted-foreground"
    [attr.data-testid]="testIdPrefix() + '-sent'"
  >
    {{ body() || copy.sentBody(email()) }}
  </p>
  <p
    class="m-0 text-13 text-danger"
    aria-live="polite"
    [attr.data-testid]="testIdPrefix() + '-not-verified'"
  >
    @if (notVerified()) {
      {{ copy.notVerified }}
    }
  </p>
  <p
    class="m-0 text-13 text-muted-foreground"
    aria-live="polite"
    [attr.data-testid]="testIdPrefix() + '-resent'"
  >
    @if (resent()) {
      {{ copy.resent(email()) }}
    }
  </p>
  <p
    class="m-0 text-13 text-danger"
    aria-live="polite"
    [attr.data-testid]="testIdPrefix() + '-resend-error'"
  >
    {{ error() }}
  </p>
  <div trnDialogActions>
    <button
      trnBtn
      type="button"
      presentation="outline"
      (click)="cancelled.emit()"
      [attr.data-testid]="testIdPrefix() + '-cancel'"
    >
      Cancel
    </button>
    <button
      trnBtn
      type="button"
      presentation="outline"
      [disabled]="busy() || resendWaitMs() > 0"
      (click)="resend.emit()"
      [attr.data-testid]="testIdPrefix() + '-resend'"
    >
      {{ copy.resend }}
    </button>
    <button
      trnBtn
      type="button"
      [disabled]="busy() || continueWaitMs() > 0"
      (click)="continue.emit()"
      [attr.data-testid]="testIdPrefix() + '-continue'"
    >
      Continue
    </button>
  </div>
</div>

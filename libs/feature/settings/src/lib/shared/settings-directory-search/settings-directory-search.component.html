<div class="flex min-w-0 items-center gap-1">
  <label class="min-w-0 flex-1">
    <span class="sr-only">Search settings</span>
    <input
      #search
      trnInput
      type="search"
      class="w-full [&::-webkit-search-cancel-button]:appearance-none"
      placeholder="Search settings"
      autocomplete="off"
      data-testid="settings-search"
      [value]="query()"
      (input)="query.set(search.value)"
    />
  </label>
  @if (query()) {
    <button
      trnBtn
      type="button"
      presentation="ghost"
      shape="icon"
      size="md"
      aria-label="Clear search"
      data-testid="settings-search-clear"
      (click)="query.set(''); search.focus()"
    >
      <trn-icon name="x" motion="rotate" />
    </button>
  }
</div>
<p role="status" aria-live="polite" aria-atomic="true" class="sr-only">
  {{ count() }} {{ count() === 1 ? 'section' : 'sections' }} found
</p>
@if (count() === 0) {
  <trn-empty-state layout="line" class="mt-2" body="No sections found." />
}
@if (partResults().length) {
  <ul class="m-0 mt-2 list-none p-0" aria-label="Matching settings">
    @for (
      result of partResults();
      track result.section.path + result.part?.id
    ) {
      <li>
        <button
          trnBtn
          type="button"
          presentation="ghost"
          size="sm"
          shape="row"
          [attr.data-testid]="
            'settings-search-part-' +
            result.section.path +
            '-' +
            result.part?.id
          "
          (click)="resultSelected.emit(result)"
        >
          {{ result.section.label }} › {{ result.part?.label }}
        </button>
      </li>
    }
  </ul>
}

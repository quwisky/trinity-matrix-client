@for (entry of entries(); track entry.id) {
  @if (entry.visible()) {
    @switch (entry.editor.kind) {
      @case ('toggle') {
        <trn-settings-row
          [label]="entry.editor.label"
          [description]="entry.editor.description"
          [attr.data-testid]="entry.editor.testId"
        >
          <trn-switch
            [aria-label]="entry.editor.label"
            [checked]="checked(entry)"
            [disabled]="busy(entry.id)"
            (checkedChange)="update(entry, $event)"
          />
        </trn-settings-row>
        @if (entry.editor.warning) {
          <p class="m-0 py-3 text-sm text-muted-foreground">
            ⚠ {{ entry.editor.warning }}
          </p>
        }
        @if (failure(entry.id); as message) {
          <p
            role="alert"
            class="m-0 py-3 text-sm text-danger"
            [attr.data-testid]="entry.editor.testId + '-failure'"
          >
            {{ message }}
          </p>
        }
      }
    }
  }
}

<trn-settings-group
  title="Notifications"
  description="Choose what notifies you. These rules apply to every device signed in to your account."
>
  @for (rule of toggles; track rule.id) {
    <trn-settings-row
      [label]="rule.label"
      [attr.data-testid]="'notif-' + rule.id"
    >
      <trn-switch
        [aria-label]="rule.label"
        [checked]="checked(rule)"
        (checkedChange)="toggle(rule, $event)"
      />
    </trn-settings-row>
  }

  <trn-settings-row
    label="When someone reacts to my message"
    description="While Trinity is running, groups reactions to your messages into one notification per message."
    data-testid="notif-reactions"
  >
    <trn-switch
      aria-label="When someone reacts to my message"
      [checked]="reactionChecked()"
      (checkedChange)="toggleReactions($event)"
    />
  </trn-settings-row>

  <trn-settings-row
    label="Play a sound"
    description="Covers every notification Trinity shows you here, and is stored with your account. It does not change the sound your phone makes for a pushed notification, and it is Trinity's own setting — other Matrix apps keep theirs."
    data-testid="notif-sound"
  >
    <trn-switch
      aria-label="Play a sound"
      [checked]="soundChecked()"
      (checkedChange)="toggleSound($event)"
    />
  </trn-settings-row>
</trn-settings-group>

<trn-keyword-rules />

<trn-push-gateway-block />

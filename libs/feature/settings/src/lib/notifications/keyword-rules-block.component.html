<trn-settings-group
  title="Keywords"
  description="Be notified whenever one of these whole words is said, in any room — “call” will not match “oncall”. A muted room stays muted: keywords do not override it."
  data-testid="keyword-rules"
>
  @if (isLoading()) {
    <trn-empty-state
      layout="line"
      body="Loading your keywords…"
      data-testid="keyword-loading"
    />
  } @else if (isEmpty()) {
    <trn-empty-state
      layout="line"
      body="You have no keywords yet."
      data-testid="keyword-empty"
    />
  } @else {
    @for (keyword of keywords(); track keyword.pattern) {
      <trn-settings-row [label]="keyword.pattern" data-testid="keyword-row">
        <span class="flex shrink-0 items-center gap-3">
          @if (!keyword.enabled) {
            <span
              class="rounded bg-muted px-1.5 py-0.5 text-xs text-muted-foreground"
              data-testid="keyword-off"
              >Off</span
            >
          }
          <button
            trnBtn
            type="button"
            presentation="outline"
            size="sm"
            [disabled]="isBusy(keyword.pattern)"
            (click)="remove(keyword)"
            [attr.aria-label]="'Remove keyword ' + keyword.pattern"
            data-testid="keyword-remove"
          >
            Remove
          </button>
        </span>
      </trn-settings-row>
    }
  }

  <div class="flex items-center gap-2 py-3">
    <input
      trnInput
      class="min-w-0 flex-1"
      [formField]="keywordForm.word"
      placeholder="Add a word…"
      autocomplete="off"
      aria-label="Add a keyword"
      (keydown.enter)="onEnter($event)"
      data-testid="keyword-input"
    />
    <button
      trnBtn
      type="button"
      presentation="outline"
      size="sm"
      [disabled]="adding() || nothingTyped() || isLoading()"
      (click)="add()"
      data-testid="keyword-add"
    >
      {{ adding() ? 'Adding…' : 'Add' }}
    </button>
  </div>
</trn-settings-group>

<!-- `[formRoot]` sets novalidate and prevents the native submit. -->
<form [formRoot]="reportForm" (submit)="openGitHub()">
  <trn-dialog-shell
    title="Report a bug"
    size="md"
    closeLabel="Close Report a bug"
    (closed)="close()"
  >
    <div class="flex flex-col gap-4">
      <div>
        <label trnLabel for="report-bug-description">What went wrong?</label>
        <textarea
          id="report-bug-description"
          trnTextarea
          class="mt-1 min-h-24 w-full resize-y"
          [formField]="reportForm.description"
          [attr.aria-describedby]="descriptionDescribedBy()"
          data-autofocus
          data-testid="report-bug-description"
        ></textarea>
        <p
          id="report-bug-description-hint"
          class="m-0 pt-1 text-13 text-muted-foreground"
        >
          Optional. It fills in the GitHub issue and is not stored.
        </p>
        @if (descriptionError(); as error) {
          <p
            id="report-bug-description-error"
            role="alert"
            class="m-0 pt-1 text-13 text-danger"
            data-testid="report-bug-description-error"
          >
            {{ error }}
          </p>
        }
      </div>

      <p
        class="m-0 text-13 text-muted-foreground"
        id="report-bug-public-note"
        data-testid="report-bug-public-note"
      >
        GitHub issues are public. Don’t put Matrix IDs, room names or other
        private details in your description.
      </p>
      @if (openFailed()) {
        <p
          class="m-0 text-13 text-danger"
          role="alert"
          data-testid="report-bug-open-error"
        >
          Couldn’t open GitHub. Check your connection. Try again.
        </p>
      }
    </div>

    <div trnDialogActions>
      <button
        trnBtn
        type="submit"
        [disabled]="!canOpenGitHub()"
        data-testid="report-bug-github"
      >
        Open bug report on GitHub
      </button>
    </div>
  </trn-dialog-shell>
</form>

<trn-settings-group
  title="Diagnostics"
  description="Report a problem to the developers, and choose whether this device keeps a log."
>
  <trn-settings-row
    label="Keep a diagnostic log"
    description="Trinity keeps up to two days of Trinity and Matrix logs on this device. They never leave it. Tokens, keys and messages are never stored. Turning this off deletes the log."
    for="advanced-keep-diagnostic-log-switch"
    [attr.aria-busy]="pending() ? 'true' : null"
    data-testid="advanced-keep-diagnostic-log"
  >
    <trn-switch
      inputId="advanced-keep-diagnostic-log-switch"
      aria-describedby="advanced-keep-diagnostic-log-switch-description"
      [checked]="keepLog()"
      [disabled]="pending() || saving()"
      (checkedChange)="setKeepLog($event)"
    />
  </trn-settings-row>
  @if (keepLog()) {
    <trn-settings-row
      label="Detailed logging"
      description="Also keeps Matrix debug details, which help with sync and encryption problems. This uses more storage and battery, so it stays on only until you close or reload Trinity."
      for="advanced-detailed-diagnostic-log-switch"
      data-testid="advanced-detailed-diagnostic-log"
    >
      <trn-switch
        inputId="advanced-detailed-diagnostic-log-switch"
        aria-describedby="advanced-detailed-diagnostic-log-switch-description"
        [checked]="detailedLog()"
        (checkedChange)="setDetailedLog($event)"
      />
    </trn-settings-row>
  }
  <div class="flex flex-wrap items-center gap-2 py-3">
    <button
      trnBtn
      size="sm"
      (click)="openReport()"
      data-testid="advanced-report-bug"
    >
      Report a bug
    </button>
    @if (canClear()) {
      <button
        trnBtn
        presentation="outline"
        size="sm"
        [disabled]="clearing()"
        (click)="clear()"
        data-testid="advanced-clear-diagnostic-logs"
      >
        Clear diagnostic logs
      </button>
    }
  </div>
  @if (notDeleted()) {
    <p
      class="m-0 py-3 text-13 text-danger"
      role="alert"
      data-testid="advanced-diagnostics-not-deleted"
    >
      The log is turned off, but Trinity couldn’t delete it from this device.
      Use Clear diagnostic logs to try again.
    </p>
  }
  @if (memoryOnly()) {
    <p
      class="m-0 py-3 text-13 text-muted-foreground"
      data-testid="advanced-diagnostics-memory-only"
    >
      This device isn’t letting Trinity store logs, so they cover this session
      only.
    </p>
  }
</trn-settings-group>

<trn-page-header title="Settings">
  <button
    trnHeaderLeading
    trnBtn
    variant="ghost"
    size="icon"
    trnTooltip="Back"
    aria-label="Back"
    (click)="goBack()"
  >
    <trn-icon name="arrow-left" motion="nudge-left" />
  </button>
</trn-page-header>

<!-- Parent-height, not viewport-height: Electron's title-bar inset and the app shell already
     took their space before this page was laid out. The frame therefore cannot enlarge the
     document or become a second scroll owner in short windows. -->
<div class="settings-stage">
  <div class="settings-workspace" data-testid="settings-workspace">
    <nav
      #nav
      class="settings-nav no-scrollbar"
      aria-label="Settings sections"
      [class.settings-pane--hidden]="sectionActive() && !wide()"
    >
      @for (item of menu; track item.path; let index = $index) {
        @if (index === 0 || menu[index - 1].group !== item.group) {
          <p class="settings-nav__group">{{ item.group }}</p>
        }
        <!-- `is-active` carries no styles of its own; it is the hook the icon's
           active visual recipe keys on. On mobile the directory disappears when a detail
           opens; on desktop it remains the stable location cue. -->
        <a
          class="settings-nav__item"
          [routerLink]="item.path"
          [replaceUrl]="wide()"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          [attr.data-testid]="'settings-nav-' + item.path"
          (click)="onSectionNavigate()"
        >
          <trn-icon [name]="item.icon" class="settings-nav__icon" />
          <span class="settings-nav__label">{{ item.label }}</span>
          <!-- A mobile drill-in affordance; the sidebar shows the active highlight instead.
             NOT rendered rather than hidden with `md:hidden`: Tailwind's utilities live in
             `@layer utilities` and a component's own `:host { display: … }` is unlayered,
             and an unlayered author declaration beats a layered one whatever the
             specificity — so the class applies and does nothing. `wide()` is the same
             768px boundary the `md:` variant compiles to (both read MD_QUERY). -->
          @if (!wide()) {
            <trn-icon name="chevron-right" class="settings-nav__chevron" />
          }
        </a>
      }
      <p class="settings-nav__build" data-testid="settings-build">
        {{ buildLabel }}
      </p>
    </nav>
    <section
      #detail
      class="settings-detail"
      [class.settings-pane--hidden]="!sectionActive() && !wide()"
      data-testid="settings-detail"
    >
      <div class="settings-detail__content">
        <router-outlet (activate)="onSectionActivated()" />
      </div>
    </section>
  </div>
</div>

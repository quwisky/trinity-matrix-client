<trn-page-header title="Settings">
  <button
    trnHeaderLeading
    hlmBtn
    variant="ghost"
    size="icon"
    hlmTooltip="Back"
    aria-label="Back"
    (click)="goBack()"
  >
    <trn-icon name="arrow-left" />
  </button>
</trn-page-header>

<div class="settings" [class.settings--detail]="sectionActive()">
  <nav class="settings__menu" aria-label="Settings sections">
    @for (item of menu; track item.path) {
      <a
        class="settings__item"
        [routerLink]="item.path"
        [replaceUrl]="wide()"
        routerLinkActive="settings__item--active"
        ariaCurrentWhenActive="page"
        [attr.data-testid]="'settings-nav-' + item.path"
      >
        <trn-icon [name]="item.icon" class="settings__item-icon" />
        <span class="settings__item-label">{{ item.label }}</span>
        <trn-icon name="chevron-right" class="settings__item-chevron" />
      </a>
    }
    <p class="settings__build" data-testid="settings-build">{{ buildLabel }}</p>
  </nav>
  <section class="settings__detail">
    <router-outlet />
  </section>
</div>

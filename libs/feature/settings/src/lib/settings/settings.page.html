<trn-settings-layout
  title="Settings"
  [sections]="layoutSections()"
  [selectedSection]="activePath()"
  [heading]="activeLabel()"
  [initialPart]="partTarget()"
  [compact]="!wide()"
  [directoryVisible]="wide() || !sectionActive()"
  testId="settings-dialog"
  navItemTestIdPrefix="settings-nav-"
  detailTestId="settings-detail"
  closeTestId="close-settings"
  (partSelected)="onPartSelected($event)"
  (sectionSelected)="selectSection($event)"
  (backRequested)="goBack()"
  (closeRequested)="close()"
>
  <trn-settings-directory-search
    settings-directory-header
    [(query)]="query"
    [count]="menu().length"
    [results]="results()"
    (resultSelected)="openResult($event)"
  />
  <router-outlet
    #outlet
    (activate)="markRoutedPage(outlet); onSectionActivated()"
  />
  <p settings-nav-footer data-testid="settings-build">
    {{ buildLabel }}
    @if (notes.length && whatsNew) {
      <span class="whitespace-nowrap"
        >·
        <button
          trnBtn
          type="button"
          presentation="link"
          shape="inline"
          size="xs"
          data-testid="settings-whats-new"
          (click)="whatsNew.showAll()"
        >
          What's new
        </button></span
      >
    }
  </p>
</trn-settings-layout>

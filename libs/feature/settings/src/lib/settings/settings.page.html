<trn-settings-layout
  title="Settings"
  [sections]="layoutSections()"
  [selectedSection]="activePath()"
  [heading]="activeLabel()"
  [initialPart]="partTarget()"
  [compact]="!wide()"
  [directoryVisible]="wide() || !sectionActive()"
  testId="settings-dialog"
  navItemTestIdPrefix="settings-nav-"
  detailTestId="settings-detail"
  closeTestId="close-settings"
  (partSelected)="onPartSelected($event)"
  (sectionSelected)="selectSection($event)"
  (backRequested)="goBack()"
  (closeRequested)="close()"
>
  <trn-settings-directory-search
    settings-directory-header
    [(query)]="query"
    [count]="menu().length"
    [results]="results()"
    (resultSelected)="openResult($event)"
  />
  <router-outlet (activate)="onSectionActivated()" />
  <p settings-nav-footer data-testid="settings-build">{{ buildLabel }}</p>
</trn-settings-layout>

<trn-settings-group
  title="Experimental"
  description="Try unfinished features that may still change or behave unexpectedly."
>
  <trn-settings-row
    label="Virtualized timeline"
    description="Renders only the messages currently on screen, keeping memory low and scrolling smooth in very long rooms."
    data-testid="flag-virtual-timeline"
  >
    <trn-switch
      aria-label="Virtualized timeline"
      [checked]="flags.virtualTimeline()"
      (checkedChange)="flags.setVirtualTimeline($event)"
    />
  </trn-settings-row>
</trn-settings-group>

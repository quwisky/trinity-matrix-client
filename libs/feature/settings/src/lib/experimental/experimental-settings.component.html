<trn-settings-section-heading title="Experimental" [primary]="true" />
<label trnSettingsToggleRow data-testid="flag-virtual-timeline">
  <trn-switch
    [checked]="flags.virtualTimeline()"
    (checkedChange)="flags.setVirtualTimeline($event)"
  />
  Virtualized timeline
</label>
<p class="block px-4 py-2 text-13 text-muted-foreground">
  Renders only the messages currently on screen, keeping memory low and
  scrolling smooth in very long rooms.
</p>

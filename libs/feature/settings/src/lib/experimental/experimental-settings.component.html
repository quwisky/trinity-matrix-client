<trn-settings-group
  description="Try unfinished features that may still change or behave unexpectedly."
>
  <trn-settings-row
    label="Virtualized timeline"
    description="Renders only the messages currently on screen, keeping memory low and scrolling smooth in very long rooms."
    for="flag-virtual-timeline-switch"
    data-testid="flag-virtual-timeline"
  >
    <trn-switch
      inputId="flag-virtual-timeline-switch"
      aria-describedby="flag-virtual-timeline-switch-description"
      [checked]="flags.virtualTimeline()"
      (checkedChange)="flags.setVirtualTimeline($event)"
    />
  </trn-settings-row>
  <trn-settings-row
    label="Load images after fast scrolling"
    description="Images in the timeline wait until scrolling slows down, which uses less memory."
    for="flag-defer-media-switch"
    data-testid="flag-defer-media"
  >
    <trn-switch
      inputId="flag-defer-media-switch"
      aria-describedby="flag-defer-media-switch-description"
      [checked]="flags.deferMediaWhileScrolling()"
      (checkedChange)="flags.setDeferMediaWhileScrolling($event)"
    />
  </trn-settings-row>
  <trn-settings-row
    label="Blank rows while scrolling fast"
    description="Messages that fly past show as blank space until scrolling slows down, which uses less memory. Needs Virtualized timeline."
    for="flag-fling-placeholders-switch"
    data-testid="flag-fling-placeholders"
  >
    <trn-switch
      inputId="flag-fling-placeholders-switch"
      aria-describedby="flag-fling-placeholders-switch-description"
      [checked]="flags.flingPlaceholders()"
      (checkedChange)="flags.setFlingPlaceholders($event)"
    />
  </trn-settings-row>
</trn-settings-group>

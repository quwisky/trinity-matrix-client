@if (supported && loaded()) {
  <trn-settings-group
    title="Window"
    description="Choose how the desktop app draws its window frame."
    data-testid="appearance-window"
  >
    <trn-settings-row
      label="Use system title bar"
      description="Show your operating system's window frame and menu bar instead of Trinity's title row."
    >
      <trn-switch
        data-testid="system-title-bar-toggle"
        aria-label="Use system title bar"
        [checked]="saved()"
        (checkedChange)="onChange($event)"
      />
    </trn-settings-row>
    @if (failed()) {
      <p
        role="alert"
        class="m-0 pt-3 text-13 text-danger"
        data-testid="system-title-bar-error"
      >
        This choice could not be saved.
      </p>
    }
    @if (needsRestart()) {
      <div
        class="flex flex-wrap items-center justify-between gap-2 pt-3 text-13"
        data-testid="system-title-bar-restart-prompt"
      >
        <span>Restart to apply</span>
        <button
          trnBtn
          type="button"
          presentation="outline"
          size="sm"
          data-testid="system-title-bar-restart"
          (click)="restart()"
        >
          Restart
        </button>
      </div>
    }
  </trn-settings-group>
}

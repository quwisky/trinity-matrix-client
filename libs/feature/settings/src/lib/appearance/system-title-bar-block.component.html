@if (supported && loaded()) {
  <trn-settings-group
    title="Window"
    description="Choose how the desktop app draws its window frame."
    data-testid="appearance-window"
  >
    <label trnSettingsToggleRow>
      <trn-switch
        data-testid="system-title-bar-toggle"
        [checked]="saved()"
        (checkedChange)="onChange($event)"
      />
      <span class="min-w-0">
        <strong class="block text-sm font-semibold"
          >Use system title bar</strong
        >
        <small class="block text-13 text-[var(--trinity-text-muted)]"
          >Show your operating system's window frame and menu bar instead of
          Trinity's title row.</small
        >
      </span>
    </label>
    @if (failed()) {
      <p
        role="alert"
        class="text-13 text-danger"
        data-testid="system-title-bar-error"
      >
        This choice could not be saved.
      </p>
    }
    @if (needsRestart()) {
      <div
        class="flex flex-wrap items-center justify-between gap-2 text-13"
        data-testid="system-title-bar-restart-prompt"
      >
        <span>Restart to apply</span>
        <button
          trnBtn
          type="button"
          presentation="outline"
          size="sm"
          data-testid="system-title-bar-restart"
          (click)="restart()"
        >
          Restart
        </button>
      </div>
    }
  </trn-settings-group>
}

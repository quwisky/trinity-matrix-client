<trn-settings-group
  title="Message gestures"
  description="Choose what a sideways drag does on phones and other touch-first devices."
>
  <trn-settings-row
    label="Swipe action"
    labelId="appearance-message-swipe-heading"
    description="The revealed icon confirms the action before release"
  >
    <trn-select
      class="w-48 max-sm:w-full"
      data-testid="message-swipe-select"
      aria-labelledby="appearance-message-swipe-heading"
      placeholder="Select a direction"
      [options]="swipeOptions"
      [value]="gestures.messageSwipe()"
      (valueChange)="onMessageSwipeChange($event)"
    />
  </trn-settings-row>
  <p class="m-0 pt-3 text-sm text-[var(--trinity-text-muted)]">
    Off by default because a timeline swipe can compete with your phone's own
    back gesture.
  </p>
</trn-settings-group>

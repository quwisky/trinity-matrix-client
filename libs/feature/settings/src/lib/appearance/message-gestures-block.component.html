<trn-settings-group
  title="Message gestures"
  headingId="appearance-message-gestures-heading"
  description="Choose what a sideways drag does on phones and other touch-first devices."
>
  <div trnSettingsFieldRow>
    <span class="min-w-0">
      <strong
        id="appearance-message-swipe-heading"
        class="block text-sm font-semibold text-[var(--trinity-text-bright)]"
        >Swipe action</strong
      >
      <small class="block text-13 text-[var(--trinity-text-muted)]"
        >The revealed icon confirms the action before release</small
      >
    </span>
    <trn-select
      data-testid="message-swipe-select"
      aria-labelledby="appearance-message-swipe-heading"
      placeholder="Select a direction"
      triggerClass="w-full"
      [options]="swipeOptions"
      [value]="gestures.messageSwipe()"
      (valueChange)="onMessageSwipeChange($event)"
    />
  </div>
  <p class="text-13 text-[var(--trinity-text-muted)]">
    Off by default because a timeline swipe can compete with your phone's own
    back gesture.
  </p>
</trn-settings-group>

<trn-settings-group
  title="Devices"
  description="Review, verify, rename and sign out devices connected to this account."
>
  @for (device of devices(); track device.id) {
    <trn-settings-row
      [label]="device.displayName"
      [description]="
        device.id +
        (device.lastSeenIp ? ' · Last seen from ' + device.lastSeenIp : '')
      "
      data-testid="device-row"
    >
      <div class="flex flex-wrap items-center justify-end gap-1.5">
        @if (device.isCurrent) {
          <span trnBadge>This device</span>
        }
        @if (device.isVerified) {
          <span trnBadge variant="success">Verified</span>
        } @else {
          <span trnBadge variant="warning">Unverified</span>
        }
        <button
          trnBtn
          presentation="ghost"
          shape="icon"
          size="md"
          [disabled]="busy()"
          [trnTooltip]="'Rename ' + device.displayName"
          [attr.aria-label]="'Rename ' + device.displayName"
          data-testid="rename-device"
          (click)="rename(device)"
        >
          <trn-icon name="pencil" size="md" motion="nudge-up-right" />
        </button>
        @if (!device.isCurrent) {
          <button
            trnBtn
            variant="danger"
            presentation="ghost"
            shape="icon"
            size="md"
            [disabled]="busy()"
            [trnTooltip]="'Sign out ' + device.displayName"
            [attr.aria-label]="'Sign out ' + device.displayName"
            data-testid="remove-device"
            (click)="remove(device)"
          >
            <trn-icon name="trash-2" size="md" motion="nudge-down" />
          </button>
        }
      </div>
    </trn-settings-row>
  } @empty {
    @if (loading()) {
      <p class="m-0 py-3 text-13 text-muted-foreground" aria-live="polite">
        Loading devices…
      </p>
    }
  }

  @if (error(); as e) {
    <p class="m-0 py-3 text-13 text-danger" role="alert" aria-live="assertive">
      {{ e }}
    </p>
  }

  @if (hasUnverified()) {
    <div class="py-3">
      <button
        trnBtn
        presentation="ghost"
        size="sm"
        data-testid="verify-devices"
        (click)="verifyDevices()"
      >
        <trn-icon name="shield-check" size="md" />
        Verify another session
      </button>
    </div>
  }
</trn-settings-group>

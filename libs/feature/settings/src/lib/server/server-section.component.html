<trn-settings-group
  description="See what each signed-in account's homeserver is running."
>
  <trn-settings-row
    label="Checked once per session"
    description="Use Check again to see whether anything has changed since. Some servers do not publish their software version, and those simply read “Unknown”."
  >
    @if (accounts().length) {
      <button
        trnBtn
        presentation="ghost"
        size="sm"
        data-testid="server-check-again"
        [disabled]="refreshing()"
        (click)="checkAgain()"
      >
        {{ refreshing() ? 'Checking…' : 'Check again' }}
      </button>
    }
  </trn-settings-row>

  @for (userId of accounts(); track userId) {
    <trn-homeserver-block [userId]="userId" />
  } @empty {
    <p class="m-0 py-3 text-13 text-muted-foreground">
      No account is signed in.
    </p>
  }

  @if (showBuildLine()) {
    <p
      class="m-0 py-3 text-13 text-muted-foreground"
      data-testid="server-build"
    >
      {{ buildLabel }}
    </p>
  }

  @if (refreshError(); as message) {
    <p class="m-0 py-3 text-13 text-danger" role="alert">{{ message }}</p>
  }
</trn-settings-group>

<trn-settings-group
  title="Profile"
  description="Manage the name and avatar people see across Matrix."
>
  @if (profile(); as p) {
    <div class="flex items-center gap-3 py-3">
      <div class="relative shrink-0">
        <trn-avatar
          [mxc]="p.avatarMxc"
          [name]="p.displayName || p.userId"
          [initial]="initial()"
          size="2xl"
          [exactSize]="64"
        />
        <button
          type="button"
          trnIconButton
          class="absolute -right-1 -bottom-1 grid size-7 place-items-center rounded-full border-2 border-solid border-background bg-primary text-sm text-primary-foreground shadow-raised transition-colors hover:bg-primary/90 disabled:pointer-events-none disabled:opacity-60"
          [disabled]="savingAvatar()"
          (click)="pickAvatar()"
          trnTooltip="Change profile picture"
          [attr.aria-label]="
            savingAvatar()
              ? 'Uploading profile picture'
              : 'Change profile picture'
          "
          data-testid="change-avatar"
        >
          <trn-icon
            [name]="savingAvatar() ? 'loader-circle' : 'camera'"
            motion="pop"
            [class.animate-spin]="savingAvatar()"
          />
        </button>
      </div>
      <div class="min-w-0 flex-1">
        <div
          class="truncate text-sm font-medium text-foreground"
          data-testid="profile-display-name"
        >
          {{ p.displayName || p.userId }}
        </div>
        <div class="truncate text-xs text-muted-foreground">
          {{ p.userId }}
        </div>
      </div>
    </div>
    <trn-settings-row label="Display name" for="display-name">
      <div class="flex items-center gap-2">
        <input
          id="display-name"
          trnInput
          class="w-56 max-sm:min-w-0 max-sm:flex-1"
          [value]="nameDraft()"
          (input)="onNameInput($event)"
          data-testid="display-name-input"
        />
        <button
          trnBtn
          size="sm"
          class="shrink-0"
          [disabled]="savingName() || !nameDirty()"
          (click)="saveName()"
          data-testid="save-name"
        >
          Save
        </button>
      </div>
    </trn-settings-row>
  } @else if (loading()) {
    <p class="m-0 py-3 text-sm text-muted-foreground">Loading profile…</p>
  }
  @if (error(); as e) {
    <p class="m-0 py-3 text-13 text-danger">{{ e }}</p>
  }
</trn-settings-group>
<input
  #avatarInput
  type="file"
  accept="image/*"
  hidden
  data-testid="avatar-input"
  (change)="onAvatarPicked($event)"
/>

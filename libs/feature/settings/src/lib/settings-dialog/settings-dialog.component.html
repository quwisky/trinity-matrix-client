<trn-settings-layout
  title="Settings"
  [sections]="layoutSections"
  [selectedSection]="selectedPath()"
  [compact]="!wide()"
  [directoryVisible]="wide() || !selectedPath()"
  testId="settings-dialog"
  navItemTestIdPrefix="settings-nav-"
  detailTestId="settings-detail"
  closeTestId="close-settings"
  (sectionSelected)="selectSection($event); clearRouteFocusTargets()"
  (backRequested)="goBackOrClose()"
  (closeRequested)="close()"
>
  @if (selectedSection(); as section) {
    <ng-container
      [ngComponentOutlet]="section.component"
      [ngComponentOutletInputs]="sectionInputs()"
      [ngComponentOutletInjector]="sectionInjector(section)"
    />
  }
  <p settings-nav-footer data-testid="settings-build">{{ buildLabel }}</p>
</trn-settings-layout>

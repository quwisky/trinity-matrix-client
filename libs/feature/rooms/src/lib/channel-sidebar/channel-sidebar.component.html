<div class="sidebar">
  <trn-sidebar-space-header
    [spaceName]="spaceName()"
    [spaceActive]="spaceActive()"
    [showSwitcher]="showSwitcher()"
    [hasAnyUnread]="hasAnyUnread()"
    [canConfigureSpace]="canConfigureSpace()"
    [canCurateSpace]="canCurateSpace()"
    [curateSpaceReason]="curateSpaceReason()"
    [canInviteToSpace]="canInviteToSpace()"
    [inviteToSpaceReason]="inviteToSpaceReason()"
    [sortMode]="sortMode()"
    [sortOverridden]="sortOverridden()"
    [defaultSortMode]="defaultSortMode()"
    (spaceAction)="onSpaceAction($event)"
  />

  <!-- Persistent rather than a toggled affordance: the point of this box over the Ctrl/Cmd+K
       switcher is that the narrowed list STAYS on screen while you work through it, so the
       control that produced it has to stay visible too. -->
  <div class="sidebar__filter">
    <input
      #filterBox
      trnInput
      class="h-8 w-full pr-8 text-sm"
      type="text"
      [value]="filterQuery()"
      (input)="filterQuery.set($any($event.target).value)"
      (keydown.escape)="onFilterEscape($event)"
      placeholder="Filter rooms"
      aria-label="Filter rooms"
      autocomplete="off"
      spellcheck="false"
      data-testid="sidebar-filter"
    />
    @if (filterActive()) {
      <!-- Focus goes back to the box: this button removes ITSELF from the DOM, so without
           that the active element falls back to <body> and the next Tab restarts from the
           top of the document. -->
      <button
        trnIconButton
        class="sidebar__filter-clear"
        (click)="clearFilter(); filterBox.focus()"
        aria-label="Clear filter"
        trnTooltip="Clear filter"
        data-testid="sidebar-filter-clear"
      >
        <trn-icon name="x" motion="rotate" />
      </button>
    }
  </div>
  <!-- The list narrows visually with no announcement, so a screen-reader user gets no
       feedback at all from typing. Polite, and only while filtering, so it never speaks
       over the unfiltered list. -->
  <p
    class="sr-only"
    role="status"
    aria-live="polite"
    data-testid="sidebar-filter-status"
  >
    {{ filterActive() ? filterStatus() : '' }}
  </p>

  <div class="sidebar__scroll">
    <trn-sidebar-room-list
      [rooms]="rooms()"
      [typingByRoom]="typingByRoom()"
      [invites]="filteredInvites()"
      [filterActive]="filterActive()"
      [activeRoomId]="activeRoomId()"
      [activeUserId]="activeUserId()"
      [spaceActive]="spaceActive()"
      [canCurateSpace]="canCurateSpace()"
      [curateSpaceReason]="curateSpaceReason()"
      [accountBadges]="accountBadges()"
      (selectRoom)="selectRoom.emit($event)"
      (leaveRoom)="leaveRoom.emit($event)"
      (removeRoom)="removeRoom.emit($event)"
      (setNotifyMode)="setNotifyMode.emit($event)"
      (markRead)="markRead.emit($event)"
      (markUnread)="markUnread.emit($event)"
      (previewInvite)="previewInvite.emit($event)"
      (acceptInvite)="acceptInvite.emit($event)"
      (declineInvite)="declineInvite.emit($event)"
      (favouriteChange)="favouriteChange.emit($event)"
      (priorityChange)="priorityChange.emit($event)"
    />
    @if (spaceActive()) {
      <trn-space-children-list
        [filter]="normalizedFilter()"
        (join)="joinRoom.emit($event)"
        (open)="openChildSpace.emit($event)"
      />
    }
  </div>
</div>

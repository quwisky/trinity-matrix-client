<div
  trnOverlaySurface
  variant="neutral"
  size="md"
  layout="fullscreen"
  class="flex flex-col"
  data-testid="thread-view"
>
  <trn-side-panel-header
    title="Thread"
    [subtitle]="roomName()"
    closeLabel="Close thread"
    [focusClose]="true"
    (closed)="close()"
  />

  @if (loading()) {
    <div class="thread__loading flex-1" role="status">Loading thread…</div>
  } @else {
    <trn-message-list
      [messages]="messages()"
      [loadingOlder]="loadingOlder()"
      [canLoadOlder]="canLoadOlder()"
      [oldestEventId]="messages()[0]?.id ?? null"
      [roomId]="roomId()"
      [resetKey]="rootEventId()"
      [accountId]="accountId()"
      [canRedactOthers]="canRedactOthers()"
      [swipeDirection]="swipeDirection()"
      [composerEnabled]="false"
      [canThread]="false"
      [canPin]="false"
      [pinnedIds]="[]"
      [firstUnreadId]="null"
      [threadSummaries]="{}"
      [quoteInto]="quoteIntoComposer"
      [jumpToId]="jumpToId()"
      [jumpToNonce]="jumpToNonce()"
      [introShown]="!messages().length"
      (loadOlder)="loadOlder()"
      (react)="onReact($event.id, $event.key)"
      (retry)="onRetry($event)"
      (cancelSend)="onCancelSend($event)"
      (deleteMessage)="onDelete($event)"
      (pollVote)="onPollVote($event)"
      (pollEnd)="onPollEnd($event)"
    >
      @if (!messages().length) {
        <trn-empty-state
          trnMessageListIntro
          body="No replies in this thread yet."
        />
      }
    </trn-message-list>
  }

  <div class="thread__footer">
    <trn-typing-indicator [names]="typingNames()" [announce]="false" />
    <trn-message-composer
      [accountId]="accountId()"
      placeholder="Reply…"
      [roomId]="draftKey()"
      [members]="members()"
      [richActions]="false"
      [postUnavailableReason]="postUnavailableReason()"
      [sendBlocked]="loading()"
      [editing]="editingId() !== null"
      [editTargetId]="editingId()"
      [draft]="editingDraft()"
      [replyingTo]="replyingToName()"
      [textSending]="editSending()"
      [uploadProgress]="uploadProgress()"
      (submitText)="onSubmit($event)"
      (submitBatchCaption)="onBatchCaption($event)"
      (submitMedia)="onSendMedia($event)"
      (cancelEdit)="onCancelEdit()"
      (cancelReply)="onCancelReply()"
      (editLast)="editLastOwn()"
      (typing)="onTyping($event)"
    />
  </div>
</div>

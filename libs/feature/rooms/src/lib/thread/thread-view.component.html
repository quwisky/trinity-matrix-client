<div
  trnOverlaySurface
  variant="neutral"
  size="md"
  layout="fullscreen"
  class="safe-bottom flex flex-col"
  data-testid="thread-view"
>
  <trn-side-panel-header
    title="Thread"
    closeLabel="Close thread"
    [focusClose]="true"
    (closed)="close()"
  />

  <div
    class="thread flex-1 overflow-y-auto max-members:touch-pan-y"
    #scroll
    data-message-scroller
  >
    @if (loadingOlder()) {
      <div class="thread__load-older">Loading older replies…</div>
    } @else if (canLoadOlder()) {
      <button type="button" class="thread__load-older" (click)="loadOlder()">
        Load older replies
      </button>
    }

    @for (row of rows(); track row.id) {
      <trn-message-row
        [row]="row"
        [caps]="rowCaps(row)"
        (action)="onRowAction(row, $event)"
        (longPress)="onRowLongPress(row, $event)"
        [swipeDirection]="swipeDirection()"
        (swipe)="onRowSwipe(row, $event)"
        (pollVote)="onPollVote($event)"
        (pollEnd)="onPollEnd($event)"
      />
    } @empty {
      <trn-empty-state body="No replies in this thread yet." />
    }
  </div>

  <div class="thread__footer">
    <trn-typing-indicator [names]="typingNames()" [announce]="false" />
    <trn-message-composer
      [accountId]="accountId()"
      placeholder="Reply…"
      [roomId]="rootEventId()"
      [members]="members()"
      [richActions]="false"
      [editing]="editingId() !== null"
      [editTargetId]="editingId()"
      [draft]="editingDraft()"
      [replyingTo]="replyingToName()"
      [uploadProgress]="uploadProgress()"
      (submitText)="onSubmit($event)"
      (submitBatchCaption)="onBatchCaption($event)"
      (submitMedia)="onSendMedia($event)"
      (cancelEdit)="editingId.set(null)"
      (cancelReply)="replyingToId.set(null)"
      (editLast)="editLastOwn()"
      (typing)="onTyping($event)"
    />
  </div>
</div>

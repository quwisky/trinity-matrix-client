<trn-side-panel
  heading="Threads"
  icon="message-square"
  closeLabel="Close threads"
  (closed)="close()"
>
  @for (t of threads(); track t.rootEventId) {
    <button
      type="button"
      class="thread-item"
      (click)="openThread(t.rootEventId)"
    >
      <div class="thread-item__avatars" aria-hidden="true">
        @for (p of t.participants.slice(0, maxAvatars); track p.id) {
          <trn-avatar
            class="thread-item__avatar"
            [mxc]="p.avatarMxc"
            [initial]="p.initial"
            [name]="p.name"
            size="sm"
          />
        }
        @if (t.participants.length > maxAvatars) {
          <span class="thread-item__more"
            >+{{ t.participants.length - maxAvatars }}</span
          >
        }
      </div>

      <div class="thread-item__body">
        <div class="thread-item__head">
          <span class="thread-item__root">
            @if (t.rootShield; as shield) {
              <trn-unencrypted-mark [shield]="shield" />
            }
            {{ t.rootPreview || 'Thread' }}</span
          >
          <span class="thread-item__time">{{
            fmt.dateTime(t.latestActivityTs)
          }}</span>
        </div>
        <div class="thread-item__meta">
          <span class="thread-item__count"
            >{{ t.replyCount }}
            {{ t.replyCount === 1 ? 'reply' : 'replies' }}</span
          >
          @if (t.latestReplyPreview) {
            <span class="thread-item__sep" aria-hidden="true">·</span>
            <span class="thread-item__last">
              @if (t.latestReplySenderName) {
                <span class="thread-item__last-author"
                  >{{ t.latestReplySenderName }}:
                </span>
              }
              @if (t.latestReplyShield; as shield) {
                <trn-unencrypted-mark [shield]="shield" />
              }
              {{ t.latestReplyPreview }}
            </span>
          }
        </div>
      </div>

      @if (t.unreadCount > 0) {
        <span
          trnBadge
          class="shrink-0"
          [variant]="t.highlight ? 'danger' : 'neutral'"
          [attr.aria-label]="unreadLabel(t)"
          >{{ t.unreadCount }}</span
        >
      }
    </button>
  } @empty {
    <trn-side-panel-empty
      icon="message-square"
      heading="No threads yet"
      body="Reply to a message in a thread to start one. Every thread in this room shows up here."
    />
  }
</trn-side-panel>

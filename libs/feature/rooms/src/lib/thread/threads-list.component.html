<trn-side-panel
  heading="Threads"
  icon="message-square"
  closeLabel="Close threads"
  (closed)="close()"
>
  @for (group of groups(); track group.key) {
    <h3 class="threads__section" data-testid="threads-section">
      {{ group.label }}
    </h3>
    @for (t of group.threads; track t.rootEventId) {
      <button
        type="button"
        class="thread-item"
        (click)="openThread(t.rootEventId)"
      >
        @if (authorOf(t); as author) {
          <trn-avatar
            [mxc]="author.avatarMxc"
            [initial]="author.initial"
            [name]="author.name"
            size="lg"
          />
        } @else {
          <trn-avatar initial="?" name="Thread" size="lg" />
        }

        <span class="thread-item__body">
          <span class="thread-item__head">
            <span class="thread-item__root">
              @if (t.rootShield; as shield) {
                <trn-unencrypted-mark [shield]="shield" />
              }
              {{ t.rootPreview || 'Thread' }}</span
            >
            @if (t.unreadCount > 0) {
              <span
                trnBadge
                variant="danger"
                size="sm"
                class="thread-item__badge"
                [attr.aria-label]="unreadLabel(t)"
                >{{ t.unreadCount }}</span
              >
            }
          </span>
          <span class="thread-item__meta">{{ metaLine(t) }}</span>
          @if (othersIn(t); as others) {
            @if (others.length) {
              <span class="thread-item__stack" aria-hidden="true">
                @for (p of others; track p.id) {
                  <trn-avatar
                    class="thread-item__participant"
                    [mxc]="p.avatarMxc"
                    [initial]="p.initial"
                    [name]="p.name"
                    size="xs"
                  />
                }
              </span>
            }
          }
        </span>
      </button>
    }
  } @empty {
    <trn-side-panel-empty
      icon="message-square"
      heading="No threads yet"
      body="Reply to a message in a thread to start one. Every thread in this room shows up here."
    />
  }
</trn-side-panel>

<trn-settings-hub
  testId="space-settings"
  noun="Space"
  [accountId]="accountId()"
  [accountName]="account().displayName"
  [accountAvatarMxc]="account().avatarMxc"
  [accountInitial]="accountInitial()"
  [targetName]="draft.model().name || spaceDisplayName()"
  [targetAvatarMxc]="draft.snapshot()?.identity?.avatarMxc ?? null"
  [targetInitial]="spaceInitial()"
  [sections]="sections"
  [selectedSection]="selectedSection()"
  [sectionTitle]="sectionTitle()"
  [compactNavigation]="compactNavigation()"
  [directoryVisible]="directoryVisible()"
  [mobileHost]="mobileHost"
  [unavailableReason]="draft.targetUnavailableReason()"
  (sectionSelected)="selectSection($event)"
  (directoryRequested)="showDirectory()"
  (closeRequested)="close()"
>
  @switch (selectedSection()) {
    @case ('general') {
      <trn-space-settings-general
        [accountId]="accountId()"
        [spaceId]="spaceId()"
        [spaceDisplayName]="spaceDisplayName()"
      />
    }
    @case ('for-you') {
      <trn-space-settings-for-you />
    }
    @case ('access') {
      <trn-space-settings-access />
    }
    @case ('members') {
      <section data-testid="space-settings-panel-members">
        <trn-members-settings
          [accountId]="accountId()"
          [roomId]="spaceId()"
          [targetName]="draft.model().name || spaceDisplayName()"
          noun="Space"
        />
      </section>
    }
    @case ('addresses') {
      <section
        class="space-settings__section-panel"
        data-testid="space-settings-panel-addresses"
      >
        @if (draft.targetUnavailableReason(); as reason) {
          <p class="space-settings__target-warning" role="status">
            {{ reason }}
          </p>
        } @else {
          <trn-room-aliases
            [accountId]="accountId()"
            [roomId]="spaceId()"
            noun="Space"
          />
        }
      </section>
    }
  }
</trn-settings-hub>

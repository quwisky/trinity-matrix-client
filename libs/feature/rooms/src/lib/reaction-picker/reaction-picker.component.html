<!--
  No `data-testid` here: the wrapper carries `emoji-picker` as a host attribute, and a
  template attribute of the same name REPLACES it (Angular merges the template's
  `TAttributes` over the directive's `hostAttrs`). The dialog is addressable by its
  accessible name instead.
-->
<!-- A phone's sheet already draws the card: the grid fills it with 44px touch cells, as the
     composer's expression sheet does. -->
<trn-dialog-shell title="Pick a reaction" [bodyClass]="sheet ? '' : 'p-0'">
  <trn-emoji-picker
    class="reaction-picker"
    [framed]="!sheet"
    [layout]="sheet ? 'fill' : 'fixed'"
    [size]="sheet ? 'lg' : 'md'"
    [recent]="recent()"
    (picked)="onSelect($event)"
  />
</trn-dialog-shell>

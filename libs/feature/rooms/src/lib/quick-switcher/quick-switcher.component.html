<div
  trnOverlaySurface
  variant="neutral"
  size="lg"
  layout="dialog"
  class="flex h-[60vh] max-h-[70vh] flex-col"
>
  <div class="flex items-center gap-2 border-b border-solid border-border p-3">
    <h2 class="flex-1 text-base font-semibold">Jump to…</h2>
    <button
      trnBtn
      variant="secondary"
      presentation="ghost"
      size="sm"
      (click)="dismiss(null)"
    >
      Cancel
    </button>
  </div>

  <div class="border-b border-solid border-border p-3">
    <input
      trnInput
      data-autofocus
      data-testid="switcher-input"
      placeholder="Search rooms, spaces, people"
      autocapitalize="off"
      autocorrect="off"
      inputmode="text"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="qs-results"
      [attr.aria-expanded]="results().length > 0"
      [attr.aria-activedescendant]="
        results().length ? 'qs-result-' + highlight() : null
      "
      [value]="query()"
      (input)="onInput($event)"
      (keydown.arrowDown)="move(1, $event)"
      (keydown.arrowUp)="move(-1, $event)"
      (keydown.enter)="choose($event)"
      (keydown.escape)="dismiss(null)"
    />
  </div>

  <!-- Focus stays in the input while the arrows move `highlight()`, so the active row
       is only announced via aria-activedescendant pointing at its id. -->
  <div
    id="qs-results"
    role="listbox"
    aria-label="Search results"
    class="flex-1 overflow-y-auto p-2"
  >
    @for (result of results(); track result.kind + result.id; let i = $index) {
      <button
        type="button"
        role="option"
        [id]="'qs-result-' + i"
        [attr.aria-selected]="i === highlight()"
        class="qs-row flex w-full items-center gap-3 rounded-md p-2 text-left hover:bg-accent"
        [class.bg-accent]="i === highlight()"
        data-testid="switcher-result"
        (click)="select(result)"
      >
        <trn-avatar
          [mxc]="result.avatarMxc"
          [accountId]="result.accountId ?? null"
          [initial]="result.initial"
          [name]="result.title"
          size="xl"
          [shape]="avatarShape(result)"
          [accountBadge]="badgeFor(result)"
        />
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium">{{
            result.title
          }}</span>
          @if (result.subtitle) {
            <span class="block truncate text-xs text-muted-foreground">{{
              result.subtitle
            }}</span>
          }
        </span>
        @if (result.encrypted) {
          <trn-icon class="qs-lock" name="lock" label="Encrypted" />
        }
        <trn-icon class="qs-kind" [name]="kindIcon(result.kind)" />
        <span class="text-xs text-muted-foreground">{{
          kindLabel(result.kind)
        }}</span>
      </button>
    } @empty {
      <!-- The live region is the WRAPPER, and stays mounted across the switch. Putting
           `aria-live` on each branch instead makes every state a different element, and a
           region that is inserted already carrying the attribute is not reliably announced —
           what screen readers act on is a mutation inside a region they already knew about.
           The hint after a search would simply go unread.

           The branch itself stays outside the component: the projected slot wins over `body`,
           and an `@if` that renders nothing still counts as content, so projecting the
           spinner conditionally would swallow the fallback and lose the hint on the page as
           well as off it. -->
      <div aria-live="polite">
        @if (searching()) {
          <trn-empty-state><trn-spinner /></trn-empty-state>
        } @else {
          <trn-empty-state [body]="emptyHint()" />
        }
      </div>
    }
  </div>
</div>

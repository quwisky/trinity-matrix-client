<div
  class="flex h-[60vh] max-h-[70vh] w-[92vw] max-w-140 flex-col overflow-hidden rounded-xl border border-solid border-border bg-card text-card-foreground shadow-lg"
>
  <div class="flex items-center gap-2 border-b border-solid border-border p-3">
    <h2 class="flex-1 text-base font-semibold">Jump to…</h2>
    <button hlmBtn variant="ghost" size="sm" (click)="dismiss(null)">
      Cancel
    </button>
  </div>

  <div class="border-b border-solid border-border p-3">
    <input
      trnInput
      data-autofocus
      data-testid="switcher-input"
      placeholder="Search rooms, spaces, people"
      autocapitalize="off"
      autocorrect="off"
      inputmode="text"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="qs-results"
      [attr.aria-expanded]="results().length > 0"
      [attr.aria-activedescendant]="
        results().length ? 'qs-result-' + highlight() : null
      "
      [value]="query()"
      (input)="onInput($event)"
      (keydown.arrowDown)="move(1, $event)"
      (keydown.arrowUp)="move(-1, $event)"
      (keydown.enter)="choose($event)"
      (keydown.escape)="dismiss(null)"
    />
  </div>

  <!-- Focus stays in the input while the arrows move `highlight()`, so the active row
       is only announced via aria-activedescendant pointing at its id. -->
  <div
    id="qs-results"
    role="listbox"
    aria-label="Search results"
    class="flex-1 overflow-y-auto p-2"
  >
    @for (result of results(); track result.kind + result.id; let i = $index) {
      <button
        type="button"
        role="option"
        [id]="'qs-result-' + i"
        [attr.aria-selected]="i === highlight()"
        class="qs-row flex w-full items-center gap-3 rounded-md p-2 text-left hover:bg-accent"
        [class.bg-accent]="i === highlight()"
        data-testid="switcher-result"
        (click)="select(result)"
      >
        <trn-avatar
          [mxc]="result.avatarMxc"
          [accountId]="result.accountId ?? null"
          [initial]="result.initial"
          [name]="result.title"
          [size]="40"
          [square]="result.kind === 'space'"
          [accountBadge]="badgeFor(result)"
        />
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium">{{
            result.title
          }}</span>
          @if (result.subtitle) {
            <span class="block truncate text-xs text-muted-foreground">{{
              result.subtitle
            }}</span>
          }
        </span>
        @if (result.encrypted) {
          <trn-icon class="qs-lock" name="lock" label="Encrypted" />
        }
        <trn-icon class="qs-kind" [name]="kindIcon(result.kind)" />
        <span class="text-xs text-muted-foreground">{{
          kindLabel(result.kind)
        }}</span>
      </button>
    } @empty {
      <!-- A spinner where the sentence goes while a directory lookup is in flight. Branched
           OUTSIDE the component rather than projecting an `@if`: the projected slot wins over
           `body`, and an `@if` that renders nothing still counts as content — so the fallback
           would never appear and the hint would be silently lost. -->
      @if (searching()) {
        <trn-empty-state aria-live="polite"><trn-spinner /></trn-empty-state>
      } @else {
        <trn-empty-state aria-live="polite" [body]="emptyHint()" />
      }
    }
  </div>
</div>

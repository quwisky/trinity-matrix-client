<div class="voice" data-testid="voice-message">
  <button
    type="button"
    trnIconButton
    class="voice__play"
    [attr.aria-label]="
      loading()
        ? 'Loading voice message'
        : playing()
          ? 'Pause voice message'
          : 'Play voice message'
    "
    [attr.aria-busy]="loading() ? 'true' : null"
    (click)="toggle()"
  >
    <trn-icon
      [name]="loading() ? 'loader-circle' : playing() ? 'pause' : 'play'"
      motion="pop"
    />
  </button>

  @if (failed()) {
    <span class="voice__error" role="status" data-testid="voice-error"
      >Couldn’t load this voice message. Try again.</span
    >
  } @else if (bars().length) {
    <div class="voice__wave" aria-hidden="true">
      @for (bar of bars(); track $index) {
        <span
          class="voice__bar"
          [class.voice__bar--played]="$index < playedBars()"
          [style.height.%]="barHeight(bar)"
        ></span>
      }
    </div>
  } @else {
    <div class="voice__wave voice__wave--empty" aria-hidden="true"></div>
  }

  <span class="voice__time" data-testid="voice-time">{{ timeLabel() }}</span>

  @if (src(); as clip) {
    <audio
      #audio
      class="voice__audio"
      [src]="clip"
      preload="metadata"
      (loadedmetadata)="onLoaded()"
      (play)="onPlay()"
      (pause)="onPause()"
      (timeupdate)="onTimeUpdate()"
      (ended)="onEnded()"
    ></audio>
  }
</div>

<trn-dialog-shell
  title="Emoji, GIFs and stickers"
  [titleHidden]="true"
  [closable]="false"
  bodyClass="p-0"
>
  <trn-expression-picker
    presentation="sheet"
    [panelId]="bridge().panelId"
    [gifEnabled]="bridge().gifEnabled()"
    [gifBusy]="bridge().gifBusy()"
    [stickerEnabled]="bridge().stickerEnabled()"
    [stickerPacks]="bridge().stickerPacks()"
    (emojiPick)="bridge().emojiPick($event)"
    (gifSelect)="bridge().gifSelect($event)"
    (stickerSelect)="bridge().stickerSelect($event)"
    (dismiss)="bridge().dismiss()"
    (manage)="bridge().manage()"
  />
  <!-- The sheet's one dismiss control a screen reader can reach: the handle is aria-hidden and
       the backdrop takes no focus. Last, so focus still starts in the picker's search, and
       hidden even when focused, since the sheet shows no close button. -->
  <button
    type="button"
    class="sr-only"
    data-testid="expression-sheet-close"
    (click)="bridge().dismiss()"
  >
    Close
  </button>
</trn-dialog-shell>

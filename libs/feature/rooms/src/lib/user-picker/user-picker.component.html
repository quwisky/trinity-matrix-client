<trn-dialog-shell [title]="title()" size="lg" (closed)="cancel()">
  <div class="picker">
    <div>
      <input
        trnInput
        data-autofocus
        [placeholder]="placeholder()"
        [attr.aria-label]="placeholder()"
        [aria-describedby]="note() ? 'user-picker-note' : null"
        autocapitalize="off"
        autocorrect="off"
        inputmode="text"
        [value]="term()"
        (input)="onInput($event)"
      />
      @if (note(); as note) {
        <p
          id="user-picker-note"
          class="picker__note"
          data-testid="user-picker-note"
        >
          <span>{{ note.text }}</span>
          @if (note.action; as action) {
            <button
              trnBtn
              type="button"
              presentation="link"
              size="sm"
              (click)="runNoteAction(action)"
            >
              {{ action.label }}
            </button>
          }
        </p>
      }
    </div>

    <div>
      @if (searching()) {
        <trn-empty-state layout="line" aria-live="polite"
          ><trn-spinner
        /></trn-empty-state>
      }
      @for (user of results(); track user.userId) {
        <button type="button" class="picker__result" (click)="choose(user)">
          <trn-avatar
            [mxc]="user.avatarMxc"
            [initial]="initialOf(user.displayName)"
            [name]="user.displayName"
            [exactSize]="36"
          />
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium">{{
              user.displayName
            }}</span>
            <span class="block truncate text-xs text-muted-foreground">{{
              user.userId
            }}</span>
          </span>
        </button>
      } @empty {
        @if (!searching()) {
          <trn-empty-state layout="line" [body]="emptyHint()" />
        }
      }
    </div>
  </div>

  <div trnDialogActions>
    <button trnBtn variant="secondary" presentation="link" (click)="cancel()">
      Cancel
    </button>
    <button trnBtn [disabled]="!canConfirm()" (click)="confirmTyped()">
      {{ confirmLabel() }}
    </button>
  </div>
</trn-dialog-shell>

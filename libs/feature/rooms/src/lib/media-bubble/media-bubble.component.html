@if (showError()) {
  <button
    type="button"
    class="media media--file media--error"
    (click)="download.emit()"
  >
    <span class="media__icon" aria-hidden="true">!</span>
    <span class="media__meta">
      <span class="media__name">{{ filename() }}</span>
      <span class="media__sub">Couldn’t load — download</span>
    </span>
  </button>
} @else if (kind() === 'image') {
  <button
    type="button"
    class="media media--image"
    [style.aspect-ratio]="aspectRatio()"
    [attr.aria-label]="'Open image ' + filename()"
    (click)="openLightbox.emit()"
  >
    @if (src()) {
      <img
        decoding="async"
        class="media__img"
        [attr.loading]="hasIntrinsicSize() ? 'lazy' : null"
        [attr.width]="item().width"
        [attr.height]="item().height"
        [src]="src()"
        [alt]="filename()"
        (error)="imgFailed.set(true)"
        (load)="
          onNaturalSize(
            $any($event.target).naturalWidth,
            $any($event.target).naturalHeight
          )
        "
      />
    } @else {
      <span class="media__skeleton" aria-hidden="true"></span>
    }
  </button>
} @else if (kind() === 'video') {
  @if (src()) {
    <video
      class="media media--video"
      [style.aspect-ratio]="aspectRatio()"
      controls
      [src]="src()"
      [attr.aria-label]="'Video: ' + filename()"
      (loadedmetadata)="
        onNaturalSize(
          $any($event.target).videoWidth,
          $any($event.target).videoHeight
        );
        startPlayback($any($event.target))
      "
    ></video>
  } @else {
    <button
      type="button"
      class="media media--video media--poster"
      [style.aspect-ratio]="aspectRatio()"
      [attr.aria-label]="
        (loading() ? 'Loading video ' : 'Play video ') + filename()
      "
      [attr.aria-busy]="loading() ? 'true' : null"
      (click)="requestPlay()"
    >
      @if (poster()) {
        <img class="media__img" decoding="async" alt="" [src]="poster()" />
      } @else {
        <span class="media__placeholder" aria-hidden="true"></span>
      }
      <span class="media__play" aria-hidden="true">
        <trn-icon [name]="loading() ? 'loader-circle' : 'play'" size="xl" />
      </span>
      <span class="media__badge" role="status">{{
        loading() ? 'Loading…' : playMeta()
      }}</span>
    </button>
  }
} @else if (kind() === 'audio') {
  @if (src()) {
    <audio
      class="media media--audio"
      controls
      [src]="src()"
      [attr.aria-label]="'Audio: ' + filename()"
      (loadedmetadata)="startPlayback($any($event.target))"
    ></audio>
  } @else {
    <button
      type="button"
      class="media media--file media--audio"
      [attr.aria-label]="
        (loading() ? 'Loading audio ' : 'Play audio ') + filename()
      "
      [attr.aria-busy]="loading() ? 'true' : null"
      (click)="requestPlay()"
    >
      <span class="media__icon" aria-hidden="true">
        <trn-icon [name]="loading() ? 'loader-circle' : 'play'" />
      </span>
      <span class="media__meta">
        <span class="media__name">{{ filename() }}</span>
        <span class="media__sub" role="status">{{
          loading() ? 'Loading…' : playMeta() || item().mimeType
        }}</span>
      </span>
    </button>
  }
} @else {
  <button
    type="button"
    class="media media--file"
    [attr.aria-label]="'Download ' + filename()"
    (click)="download.emit()"
  >
    <span class="media__icon" aria-hidden="true">↓</span>
    <span class="media__meta">
      <span class="media__name">{{ filename() }}</span>
      <span class="media__sub">{{ subtitle() }}</span>
    </span>
  </button>
}

<div
  trnOverlaySurface
  variant="neutral"
  size="md"
  layout="dialog"
  class="space-members flex flex-col"
  data-testid="space-members"
>
  <h2 class="space-members__title">Members of {{ spaceName() }}</h2>

  <ul class="space-members__list">
    @for (member of members(); track member.userId) {
      <li class="space-members__row">
        <button
          class="space-members__pick"
          type="button"
          (click)="pick(member)"
          [attr.aria-label]="'Show ' + member.roomDisplayName"
          [attr.data-testid]="'space-member-' + member.userId"
        >
          <trn-avatar
            [mxc]="member.roomAvatarMxc"
            [initial]="member.roomInitial"
            [name]="member.roomDisplayName"
            size="md"
          />
          <span class="space-members__name" [title]="member.userId">{{
            member.roomDisplayName
          }}</span>
          @if (roleOf(member)) {
            <span class="space-members__role">{{ roleOf(member) }}</span>
          }
        </button>
      </li>
    } @empty {
      <li>
        <trn-empty-state
          layout="line"
          body="Nobody else is in this space yet."
        />
      </li>
    }
  </ul>

  <div class="space-members__actions">
    <button
      trnBtn
      type="button"
      (click)="close()"
      data-testid="space-members-done"
    >
      Done
    </button>
  </div>
</div>

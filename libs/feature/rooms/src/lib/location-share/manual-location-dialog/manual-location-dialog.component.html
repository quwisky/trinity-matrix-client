<div
  trnOverlaySurface
  variant="neutral"
  size="md"
  layout="dialog"
  class="flex flex-col gap-3 p-4"
>
  <h2 class="text-base font-semibold">Share location</h2>

  <p id="manual-location-hint" class="text-sm text-muted-foreground">
    Paste an OpenStreetMap or Google Maps link, or type coordinates as
    <code class="rounded bg-muted px-1 py-0.5 text-xs">lat, lng</code>.
  </p>

  <div>
    <label trnLabel for="manual-location">Location</label>
    <input
      id="manual-location"
      trnInput
      class="mt-1 w-full"
      placeholder="48.8584, 2.2945 or a map link"
      aria-describedby="manual-location-hint"
      [value]="value()"
      (input)="onInput($event)"
      data-testid="manual-location-input"
    />
  </div>

  @if (coords(); as point) {
    <p
      class="flex items-center gap-1.5 text-sm text-muted-foreground"
      data-testid="manual-location-preview"
    >
      <trn-icon name="map-pin" />
      <span>{{ point.lat.toFixed(5) }}, {{ point.lng.toFixed(5) }}</span>
    </p>
  }

  @if (canLocate) {
    <button
      trnBtn
      variant="secondary"
      presentation="outline"
      size="sm"
      class="self-start"
      [disabled]="locating()"
      (click)="useApproximate()"
      data-testid="manual-location-approx"
    >
      @if (locating()) {
        <trn-spinner class="mr-2" />
      } @else {
        <trn-icon name="locate-fixed" class="mr-2" />
      }
      Use my approximate location
    </button>
    <p class="text-xs text-muted-foreground">
      Estimates your city from your IP address via a third-party service
      (ipapi.co).
    </p>
  }

  <span class="sr-only" aria-live="polite" data-testid="manual-location-status">
    {{ status() }}
  </span>

  <div class="flex justify-end gap-2">
    <button trnBtn variant="secondary" presentation="ghost" (click)="cancel()">
      Cancel
    </button>
    <button
      trnBtn
      [disabled]="!coords()"
      (click)="share()"
      data-testid="manual-location-share"
    >
      Share
    </button>
  </div>
</div>

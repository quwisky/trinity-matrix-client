<div
  trnOverlaySurface
  variant="neutral"
  size="lg"
  layout="dialog"
  class="manage-rooms flex flex-col"
  data-testid="manage-space-rooms"
>
  <h2 class="manage-rooms__title">Organise {{ spaceName() }}</h2>
  <p class="manage-rooms__hint">
    The order here is what everyone in the space sees. Suggested rooms are
    highlighted to new members.
  </p>

  <ul class="manage-rooms__list">
    @for (child of childList(); track child.childId) {
      <li
        class="manage-rooms__row"
        [attr.data-testid]="'managed-' + child.childId"
      >
        <trn-avatar
          [mxc]="child.avatarMxc"
          [initial]="child.initial"
          [name]="child.name"
          size="sm"
          shape="place"
        />
        <span class="manage-rooms__name" [title]="child.name">{{
          child.name
        }}</span>

        <label class="manage-rooms__suggested">
          <trn-checkbox
            [checked]="child.suggested"
            [disabled]="writeLocked()"
            (checkedChange)="toggleSuggested(child.childId, $event)"
            [attr.data-testid]="'suggest-' + child.childId"
          />
          Suggested
        </label>

        <button
          trnBtn
          type="button"
          variant="secondary"
          presentation="ghost"
          size="md"
          shape="icon"
          [disabled]="isFirst(child.childId) || writeLocked()"
          (click)="move(child.childId, 'up')"
          [attr.aria-label]="'Move ' + child.name + ' up'"
          [attr.data-testid]="'move-up-' + child.childId"
        >
          <trn-icon name="chevron-up" motion="nudge-up" />
        </button>
        <button
          trnBtn
          type="button"
          variant="secondary"
          presentation="ghost"
          size="md"
          shape="icon"
          [disabled]="isLast(child.childId) || writeLocked()"
          (click)="move(child.childId, 'down')"
          [attr.aria-label]="'Move ' + child.name + ' down'"
          [attr.data-testid]="'move-down-' + child.childId"
        >
          <trn-icon name="chevron-down" motion="nudge-down" />
        </button>
      </li>
    } @empty {
      <!-- The `<li>` stays here: it is the only valid child of the `<ul>` above, and the
           panel goes inside it. -->
      <li>
        <trn-empty-state
          layout="line"
          body="This space has no rooms in it yet."
        />
      </li>
    }
  </ul>

  <div class="manage-rooms__actions">
    <button
      trnBtn
      type="button"
      (click)="close()"
      data-testid="manage-space-rooms-done"
    >
      Done
    </button>
  </div>
</div>

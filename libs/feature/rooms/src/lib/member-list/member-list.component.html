<aside
  class="members"
  aria-label="Members"
  #scrollHost
  (scroll)="onScroll()"
  data-testid="member-list"
>
  <label class="members__filter">
    <span class="sr-only">Filter members</span>
    <input
      trnInput
      type="search"
      class="w-full"
      placeholder="Filter members"
      autocomplete="off"
      [value]="query()"
      (input)="onQuery($any($event.target).value)"
      data-testid="member-filter"
      data-right-panel-focus
    />
  </label>

  <!-- Always rendered, never behind an @if: a live region that is created at the moment
       its text appears is a region the screen reader was not yet watching, so nothing is
       announced. Only the text changes. Silent until a filter is actually typed. -->
  <p
    class="sr-only"
    role="status"
    aria-live="polite"
    data-testid="member-filter-status"
  >
    {{ filterStatus() }}
  </p>

  <!-- Spacers stand in for the rows outside the window so the scrollbar keeps its true
       length; without them the list would shrink to whatever is rendered. -->
  <div
    class="members__pad"
    aria-hidden="true"
    [style.height.px]="topPadPx()"
  ></div>

  @for (section of windowedSections(); track section.role) {
    <div
      class="members__section"
      role="group"
      [attr.aria-label]="section.ariaLabel"
    >
      <!-- The group's aria-label already names the role and count, so hide the
           visual header (icon included) from assistive tech to avoid a double read. -->
      @if (section.showHeader) {
        <span class="category members__section-label" aria-hidden="true">
          <trn-icon class="members__section-icon" [name]="section.icon" />
          {{ section.label }} — {{ section.totalRows }}
        </span>
      }
      <ul class="members__list" role="list">
        @for (row of section.rows; track row.member.userId) {
          <li class="members__item">
            <button
              class="member"
              type="button"
              [class.member--offline]="row.presence === 'offline'"
              [trnTooltip]="row.member.userId"
              position="left"
              [attr.aria-label]="'View ' + row.member.roomDisplayName"
              (click)="selectMember.emit(row.member)"
              data-testid="member-row"
            >
              <trn-avatar
                [mxc]="row.member.roomAvatarMxc"
                [initial]="row.member.roomInitial"
                [name]="row.member.roomDisplayName"
                [size]="32"
                [presence]="row.presence"
              />
              <span class="member__name">{{ row.member.roomDisplayName }}</span>
            </button>
          </li>
        }
      </ul>
    </div>
  } @empty {
    @if (filtering()) {
      <trn-empty-state
        size="line"
        body="No members match that."
        data-testid="member-filter-empty"
      />
    }
  }

  <div
    class="members__pad"
    aria-hidden="true"
    [style.height.px]="bottomPadPx()"
  ></div>
</aside>

<div class="composer__recording" data-testid="composer-voice-recording">
  <span class="sr-only" role="status" aria-live="polite"
    >Voice recording started</span
  >
  <button
    #cancelButton
    type="button"
    trnIconButton
    class="composer__recording-cancel"
    aria-label="Cancel voice recording"
    data-testid="composer-voice-cancel"
    (click)="cancelRecording.emit()"
  >
    <trn-icon name="trash-2" motion="nudge-down" />
  </button>
  <span class="composer__recording-dot" aria-hidden="true"></span>
  <span class="composer__recording-time" data-testid="composer-voice-time">
    Recording {{ timeLabel() }}
  </span>
  <button
    type="button"
    trnIconButton
    class="composer__recording-send"
    aria-label="Send voice message"
    data-testid="composer-voice-send"
    [disabled]="sendBlocked()"
    (click)="sendRecording.emit()"
  >
    <trn-icon name="send" motion="nudge-up-right" />
  </button>
</div>

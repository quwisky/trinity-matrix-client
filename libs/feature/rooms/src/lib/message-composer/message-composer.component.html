@if (editing()) {
  <div class="composer__banner">Editing message — <kbd>Esc</kbd> to cancel</div>
} @else if (replyingTo()) {
  <div class="composer__banner">
    Replying to <strong>{{ replyingTo() }}</strong>
    <button
      type="button"
      class="composer__cancel"
      aria-label="Cancel reply"
      (click)="cancelReply.emit()"
    >
      <trn-icon name="x" />
    </button>
  </div>
}

<trn-composer-attachment-strip
  [uploadProgress]="contextUploadProgress()"
  [staged]="staged()"
  [uploadLabel]="uploadLabel()"
  [canRetry]="canSendMedia()"
  (removeStaged)="removeStaged($event)"
  (retryStaged)="retryStaged($event)"
/>

<div class="composer">
  @if (!recordingVoice() && showToolbar()) {
    <trn-composer-toolbar
      [previewing]="previewing()"
      [disabled]="contextUploadProgress() !== null"
      [pinned]="toolbarPinned()"
      [active]="activeFormats()"
      (format)="onFormat($event)"
      (togglePreview)="onTogglePreview()"
      (togglePinned)="onTogglePinned()"
    />
  }
  <!-- Both pickers render in the CDK overlay container, anchored to the input row. They were
       `position: absolute` children pinned at `bottom: calc(100% + 4px)`, which is what made
       `.composer` have to stay `position: relative` and what would have let any
       `overflow: hidden` ancestor cut one in half. `[(open)]` because these two are opened
       and closed by the person using them, so an outside press is theirs to answer. -->
  <ng-template
    [trnAnchoredOverlay]="composerField"
    [(open)]="pickerOpen"
    side="top"
    align="end"
  >
    <trn-emoji-picker [pickerId]="pickerId" (picked)="onPickerSelect($event)" />
  </ng-template>
  <ng-template
    [trnAnchoredOverlay]="composerField"
    [(open)]="gifPickerOpen"
    side="top"
    align="end"
  >
    <trn-gif-picker (gifSelect)="onGifSelect($event)" />
  </ng-template>
  <ng-template
    [trnAnchoredOverlay]="composerField"
    [(open)]="stickerPickerOpen"
    side="top"
    align="start"
  >
    <trn-sticker-picker
      [packs]="stickerPacks()"
      (selected)="onStickerSelect($event)"
      (dismiss)="closeStickerPicker()"
      (manage)="manageImagePacks()"
    />
  </ng-template>
  @if (recordingVoice()) {
    <div class="composer__recording" data-testid="composer-voice-recording">
      <button
        type="button"
        class="composer__recording-cancel"
        aria-label="Cancel voice recording"
        data-testid="composer-voice-cancel"
        (click)="cancelVoiceRecording()"
      >
        <trn-icon name="trash-2" />
      </button>
      <span class="composer__recording-dot" aria-hidden="true"></span>
      <span class="composer__recording-time" data-testid="composer-voice-time">
        Recording {{ voiceTimeLabel() }}
      </span>
      <button
        type="button"
        class="composer__recording-send"
        aria-label="Send voice message"
        data-testid="composer-voice-send"
        (click)="stopVoiceRecording()"
      >
        <trn-icon name="send" motion="nudge-up-right" />
      </button>
    </div>
  }
  <!-- The option ids this stamps are what the textarea's `aria-activedescendant` below points
       at, and what `scrollSuggestionIntoView` looks up — see the child's own note. -->
  <trn-composer-suggestions
    [anchor]="composerField"
    [emojiOpen]="menus.emojiOpen()"
    [emojiMatches]="menus.emojiMatches()"
    [emojiActiveIndex]="menus.emojiActiveIndex()"
    [mentionOpen]="menus.mentionOpen()"
    [mentionMatches]="menus.mentionMatches()"
    [mentionActiveIndex]="menus.mentionActiveIndex()"
    (emojiHighlight)="menus.emojiActiveIndex.set($event)"
    (emojiAccept)="menus.acceptEmoji($event)"
    (mentionHighlight)="menus.mentionActiveIndex.set($event)"
    (mentionAccept)="menus.acceptMention($event)"
    [slashOpen]="menus.slashOpen()"
    [slashMatches]="menus.slashMatches()"
    [slashActiveIndex]="menus.slashActiveIndex()"
    (slashHighlight)="menus.slashActiveIndex.set($event)"
    (slashAccept)="menus.acceptSlash($event)"
  />
  <input
    #fileInput
    type="file"
    class="composer__file-input"
    data-testid="composer-file-input"
    multiple
    hidden
    (change)="onFilePicked($event)"
  />
  <!-- The FIELD: one box holding the insert button, the input and the emoji/send buttons, and
       what all four floating layers anchor to. A grid rather than a flex row, so the preview
       can occupy the textarea's own cell instead of standing beside it — see the stylesheet.

       It is the field rather than `.composer` because the field is the thing the layers belong
       above; the old rule anchored them to `.composer`, which meant they cleared the toolbar
       too, which is why the toolbar had to live inside it. -->
  <div
    class="composer__field"
    #composerField
    data-testid="composer-field"
    (pointerdown)="onFieldPress($event)"
  >
    <trn-composer-insert-menu
      [hasMenu]="hasInsertMenu()"
      [editing]="editing()"
      [uploading]="contextUploadProgress() !== null"
      [gifEnabled]="gifEnabled()"
      [gifDownloading]="gifDownloading()"
      [richActions]="richActions()"
      [voiceSupported]="voiceSupported"
      [recording]="recordingVoice()"
      [locationSharing]="locationSharing()"
      [stickerEnabled]="stickerEnabled()"
      (attachFile)="onAttach()"
      (pickGif)="toggleGifPicker()"
      (createPoll)="openPollDialog()"
      (shareLocation)="shareLocation()"
      (recordVoice)="startVoiceRecording()"
      (pickSticker)="toggleStickerPicker()"
    />
    <!-- The preview replaces the input rather than sitting beside it, so the composer keeps its
       height and nothing below it moves. The textarea stays in the DOM (hidden) so its value,
       caret and draft survive the round trip untouched. -->
    @if (previewing()) {
      <!-- `msg__text--html` only for rendered markdown, mirroring the timeline and edit history:
         without it the container stays `pre-wrap`, which is what keeps a plain message's line
         breaks. Following a mention pill would navigate away from a half-written message, so
         `(matrixLink)` is deliberately unhandled — external links still open via the directive. -->
      <div
        class="composer__preview"
        [class.msg__text--html]="preview().rich"
        data-testid="composer-preview"
        trnSpoilerReveal
        trnMatrixLink
        [trnInlineMxcImages]="preview().rich ? preview().html : ''"
        [innerHTML]="preview().html"
      ></div>
    }
    <textarea
      #ta
      trnTextarea
      class="composer__input"
      [class.composer__input--hidden]="previewing()"
      data-testid="composer-input"
      rows="1"
      [value]="text()"
      [placeholder]="
        hasStaged()
          ? 'Add a caption…'
          : editing()
            ? 'Edit message…'
            : placeholder() || 'Message #' + roomName()
      "
      aria-autocomplete="list"
      [attr.aria-controls]="
        menus.mentionOpen()
          ? 'mention-suggestions'
          : menus.emojiOpen()
            ? 'emoji-suggestions'
            : menus.slashOpen()
              ? 'slash-suggestions'
              : null
      "
      [attr.aria-activedescendant]="
        menus.mentionOpen()
          ? 'mention-suggestion-' + menus.mentionActiveIndex()
          : menus.emojiOpen()
            ? 'emoji-suggestion-' + menus.emojiActiveIndex()
            : menus.slashOpen()
              ? 'slash-suggestion-' + menus.slashActiveIndex()
              : null
      "
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (keydown.enter)="onEnter($event)"
      (keydown.arrowUp)="onArrowUp($event)"
      (keydown.arrowDown)="onArrowDown($event)"
      (keydown.tab)="onTab($event)"
      (blur)="onBlur()"
      (select)="onSelectionChange()"
      (keyup)="onSelectionChange()"
      (pointerup)="onSelectionChange()"
      (paste)="onPaste($event)"
    ></textarea>
    <button
      type="button"
      class="composer__emoji"
      trnTooltip="Emoji"
      aria-label="Insert emoji"
      [attr.aria-expanded]="pickerOpen()"
      [attr.aria-controls]="pickerOpen() ? pickerId : null"
      (click)="toggleEmojiPicker()"
    >
      <trn-icon name="smile" />
    </button>
    <!-- Shown at every width and pointer type: touch has no reliable Enter-to-send, and on
       a pointer device it is still the discoverable way to send when Enter is ambiguous
       (a draft holding newlines, IME composition). Withheld only while recording, where
       the recording bar owns the send plane and two identical ones would be a coin-flip. -->
    @if (!recordingVoice()) {
      <button
        type="button"
        class="composer__send"
        trnTooltip="Send"
        aria-label="Send message"
        data-testid="composer-send"
        [disabled]="
          (!text().trim() && !hasStaged()) ||
          (!editing() && hasStaged() && !canSendMedia())
        "
        (click)="submit()"
      >
        <trn-icon name="send" motion="nudge-up-right" />
      </button>
    }
  </div>
</div>

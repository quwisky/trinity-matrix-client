<!-- Every compose action lives behind one `+` at all widths: a dropdown tray when
   there is more than one to offer, a plain attach button when there is not. Keeps
   the row to +, input, emoji and send. -->
@if (hasMenu()) {
  <button
    type="button"
    class="composer__attach"
    [trnDropdownMenuTrigger]="insertMenu"
    trnTooltip="Add to message"
    aria-label="Add to message"
    data-testid="composer-insert"
    [disabled]="editing()"
  >
    @if (locationSharing() || gifDownloading()) {
      <trn-spinner class="text-base" />
    } @else {
      <trn-icon name="plus" />
    }
  </button>
  <ng-template #insertMenu>
    <!-- Each item repeats its inline twin's [disabled] rather than the trigger
       carrying the union: an upload in flight blocks another *attachment*, it is
       no reason to stop someone starting a poll. Only editing() is whole-tray. -->
    <div trnDropdownMenu aria-label="Add to message">
      <button
        trnDropdownMenuItem
        class="composer__insert-item"
        [disabled]="uploading()"
        (triggered)="attachFile.emit()"
        data-testid="insert-attach"
      >
        <trn-icon name="paperclip" />
        Attach a file
      </button>
      @if (gifEnabled()) {
        <button
          trnDropdownMenuItem
          class="composer__insert-item"
          [disabled]="uploading() || gifDownloading()"
          (triggered)="pickGif.emit()"
          data-testid="insert-gif"
        >
          <trn-icon name="image-play" />
          GIF
        </button>
      }
      @if (richActions()) {
        <button
          trnDropdownMenuItem
          class="composer__insert-item"
          (triggered)="createPoll.emit()"
          data-testid="insert-poll"
        >
          <trn-icon name="vote" />
          Poll
        </button>
        <button
          trnDropdownMenuItem
          class="composer__insert-item"
          [disabled]="locationSharing()"
          (triggered)="shareLocation.emit()"
          data-testid="insert-location"
        >
          <trn-icon name="map-pin" />
          Location
        </button>
        @if (voiceSupported() && !recording()) {
          <button
            trnDropdownMenuItem
            class="composer__insert-item"
            [disabled]="uploading()"
            (triggered)="recordVoice.emit()"
            data-testid="insert-voice"
          >
            <trn-icon name="mic" />
            Voice message
          </button>
        }
      }
    </div>
  </ng-template>
} @else {
  <!-- Nothing to collect in a tray (thread composer, no GIF provider), so the `+`
     stays a plain attach button. -->
  <button
    type="button"
    class="composer__attach"
    trnTooltip="Attach"
    aria-label="Attach a file"
    data-testid="composer-insert-attach"
    [disabled]="uploading() || editing()"
    (click)="attachFile.emit()"
  >
    <trn-icon name="plus" />
  </button>
}

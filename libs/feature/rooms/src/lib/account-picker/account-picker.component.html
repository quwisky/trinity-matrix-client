<trn-dialog-shell
  title="Accounts in view"
  description="Choose which accounts appear in the room list, rail and spaces."
  size="sm"
  (closed)="close()"
  data-testid="account-picker"
>
  <ul class="picker__list" role="group" aria-label="Accounts in view">
    @for (account of accounts(); track account.userId) {
      @let locked = isLocked(account.userId);
      <li>
        <button
          type="button"
          class="account-pick"
          role="checkbox"
          [attr.aria-checked]="isShown(account.userId)"
          [disabled]="locked"
          [trnLockedSelection]="locked"
          [attr.data-disabled]="locked ? '' : null"
          [attr.data-autofocus]="
            account.userId === firstFocusableAccountId() ? '' : null
          "
          [attr.data-testid]="'show-account-' + account.userId"
          (click)="toggle(account.userId)"
        >
          <span class="account-pick__indicator" aria-hidden="true">
            @if (isShown(account.userId)) {
              <trn-icon name="check" size="sm" />
            }
          </span>
          <trn-account-pick-label [account]="account" [locked]="locked" />
        </button>
      </li>
    }
  </ul>

  <div trnDialogActions>
    <button
      trnBtn
      type="button"
      data-testid="account-picker-done"
      [attr.data-autofocus]="firstFocusableAccountId() ? null : ''"
      (click)="close()"
    >
      Done
    </button>
  </div>
</trn-dialog-shell>

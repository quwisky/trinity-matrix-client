<div
  trnOverlaySurface
  variant="neutral"
  size="sm"
  layout="dialog"
  class="picker flex flex-col"
  data-testid="account-picker"
>
  <h2 class="picker__title" id="account-picker-title">Accounts in view</h2>
  <p class="picker__hint">
    Choose which accounts appear in the room list, rail and spaces.
  </p>

  <ul class="picker__list" role="group" aria-labelledby="account-picker-title">
    @for (account of accounts(); track account.userId) {
      @let locked = isLocked(account.userId);
      <li>
        <button
          type="button"
          class="account-pick"
          role="checkbox"
          [attr.aria-checked]="isShown(account.userId)"
          [disabled]="locked"
          [trnLockedSelection]="locked"
          [attr.data-disabled]="locked ? '' : null"
          [attr.data-autofocus]="
            account.userId === firstFocusableAccountId() ? '' : null
          "
          [attr.data-testid]="'show-account-' + account.userId"
          (click)="toggle(account.userId)"
        >
          <span class="account-pick__indicator" aria-hidden="true">
            @if (isShown(account.userId)) {
              <trn-icon name="check" size="sm" />
            }
          </span>
          <trn-avatar
            [mxc]="account.avatarMxc"
            [accountId]="account.userId"
            [initial]="initialOf(account)"
            [name]="account.displayName"
            size="md"
          />
          <span class="account-pick__id">
            <span class="account-pick__name">{{ account.displayName }}</span>
            <!-- The mxid, because two accounts can share a display name and the tick alone
                 would not say which server you are blending in. -->
            <span class="account-pick__handle">{{ account.userId }}</span>
            @if (locked) {
              <span class="account-pick__active">Always included</span>
            }
          </span>
        </button>
      </li>
    }
  </ul>

  <div class="picker__actions">
    <button
      trnBtn
      type="button"
      data-testid="account-picker-done"
      [attr.data-autofocus]="firstFocusableAccountId() ? null : ''"
      (click)="close()"
    >
      Done
    </button>
  </div>
</div>

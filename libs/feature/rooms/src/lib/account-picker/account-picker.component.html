<trn-dialog-shell
  title="Accounts in view"
  description="Choose which accounts appear in the room list, rail and spaces."
  size="sm"
  cancelText="Done"
  (closed)="close()"
  data-testid="account-picker"
>
  <ng-template #pickContent let-account>
    <trn-account-pick-label
      [account]="account"
      [locked]="isLocked(account.userId)"
      [unverified]="account.trust === 'unverified'"
    />
    @if (isShown(account.userId)) {
      <trn-icon name="check" size="md" variant="accent" class="ms-auto" />
    }
  </ng-template>
  @if (sheet) {
    <div trnInsetGroup role="group" aria-label="Accounts in view">
      @for (account of accounts(); track account.userId) {
        @let locked = isLocked(account.userId);
        @if (!$first) {
          <trn-inset-divider inset="edge" />
        }
        <button
          trnBtn
          trnInsetRow
          type="button"
          shape="row"
          variant="secondary"
          presentation="solid"
          role="checkbox"
          [attr.aria-checked]="isShown(account.userId)"
          [disabled]="locked"
          [trnLockedSelection]="locked"
          [attr.data-autofocus]="
            account.userId === firstFocusableAccountId() ? '' : null
          "
          [attr.data-testid]="'show-account-' + account.userId"
          [attr.data-trust]="account.trust"
          (click)="toggle(account.userId)"
        >
          <ng-container
            [ngTemplateOutlet]="pickContent"
            [ngTemplateOutletContext]="{ $implicit: account }"
          />
        </button>
      }
    </div>
  } @else {
    <ul class="picker__list" role="group" aria-label="Accounts in view">
      @for (account of accounts(); track account.userId) {
        @let locked = isLocked(account.userId);
        <li>
          <button
            type="button"
            class="account-pick"
            role="checkbox"
            [attr.aria-checked]="isShown(account.userId)"
            [disabled]="locked"
            [trnLockedSelection]="locked"
            [attr.data-disabled]="locked ? '' : null"
            [attr.data-autofocus]="
              account.userId === firstFocusableAccountId() ? '' : null
            "
            [attr.data-testid]="'show-account-' + account.userId"
            [attr.data-trust]="account.trust"
            (click)="toggle(account.userId)"
          >
            <ng-container
              [ngTemplateOutlet]="pickContent"
              [ngTemplateOutletContext]="{ $implicit: account }"
            />
          </button>
        </li>
      }
    </ul>
  }

  <div trnDialogActions>
    <button
      trnBtn
      trnDialogDismiss
      type="button"
      data-testid="account-picker-done"
      [attr.data-autofocus]="firstFocusableAccountId() ? null : ''"
      (click)="close()"
    >
      Done
    </button>
  </div>
</trn-dialog-shell>

<div class="lightbox__actions">
  <span class="lightbox__zoom">
    <button
      trnBtn
      type="button"
      variant="secondary"
      presentation="solid"
      shape="icon"
      size="lg"
      class="lightbox__action"
      aria-label="Zoom out"
      [attr.aria-disabled]="scale() <= 1 ? 'true' : null"
      (click)="zoomButton($event, 1 / zoomStep)"
      data-testid="lightbox-zoom-out"
    >
      <trn-icon name="zoom-out" motion="pop" />
    </button>

    <button
      trnBtn
      type="button"
      variant="secondary"
      presentation="solid"
      shape="icon"
      size="lg"
      class="lightbox__action"
      aria-label="Zoom in"
      [attr.aria-disabled]="scale() >= maxScale ? 'true' : null"
      (click)="zoomButton($event, zoomStep)"
      data-testid="lightbox-zoom-in"
    >
      <trn-icon name="zoom-in" motion="pop" />
    </button>
  </span>

  <button
    trnBtn
    type="button"
    variant="secondary"
    presentation="solid"
    shape="icon"
    size="lg"
    class="lightbox__action lightbox__download"
    [attr.aria-label]="(shares() ? 'Share ' : 'Download ') + media().kind"
    [loading]="busy()"
    [attr.aria-disabled]="busy() ? 'true' : null"
    (click)="download($event)"
    data-testid="lightbox-download"
  >
    @if (shares()) {
      <trn-icon name="share" motion="nudge-up" />
    } @else {
      <trn-icon name="download" motion="nudge-down" />
    }
  </button>

  <button
    trnBtn
    type="button"
    variant="secondary"
    presentation="solid"
    shape="icon"
    size="lg"
    class="lightbox__action lightbox__close"
    aria-label="Close image viewer"
    (click)="close(); $event.stopPropagation()"
    data-testid="lightbox-close"
  >
    <trn-icon name="x" motion="rotate" />
  </button>
</div>

<img
  #image
  decoding="async"
  draggable="false"
  class="lightbox__image"
  [src]="src()"
  [alt]="filename()"
/>

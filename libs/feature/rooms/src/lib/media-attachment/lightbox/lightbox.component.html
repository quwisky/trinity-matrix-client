<div class="lightbox__actions">
  <button
    trnBtn
    type="button"
    variant="secondary"
    presentation="solid"
    shape="icon"
    size="lg"
    class="lightbox__action lightbox__download"
    [attr.aria-label]="(shares() ? 'Share ' : 'Download ') + media().kind"
    [loading]="busy()"
    [attr.aria-disabled]="busy() ? 'true' : null"
    (click)="download($event)"
    data-testid="lightbox-download"
  >
    @if (shares()) {
      <trn-icon name="share" motion="nudge-up" />
    } @else {
      <trn-icon name="download" motion="nudge-down" />
    }
  </button>

  <button
    trnBtn
    type="button"
    variant="secondary"
    presentation="solid"
    shape="icon"
    size="lg"
    class="lightbox__action lightbox__close"
    aria-label="Close image viewer"
    (click)="close(); $event.stopPropagation()"
    data-testid="lightbox-close"
  >
    <trn-icon name="x" motion="rotate" />
  </button>
</div>

<img
  #image
  decoding="async"
  draggable="false"
  class="lightbox__image"
  [src]="src()"
  [alt]="filename()"
/>

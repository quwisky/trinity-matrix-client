<div
  data-testid="pinned-panel"
  trnOverlaySurface
  variant="neutral"
  size="md"
  layout="fullscreen"
  class="safe-bottom flex flex-col"
>
  <div
    class="panel-header flex items-center gap-2 border-b border-solid border-border"
  >
    <h2 class="flex-1 text-base font-semibold">Pinned messages</h2>
    <button
      trnBtn
      variant="secondary"
      presentation="ghost"
      shape="icon"
      size="md"
      (click)="close()"
      data-testid="pinned-close"
      trnTooltip="Close pinned messages"
      aria-label="Close pinned messages"
    >
      <trn-icon name="x" size="lg" motion="rotate" />
    </button>
  </div>

  <div class="pinned flex-1 overflow-y-auto max-members:touch-pan-y">
    @for (p of pinned(); track p.id) {
      <div class="pin-item">
        <button
          type="button"
          class="pin-item__main"
          data-testid="pinned-item"
          (click)="jumpTo(p.id)"
          [attr.aria-label]="'Jump to pinned message from ' + p.senderName"
        >
          <div class="pin-item__head">
            <span class="pin-item__author">{{ p.senderName }}</span>
            <span class="pin-item__time">{{ fmt.dateTime(p.ts) }}</span>
          </div>
          <div class="pin-item__body">{{ p.body }}</div>
        </button>

        @if (canPin()) {
          <button
            trnBtn
            variant="secondary"
            presentation="ghost"
            shape="icon"
            size="md"
            class="pin-item__unpin"
            data-testid="pinned-unpin"
            (click)="unpin(p.id)"
            trnTooltip="Unpin message"
            [attr.aria-label]="'Unpin message from ' + p.senderName"
          >
            <trn-icon name="pin-off" motion="nudge-down" />
          </button>
        }
      </div>
    } @empty {
      <trn-empty-state
        body="No pinned messages in this channel yet."
        data-testid="pinned-empty"
      />
    }
  </div>
</div>

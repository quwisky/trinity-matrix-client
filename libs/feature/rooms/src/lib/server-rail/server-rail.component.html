<nav class="rail">
  <div
    class="item"
    [class.active]="recentActive()"
    [class.item--unread]="showDot(unread().recent)"
  >
    <span class="indicator" [class.indicator--selected]="recentActive()"></span>
    <button
      trnIconButton
      class="pill recent"
      (click)="showRecent.emit()"
      [attr.aria-current]="recentActive() ? 'true' : null"
      [attr.aria-label]="pillLabel('Recent activity', unread().recent)"
      trnTooltip="Recent activity"
      position="right"
      data-testid="rail-recent"
    >
      <trn-icon name="clock" motion="pop" />
    </button>
    <ng-container
      [ngTemplateOutlet]="mention"
      [ngTemplateOutletContext]="{ $implicit: unread().recent, top: false }"
    />
  </div>

  @let homeActive =
    activeSpaceId() === null && !roomsActive() && !recentActive();
  <div
    class="item"
    [class.active]="homeActive"
    [class.item--unread]="showDot(unread().home)"
  >
    <span class="indicator" [class.indicator--selected]="homeActive"></span>
    <button
      trnIconButton
      class="pill home"
      (click)="selectHome()"
      [attr.aria-current]="homeActive ? 'true' : null"
      [attr.aria-label]="pillLabel('Direct messages', unread().home)"
      trnTooltip="Direct messages"
      position="right"
    >
      <trn-icon name="house" motion="pop" />
    </button>
    <ng-container
      [ngTemplateOutlet]="mention"
      [ngTemplateOutletContext]="{ $implicit: unread().home, top: false }"
    />
  </div>

  <div
    class="item"
    [class.active]="roomsActive()"
    [class.item--unread]="showDot(unread().rooms)"
  >
    <span class="indicator" [class.indicator--selected]="roomsActive()"></span>
    <button
      trnIconButton
      class="pill rooms"
      (click)="showRooms.emit()"
      [attr.aria-current]="roomsActive() ? 'true' : null"
      [attr.aria-label]="pillLabel('Rooms', unread().rooms)"
      trnTooltip="Rooms"
      position="right"
      data-testid="rail-rooms"
    >
      <trn-icon name="door-open" motion="pop" />
    </button>
    <ng-container
      [ngTemplateOutlet]="mention"
      [ngTemplateOutletContext]="{ $implicit: unread().rooms, top: false }"
    />
  </div>

  <div class="separator"></div>

  @for (space of spaces(); track space.id) {
    @let counts = unread().perSpace[space.id];
    @let spaceActive = activeSpaceId() === space.id && !roomsActive();
    <div
      class="item"
      [class.active]="spaceActive"
      [class.item--unread]="showDot(counts)"
    >
      <span class="indicator" [class.indicator--selected]="spaceActive"></span>
      <button
        trnBtn
        shape="icon"
        presentation="ghost"
        variant="secondary"
        class="pill"
        (click)="
          selectSpace.emit({ spaceId: space.id, accountId: space.accountId })
        "
        [attr.aria-current]="spaceActive ? 'true' : null"
        [attr.aria-label]="
          pillLabel(
            badgeFor(space.accountId)
              ? space.name + ' — ' + badgeFor(space.accountId)!.name
              : space.name,
            counts
          )
        "
        [trnTooltip]="space.name"
        position="right"
      >
        <trn-avatar
          [mxc]="space.avatarMxc"
          [accountId]="space.accountId"
          [initial]="space.initial"
          [name]="space.name"
          shape="place"
          size="2xl"
          [accountBadge]="badgeFor(space.accountId)"
        />
      </button>
      <ng-container
        [ngTemplateOutlet]="mention"
        [ngTemplateOutletContext]="{
          $implicit: counts,
          top: !!badgeFor(space.accountId),
        }"
      />
    </div>
  }

  <div class="item">
    <span class="indicator"></span>
    <button
      trnIconButton
      class="pill add"
      (click)="createSpace.emit()"
      aria-label="Create a space"
      trnTooltip="Create a space"
      position="right"
    >
      <trn-icon name="plus" motion="rotate" />
    </button>
  </div>
</nav>

<!-- Mention count: bottom-right of the icon, or top-right when an account badge holds the bottom. -->
<ng-template #mention let-counts let-top="top">
  @if (mentionLabel(counts); as label) {
    <span
      trnBadge
      variant="danger"
      size="xs"
      [class.badge--top]="top"
      [class.badge--bottom]="!top"
      aria-hidden="true"
      >{{ label }}</span
    >
  }
</ng-template>

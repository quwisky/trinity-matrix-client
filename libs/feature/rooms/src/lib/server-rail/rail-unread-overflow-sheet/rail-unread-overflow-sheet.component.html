<trn-dialog-shell [title]="title()" size="sm" data-testid="rail-overflow-list">
  <div class="flex flex-col gap-3">
    <div trnInsetGroup>
      @for (chat of chats()(); track chat.key) {
        @if (!$first) {
          <trn-inset-divider inset="edge" />
        }
        <button
          trnBtn
          trnInsetRow
          type="button"
          shape="row"
          presentation="solid"
          variant="secondary"
          [attr.aria-label]="chat.label"
          data-testid="rail-overflow-chat"
          (click)="choose({ kind: 'chat', selection: chat.selection })"
        >
          <trn-rail-unread-overflow-row [chat]="chat" />
        </button>
      }
    </div>
    <div trnInsetGroup>
      <button
        trnBtn
        trnInsetRow
        type="button"
        shape="row"
        presentation="solid"
        variant="secondary"
        data-testid="rail-overflow-show-recent"
        (click)="choose({ kind: 'recent' })"
      >
        Show all in Recent activity
      </button>
    </div>
  </div>
</trn-dialog-shell>

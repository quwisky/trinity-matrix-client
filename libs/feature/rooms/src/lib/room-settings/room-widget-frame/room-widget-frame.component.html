<trn-dialog-shell
  [title]="widget().name"
  size="2xl"
  bodyClass="flex flex-col p-0"
  (closed)="close()"
>
  <trn-banner variant="neutral" class="widget-frame__notice">
    <trn-icon trnBannerIcon name="shield-alert" />
    {{ embed().origin }}. This third-party site can use its existing cookies and
    storage. Trinity does not grant it Matrix messages, account data, OpenID,
    media, client navigation, or TURN access through the Widget API.
  </trn-banner>

  <p
    class="widget-frame__status"
    aria-live="polite"
    data-testid="widget-frame-status"
  >
    {{ statusText() }}
  </p>

  <iframe
    #widgetFrame
    class="widget-frame__iframe"
    sandbox="allow-scripts allow-forms allow-same-origin"
    referrerpolicy="no-referrer"
    allow="
      camera 'none';
      microphone 'none';
      geolocation 'none';
      display-capture 'none';
      clipboard-read 'none';
      clipboard-write 'none';
      fullscreen 'none';
      payment 'none';
      usb 'none';
      serial 'none';
      hid 'none';
      idle-detection 'none';
      screen-wake-lock 'none';
      web-share 'none';
      publickey-credentials-get 'none';
      browsing-topics 'none';
    "
    [attr.title]="widget().name + ' widget'"
  ></iframe>
</trn-dialog-shell>

<trn-settings-hub
  testId="room-settings"
  noun="Room"
  [accountName]="accountLabel()"
  [targetName]="draft.model().name || roomDisplayName()"
  [sections]="sections"
  [selectedSection]="selectedSection()"
  [sectionTitle]="sectionTitle()"
  [compactNavigation]="compactNavigation()"
  [directoryVisible]="directoryVisible()"
  [unavailableReason]="draft.targetUnavailableReason()"
  (sectionSelected)="selectSection($event)"
  (directoryRequested)="showDirectory()"
  (closeRequested)="close()"
>
  @switch (selectedSection()) {
    @case ('general') {
      <trn-room-settings-general
        [accountId]="accountId()"
        [roomId]="roomId()"
        [roomDisplayName]="roomDisplayName()"
      />
    }
    @case ('access') {
      <trn-room-settings-access [parentSpaces]="parentSpaces()" />
    }
    @case ('for-you') {
      <trn-room-settings-for-you />
    }
    @case ('members') {
      <section data-testid="room-settings-panel-members">
        <trn-settings-group>
          <trn-members-settings
            [showUnavailableReason]="draft.targetAvailable()"
            [accountId]="accountId()"
            [roomId]="roomId()"
            [targetName]="draft.model().name || roomDisplayName()"
            noun="Room"
            [direct]="direct()"
          />
        </trn-settings-group>
      </section>
    }
    @case ('addresses') {
      <section data-testid="room-settings-panel-addresses">
        <trn-settings-group>
          <trn-room-aliases
            [accountId]="accountId()"
            [roomId]="roomId()"
            [available]="draft.targetAvailable()"
            noun="Room"
          />
        </trn-settings-group>
      </section>
    }
    @case ('widgets') {
      <section data-testid="room-settings-panel-widgets">
        <trn-room-widgets
          [target]="widgetTarget()"
          [available]="draft.targetAvailable()"
        />
      </section>
    }
    @case ('advanced') {
      @if (draft.snapshot()?.advanced; as advanced) {
        <trn-room-settings-advanced
          [accountId]="accountId()"
          [info]="advanced"
          [upgrade]="draft.permissions().upgrade"
          (openRoom)="openRoom($event)"
        />
      }
    }
  }
</trn-settings-hub>

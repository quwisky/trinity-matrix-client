<trn-avatar
  [mxc]="account().avatarMxc"
  [accountId]="account().userId"
  [initial]="initial()"
  [name]="account().displayName"
  size="md"
/>
<span class="account-pick__id">
  <span class="account-pick__name">{{ account().displayName }}</span>
  <!-- The mxid, because two accounts can share a display name and the tick alone would not say which
       server you are blending in. -->
  <span class="account-pick__handle">{{ account().userId }}</span>
  @if (locked()) {
    <span class="account-pick__active">Always included</span>
  }
  @if (unverified()) {
    <span
      trnBadge
      class="account-pick__trust"
      variant="warning"
      size="xs"
      data-testid="account-pick-unverified"
      >Unverified</span
    >
  }
</span>

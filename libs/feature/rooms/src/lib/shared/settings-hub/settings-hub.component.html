<trn-settings-layout
  [testId]="testId()"
  [title]="noun() + ' settings'"
  [heading]="sectionTitle()"
  [headingTestId]="testId() + '-section-heading'"
  [sections]="navigation()"
  [selectedSection]="selectedSection()"
  [compact]="compactNavigation()"
  [directoryVisible]="directoryVisible()"
  [detailClass]="testId() + '__section-scroll'"
  (sectionSelected)="sectionSelected.emit($event)"
  (backRequested)="directoryRequested.emit()"
  (closeRequested)="closeRequested.emit()"
>
  <p settings-context class="settings-hub__context">
    <span
      [attr.data-testid]="testId() + '-' + noun().toLowerCase() + '-name'"
      >{{ targetName() }}</span
    >
    <span aria-hidden="true"> · </span>
    <span [attr.data-testid]="testId() + '-account'">{{ accountName() }}</span>
  </p>
  @if (unavailableReason(); as reason) {
    <p settings-warning class="settings-hub__target-warning" role="alert">
      {{ reason }} Last-known details may be outdated. Unsaved changes are kept.
    </p>
  }
  <p class="settings-hub__section-description">{{ sectionDescription() }}</p>
  <ng-content />
</trn-settings-layout>

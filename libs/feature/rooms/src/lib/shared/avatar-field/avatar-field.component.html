<div class="avatar-field">
  <trn-avatar
    [mxc]="avatarMxc()"
    [name]="name()"
    [initial]="initial()"
    [exactSize]="64"
    [shape]="shape()"
  />
  <button
    trnBtn
    type="button"
    variant="secondary"
    presentation="outline"
    size="sm"
    (click)="pickAvatar()"
    [trnActionAllowed]="editable()"
    [trnActionDisabledReason]="unavailableReason()"
    [trnTooltip]="editable() ? 'Change photo' : unavailableReason()"
    [disabled]="savingAvatar()"
    [attr.data-testid]="testid()"
  >
    {{ savingAvatar() ? 'Uploading…' : 'Change photo' }}
  </button>
</div>

@if (avatarFeedback(); as feedback) {
  <p
    class="avatar-field__feedback"
    [class.avatar-field__feedback--danger]="feedback.tone === 'danger'"
    role="status"
    aria-live="polite"
    [attr.data-testid]="testid() + '-feedback'"
  >
    {{ feedback.message }}
  </p>
}

<!-- Outside the row so a `display: flex` on it never lays out a hidden input. -->
<input
  #avatarInput
  type="file"
  accept="image/*"
  hidden
  (change)="onAvatarPicked($event)"
/>

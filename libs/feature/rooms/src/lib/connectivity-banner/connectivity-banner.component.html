<!-- Always-mounted live region: a role="status" node inserted at the same moment
     its text appears (as the @if banner below is) is not reliably announced, so
     mirror the state here where the region already exists when the text changes. -->
<span class="sr-only" role="status" aria-live="polite">
  {{ offline() ? 'You’re offline. Reconnecting…' : '' }}
</span>
@if (offline()) {
  <trn-banner tone="neutral">
    <trn-icon trnBannerIcon name="cloud-off" />
    You’re offline. Reconnecting…
  </trn-banner>
}

@let thread = summary();
<button
  type="button"
  class="msg__thread msg__target"
  [attr.aria-label]="label()"
  (click)="open.emit()"
>
  <trn-icon class="msg__thread-icon" name="messages-square" />
  <span class="msg__thread-count"
    >{{ thread.replyCount }}
    {{ thread.replyCount === 1 ? 'reply' : 'replies' }}</span
  >
  @if (latestReplyLabel(); as latest) {
    <span class="msg__thread-sep" aria-hidden="true">·</span>
    <span class="msg__thread-time">last reply {{ latest }}</span>
  }
  @if (thread.unreadCount > 0) {
    <span
      class="msg__thread-badge"
      [class.msg__thread-badge--highlight]="thread.highlight"
      aria-hidden="true"
      >{{ thread.unreadCount }}</span
    >
  }
</button>

@if (isPanel) {
  <!-- Panel mode only. As a dialog the backdrop and Escape close it; in the slot there is
       neither above the `members` breakpoint, so the header IS the way out. -->
  <div
    class="panel-header flex items-center gap-2 border-b border-solid border-border"
  >
    <h2 class="flex-1 text-base font-semibold">Member info</h2>
    <button
      trnBtn
      variant="ghost"
      size="icon"
      (click)="close()"
      aria-label="Close member info"
      data-testid="member-info-close"
      data-right-panel-focus
    >
      <trn-icon name="x" size="1.25rem" motion="rotate" />
    </button>
  </div>
}
<div class="member-info safe-bottom" data-testid="member-info">
  <trn-avatar
    class="member-info__avatar"
    [mxc]="member().roomAvatarMxc"
    [initial]="member().roomInitial"
    [name]="member().roomDisplayName"
    [size]="64"
    [presence]="presenceState()"
  />
  <div class="member-info__id">
    <span class="member-info__name" data-testid="member-info-name">{{
      member().roomDisplayName
    }}</span>
    <span
      #userIdHandle
      class="member-info__handle"
      data-testid="member-info-handle"
      tabindex="0"
      role="textbox"
      aria-readonly="true"
      [attr.aria-label]="'Matrix user ID ' + member().userId"
      (focus)="selectUserId()"
      >{{ member().userId }}</span
    >
    <span class="member-info__role" data-testid="member-info-role">{{
      role()
    }}</span>
  </div>

  <div class="member-info__actions">
    @if (!isSelf()) {
      <button
        trnBtn
        class="w-full"
        (click)="message()"
        data-testid="member-info-message"
      >
        Message
      </button>
    }
    <button
      trnBtn
      variant="ghost"
      class="w-full"
      (click)="copyId()"
      data-testid="member-info-copy"
    >
      Copy user ID
    </button>

    @if (!isSelf()) {
      <button
        trnBtn
        variant="ghost"
        class="w-full"
        (click)="verify()"
        data-testid="member-info-verify"
      >
        Verify
      </button>
      <button
        trnBtn
        variant="ghost"
        class="w-full"
        (click)="toggleIgnore()"
        data-testid="member-info-ignore"
      >
        {{ ignored() ? 'Unblock' : 'Block' }}
      </button>
    }

    @if (!isSelf()) {
      <div class="member-info__moderation">
        @for (option of roleOptions(); track option.level) {
          @let permission = rolePermission(option.level);
          <button
            trnBtn
            variant="outline"
            class="w-full"
            (click)="setRole(option)"
            [trnActionAllowed]="permission.available"
            [trnActionDisabledReason]="permission.reason"
            [trnTooltip]="permission.reason ?? 'Change role'"
            [attr.data-testid]="'member-info-role-' + option.level"
          >
            Make {{ option.label }}
          </button>
        }
        <button
          trnBtn
          variant="outline"
          class="member-info__danger w-full"
          (click)="kick()"
          [trnActionAllowed]="permissions().kick.available"
          [trnActionDisabledReason]="permissions().kick.reason"
          [trnTooltip]="permissions().kick.reason ?? 'Remove from room'"
          data-testid="member-info-kick"
        >
          Remove from room
        </button>
        <button
          trnBtn
          variant="destructive"
          class="w-full"
          (click)="ban()"
          [trnActionAllowed]="permissions().ban.available"
          [trnActionDisabledReason]="permissions().ban.reason"
          [trnTooltip]="permissions().ban.reason ?? 'Ban from room'"
          data-testid="member-info-ban"
        >
          Ban from room
        </button>
      </div>
    }
  </div>
</div>

@if (isPanel) {
  <div
    trnOverlaySurface
    variant="neutral"
    size="lg"
    layout="fullscreen"
    class="flex h-full flex-col"
  >
    <!-- Embedded mode only (room and space settings). There is no backdrop or Escape of its
         own there, so the header IS the way back to the settings member list. -->
    <trn-side-panel-header
      title="Member info"
      closeLabel="Close member info"
      closeTestId="member-info-close"
      [focusClose]="true"
      (closed)="close()"
    />
    <ng-container [ngTemplateOutlet]="profile" />
  </div>
} @else {
  <trn-dialog-shell
    title="Member info"
    size="sm"
    bodyClass="p-0"
    closeLabel="Close member info"
    closeTestId="member-info-close"
    (closed)="close()"
  >
    <ng-container [ngTemplateOutlet]="profile" />
  </trn-dialog-shell>
}
<ng-template #profile>
  <div class="member-info" data-testid="member-info">
    <trn-avatar
      class="member-info__avatar"
      [mxc]="member().roomAvatarMxc"
      [initial]="member().roomInitial"
      [name]="member().roomDisplayName"
      [exactSize]="56"
      [presence]="presenceState()"
    />
    <div class="member-info__id">
      <span class="member-info__name" data-testid="member-info-name">{{
        member().roomDisplayName
      }}</span>
      <span
        #userIdHandle
        class="member-info__handle"
        data-testid="member-info-handle"
        tabindex="0"
        role="textbox"
        aria-readonly="true"
        [attr.aria-label]="'Matrix user ID ' + member().userId"
        (focus)="selectUserId()"
        >{{ member().userId }}</span
      >
      <div class="member-info__badges">
        @switch (trust()) {
          @case ('verified') {
            <span trnBadge variant="success" data-testid="member-info-trust"
              ><span aria-hidden="true">✓</span> Verified</span
            >
          }
          @case ('changed') {
            <span trnBadge variant="warning" data-testid="member-info-trust"
              ><span aria-hidden="true">⚠</span> Identity changed<span
                class="sr-only"
              >
                — verify again</span
              ></span
            >
          }
        }
        <span trnBadge data-testid="member-info-role">{{ role() }}</span>
      </div>
    </div>

    <div
      trnTabs
      class="member-info__tabs"
      [value]="activeTab()"
      (valueChange)="tab.set($event)"
    >
      <div trnTabList aria-label="Member info sections">
        <button trnTab="profile">Profile</button>
        <button trnTab="rooms">{{ roomsTabLabel() }}</button>
        @if (manageOffered()) {
          <button trnTab="manage">Manage</button>
        }
      </div>

      <trn-member-profile-tab
        class="member-info__profile"
        trnTabPanel="profile"
        [focusable]="false"
        [member]="member()"
        [isSelf]="isSelf()"
        [trust]="trust()"
        [presence]="presenceDetails()"
        [globalName]="globalName()"
        [showIdentityActions]="showIdentityActions()"
        (messageUser)="message()"
        (verify)="verify()"
        (copyFailed)="selectUserId()"
      />

      <trn-member-rooms-tab
        class="member-info__rooms"
        trnTabPanel="rooms"
        [rooms]="commonRooms()"
        (open)="openRoom($event)"
      />

      @if (!isSelf()) {
        <trn-member-manage-tab
          class="member-info__actions"
          trnTabPanel="manage"
          [focusable]="false"
          [member]="member()"
          [roomId]="roomId()"
          [accountId]="accountId()"
          [owningAccountId]="owningAccountId()"
          [targetName]="targetName()"
          [noun]="noun()"
          [authorityRevision]="authorityRevision()"
          [hideUnavailableModeration]="hideUnavailableModeration()"
          [showIdentityActions]="showIdentityActions()"
          (finished)="close()"
        />
      }
    </div>
  </div>
</ng-template>

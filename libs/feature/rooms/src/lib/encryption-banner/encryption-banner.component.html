<!-- Always-mounted live region: a role="status" node inserted at the same moment
     its text appears (as the @if banner below is) is not reliably announced, so
     mirror the message here where the region already exists when the text changes. -->
<span class="sr-only" role="status" aria-live="polite">
  {{ visible() ? message() : '' }}
</span>
@if (visible()) {
  <trn-banner variant="accent">
    <trn-icon trnBannerIcon name="lock" />
    {{ message() }}
    <span trnBannerActions>
      @for (action of actions(); track action.kind) {
        <button
          trnBtn
          class="banner__action"
          size="sm"
          (click)="run(action.kind)"
        >
          {{ action.label }}
        </button>
      }
    </span>
  </trn-banner>
}

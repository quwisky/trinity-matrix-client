<div
  trnOverlaySurface
  variant="neutral"
  size="md"
  layout="dialog"
  class="flex flex-col gap-3 p-4"
  data-testid="reactions-dialog"
>
  <div class="flex items-center gap-2">
    <h2 class="flex-1 text-lg font-semibold">Reactions</h2>
    <button
      trnBtn
      type="button"
      variant="secondary"
      presentation="ghost"
      size="sm"
      (click)="close()"
    >
      Close
    </button>
  </div>

  @if (sections().length === 0) {
    <trn-empty-state
      layout="line"
      body="Nobody has reacted to this message."
      data-testid="reactions-empty"
    />
  } @else {
    <!-- One chip per emoji; the selected one's reactors are listed below. -->
    <div class="keys" role="tablist" aria-label="Reactions">
      @for (section of sections(); track section.key) {
        <button
          type="button"
          role="tab"
          class="key"
          [class.key--active]="section.key === selected()?.key"
          [attr.aria-selected]="section.key === selected()?.key"
          [attr.data-testid]="'reactions-key'"
          [attr.aria-label]="
            section.key + ', ' + section.reactors.length + ' reacted'
          "
          (click)="select(section.key)"
        >
          <span class="key__emoji">{{ section.key }}</span>
          <span class="key__count">{{ section.reactors.length }}</span>
        </button>
      }
    </div>

    @if (selected(); as section) {
      <ul class="reactors" data-testid="reactors-list">
        @for (reactor of section.reactors; track reactor.userId) {
          <li class="reactor">
            <trn-avatar
              [mxc]="reactor.avatarMxc"
              [initial]="reactor.initial"
              [name]="reactor.name"
              size="lg"
            />
            <span class="reactor__name">{{ reactor.name }}</span>
          </li>
        }
      </ul>
    }
  }
</div>

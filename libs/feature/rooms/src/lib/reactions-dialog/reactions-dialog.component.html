<trn-dialog-shell
  title="Reactions"
  [description]="total() + ' total'"
  size="xl"
  data-testid="reactions-dialog"
>
  <div class="reactions-dialog" [class.reactions-dialog--wide]="wide()">
    @if (sections().length === 0) {
      <trn-empty-state
        layout="line"
        body="Nobody has reacted to this message."
        data-testid="reactions-empty"
      />
    } @else {
      <div class="reactions-dialog__workspace">
        <nav
          class="keys"
          aria-label="Reaction types"
          data-testid="reactions-directory"
        >
          @for (section of sections(); track section.key) {
            <button
              trnBtn
              type="button"
              class="key"
              [variant]="
                section.key === selected()?.key ? 'secondary' : 'primary'
              "
              [presentation]="
                section.key === selected()?.key ? 'solid' : 'ghost'
              "
              size="md"
              [class.key--active]="section.key === selected()?.key"
              [attr.aria-pressed]="section.key === selected()?.key"
              [attr.aria-current]="
                section.key === selected()?.key ? 'true' : null
              "
              [attr.data-testid]="'reactions-key'"
              [attr.aria-label]="
                section.key + ', ' + section.reactors.length + ' reacted'
              "
              (click)="select(section.key)"
            >
              <span class="key__emoji">{{ section.key }}</span>
              <span class="key__count">{{ section.reactors.length }}</span>
            </button>
          }
        </nav>

        @if (selected(); as section) {
          <section
            class="reactions-dialog__detail"
            aria-label="People who reacted"
          >
            <h3>
              {{ section.key }} <span>{{ section.reactors.length }}</span>
            </h3>
            <ul class="reactors" data-testid="reactors-list">
              @for (reactor of section.reactors; track reactor.userId) {
                <li class="reactor">
                  <trn-avatar
                    [mxc]="reactor.avatarMxc"
                    [initial]="reactor.initial"
                    [name]="reactor.name"
                    size="lg"
                  />
                  <span class="reactor__name">{{ reactor.name }}</span>
                </li>
              }
            </ul>
          </section>
        }
      </div>
    }
  </div>
</trn-dialog-shell>

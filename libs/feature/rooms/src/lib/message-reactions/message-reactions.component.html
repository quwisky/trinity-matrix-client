<div class="reactions">
  @for (r of pills(); track r.key) {
    <button
      type="button"
      class="reaction"
      [class.reaction--mine]="r.reacted"
      [attr.aria-pressed]="r.reacted"
      [attr.aria-label]="r.hint"
      [trnTooltip]="r.hint"
      (click)="toggleReaction.emit(r.key)"
    >
      <span class="reaction__key">{{ r.key }}</span>
      <span class="reaction__count">{{ r.count }}</span>
    </button>
  }
  <button
    type="button"
    trnIconButton
    class="reaction reaction--who"
    data-testid="reactions-who"
    aria-label="See who reacted"
    trnTooltip="See who reacted"
    (click)="showReactors.emit()"
  >
    <trn-icon name="users" motion="pop" />
  </button>
</div>

<div
  trnOverlaySurface
  variant="neutral"
  size="sm"
  layout="popover"
  class="gif-picker flex flex-col"
>
  <input
    #searchInput
    trnInput
    type="search"
    class="gif-picker__search"
    placeholder="Search GIFs"
    aria-label="Search GIFs"
    [value]="query()"
    (input)="onInput($event)"
    data-testid="gif-search"
  />
  <div class="gif-picker__body">
    @if (loading()) {
      <trn-empty-state layout="line" aria-live="polite" body="Loading…" />
    } @else if (failed()) {
      <trn-empty-state
        layout="line"
        variant="danger"
        aria-live="polite"
        body="Couldn't load GIFs."
      >
        <button
          trnEmptyStateActions
          trnBtn
          type="button"
          variant="secondary"
          presentation="outline"
          size="sm"
          (click)="retry()"
          data-testid="gif-retry"
        >
          Try again
        </button>
      </trn-empty-state>
    } @else if (results().length === 0) {
      <trn-empty-state layout="line" aria-live="polite" body="No GIFs found." />
    } @else {
      <div class="gif-picker__grid" role="list">
        @for (gif of results(); track gif.id) {
          <!-- The listitem role lives on the WRAPPER: putting it on the button would
               replace the button role, so the GIF would not be announced as actionable. -->
          <div role="listitem" class="contents">
            <button
              type="button"
              class="gif-picker__item"
              [attr.aria-label]="gif.description || 'GIF'"
              data-testid="gif-result"
              (click)="gifSelect.emit(gif)"
            >
              <trn-gif-thumb [url]="gif.previewUrl" [alt]="gif.description" />
            </button>
          </div>
        }
      </div>
    }
  </div>
  @if (attribution()) {
    <p class="gif-picker__attribution">{{ attribution() }}</p>
  }
</div>

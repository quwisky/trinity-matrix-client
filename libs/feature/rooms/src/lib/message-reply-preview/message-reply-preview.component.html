@let r = reply();
<button
  type="button"
  class="msg__reply msg__target"
  [attr.aria-label]="label()"
  (click)="jump.emit(r.id)"
>
  <trn-avatar
    class="msg__reply-avatar"
    [mxc]="r.senderAvatarMxc"
    [initial]="r.senderInitial"
    [name]="r.senderName"
    size="2xs"
  />
  <span class="msg__reply-author">{{ r.senderName }}</span>
  @if (r.shield; as shield) {
    <trn-unencrypted-mark [shield]="shield" />
  }
  <span class="msg__reply-body">{{ r.body }}</span>
</button>

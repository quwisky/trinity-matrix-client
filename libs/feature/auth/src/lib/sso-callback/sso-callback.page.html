<trn-auth-card>
  <!-- Utilities, not a stylesheet: must not reach for the login form's `.login-card__*`
       rules (see scripts/component-styling.spec.mjs). -->
  <p
    trnAuthCardSubtitle
    class="m-0 text-base/[1.4] text-[var(--trinity-text-muted)]"
  >
    {{ error() ? 'Sign-in could not be completed' : 'Completing sign in…' }}
  </p>
  <h1 class="sr-only">Completing sign in</h1>
  @if (error(); as e) {
    <p class="mt-3 text-center text-sm text-danger" role="alert">{{ e }}</p>
    <button trnBtn class="mt-5 block w-full" (click)="back()">
      Back to sign in
    </button>
  } @else {
    <div class="pt-4 text-center" data-testid="sso-callback-body">
      <trn-spinner />
    </div>
  }
</trn-auth-card>

<trn-auth-card>
  <!-- Utilities rather than a stylesheet: this page draws two elements and neither is
       shared with the login form, whose own `.login-card__*` rules it must not reach for
       (see scripts/component-styling.spec.mjs). -->
  <p
    trnAuthCardSubtitle
    class="m-0 text-base/[1.4] text-[var(--trinity-text-muted)]"
  >
    {{ error() ? 'Sign-in could not be completed' : 'Completing sign in…' }}
  </p>
  <h1 class="sr-only">Completing sign in</h1>
  @if (error(); as e) {
    <p class="mt-3 text-center text-sm text-danger" role="alert">{{ e }}</p>
    <button hlmBtn class="mt-5 block w-full" (click)="back()">
      Back to sign in
    </button>
  } @else {
    <div class="pt-4 text-center" data-testid="sso-callback-body">
      <trn-spinner />
    </div>
  }
</trn-auth-card>

<main class="login-wrapper">
  <section trnCard class="login-card">
    <div trnCardHeader class="login-card__brand">
      <div class="login-card__brand-lockup">
        <span class="login-card__mark" aria-hidden="true">T</span>
        <div trnCardTitle class="login-card__wordmark">Trinity</div>
      </div>
      <ng-content select="[trnAuthCardSubtitle]" />
    </div>
    <!-- `trnCardContent` lives HERE, not at each call site: it supplies the card's
         horizontal padding (`px-(--card-spacing)`), and the redirect leg shipped without
         it once already — its error text and button ran edge to edge on a 420px card.
         One wrapper, and no leg can forget it. -->
    <div trnCardContent>
      <ng-content />
    </div>
  </section>
</main>

<ul class="emoji" aria-label="Compare these emoji with your other device">
  @for (e of emoji(); track $index) {
    <li class="emoji__item">
      <span class="emoji__glyph" aria-hidden="true">{{ e.glyph }}</span>
      <span class="emoji__name">{{ e.name }}</span>
    </li>
  }
</ul>

@if (confirmed()) {
  <div
    class="waiting"
    data-testid="sas-waiting"
    role="status"
    aria-live="polite"
  >
    <trn-spinner />
    <p class="hint">Waiting for the other device to confirm the emoji match…</p>
  </div>
} @else {
  <p class="hint">Do these emoji match the ones shown on your other device?</p>
}

<div class="actions">
  @if (!confirmed()) {
    <button
      hlmBtn
      class="w-full"
      data-testid="sas-match"
      [disabled]="busy()"
      (click)="match.emit()"
    >
      They match
    </button>
    <button
      hlmBtn
      class="w-full text-danger hover:text-danger"
      variant="outline"
      data-testid="sas-mismatch"
      [disabled]="busy()"
      (click)="mismatch.emit()"
    >
      They don't match
    </button>
  }
  <button
    hlmBtn
    class="w-full"
    variant="ghost"
    [disabled]="busy()"
    (click)="cancelled.emit()"
  >
    Cancel
  </button>
</div>

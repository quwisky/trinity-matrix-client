@if (pickerOpen()) {
  <div class="toolbar__picker">
    @for (emoji of quickEmojis; track emoji) {
      <button
        type="button"
        class="toolbar__emoji"
        [title]="emoji"
        (click)="pick(emoji)"
      >
        {{ emoji }}
      </button>
    }
  </div>
}

<div class="toolbar" role="toolbar">
  <button
    type="button"
    class="toolbar__btn"
    title="Add reaction"
    aria-label="Add reaction"
    [attr.aria-expanded]="pickerOpen()"
    (click)="pickerOpen.set(!pickerOpen())"
  >
    <ng-icon name="lucideSmile" aria-hidden="true" />
  </button>

  <button
    type="button"
    class="toolbar__btn"
    title="Reply"
    aria-label="Reply"
    (click)="replyMessage.emit()"
  >
    <ng-icon name="lucideReply" aria-hidden="true" />
  </button>

  @if (canThread()) {
    <button
      type="button"
      class="toolbar__btn"
      title="Reply in thread"
      aria-label="Reply in thread"
      (click)="openThread.emit()"
    >
      <ng-icon name="lucideMessagesSquare" aria-hidden="true" />
    </button>
  }

  <button
    type="button"
    class="toolbar__btn"
    title="Copy text"
    aria-label="Copy text"
    (click)="copyMessage.emit()"
  >
    <ng-icon name="lucideCopy" aria-hidden="true" />
  </button>

  @if (canEdit()) {
    <button
      type="button"
      class="toolbar__btn"
      title="Edit"
      aria-label="Edit message"
      (click)="editMessage.emit()"
    >
      <ng-icon name="lucidePencil" aria-hidden="true" />
    </button>
  }

  @if (canDelete()) {
    <button
      type="button"
      class="toolbar__btn toolbar__btn--danger"
      title="Delete"
      aria-label="Delete message"
      (click)="deleteMessage.emit()"
    >
      <ng-icon name="lucideTrash2" aria-hidden="true" />
    </button>
  }
</div>

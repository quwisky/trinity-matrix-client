@if (pickerOpen()) {
  <div
    class="toolbar__picker"
    [id]="pickerId"
    (keydown.escape)="pickerOpen.set(false)"
  >
    @for (emoji of quickEmojis; track emoji) {
      <button
        type="button"
        class="toolbar__emoji"
        [title]="emoji"
        (click)="pick(emoji)"
      >
        {{ emoji }}
      </button>
    }
  </div>
}

<div class="toolbar" role="toolbar" aria-label="Message actions">
  <button
    type="button"
    class="toolbar__btn"
    hlmTooltip="Add reaction"
    aria-label="Add reaction"
    [attr.aria-expanded]="pickerOpen()"
    [attr.aria-controls]="pickerOpen() ? pickerId : null"
    (keydown.escape)="pickerOpen.set(false)"
    (click)="pickerOpen.set(!pickerOpen())"
  >
    <ng-icon name="lucideSmile" aria-hidden="true" />
  </button>

  <button
    type="button"
    class="toolbar__btn"
    hlmTooltip="Reply"
    aria-label="Reply"
    (click)="replyMessage.emit()"
  >
    <ng-icon name="lucideReply" aria-hidden="true" />
  </button>

  @if (canThread()) {
    <button
      type="button"
      class="toolbar__btn"
      hlmTooltip="Reply in thread"
      aria-label="Reply in thread"
      (click)="openThread.emit()"
    >
      <ng-icon name="lucideMessagesSquare" aria-hidden="true" />
    </button>
  }

  <button
    type="button"
    class="toolbar__btn"
    [hlmDropdownMenuTrigger]="moreMenu"
    align="end"
    hlmTooltip="More actions"
    aria-label="More actions"
    data-testid="msg-more"
  >
    <ng-icon name="lucideEllipsis" aria-hidden="true" />
  </button>
</div>

<ng-template #moreMenu>
  <div hlmDropdownMenu>
    @if (canPin()) {
      <button
        hlmDropdownMenuItem
        (triggered)="togglePin.emit()"
        data-testid="msg-pin"
      >
        <ng-icon name="lucidePin" />
        {{ pinned() ? 'Unpin message' : 'Pin message' }}
      </button>
    }
    <button
      hlmDropdownMenuItem
      (triggered)="copyMessage.emit()"
      data-testid="msg-copy"
    >
      <ng-icon name="lucideCopy" />
      Copy text
    </button>
    @if (canEdit()) {
      <button
        hlmDropdownMenuItem
        (triggered)="editMessage.emit()"
        data-testid="msg-edit"
      >
        <ng-icon name="lucidePencil" />
        Edit message
      </button>
    }
    @if (canDelete()) {
      <div hlmDropdownMenuSeparator></div>
      <button
        hlmDropdownMenuItem
        variant="destructive"
        (triggered)="deleteMessage.emit()"
        data-testid="msg-delete"
      >
        <ng-icon name="lucideTrash2" />
        Delete message
      </button>
    }
  </div>
</ng-template>

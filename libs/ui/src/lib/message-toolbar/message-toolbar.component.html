@if (pickerOpen()) {
  <div
    class="toolbar__picker"
    [id]="pickerId"
    (keydown.escape)="pickerOpen.set(false)"
  >
    @for (emoji of quickEmojis; track emoji) {
      <button
        type="button"
        class="toolbar__emoji"
        [title]="emoji"
        (click)="pick(emoji)"
      >
        {{ emoji }}
      </button>
    }
    <button
      type="button"
      class="toolbar__emoji toolbar__emoji--more"
      title="More emoji"
      aria-label="More emoji"
      data-testid="react-more"
      (click)="pickMore()"
    >
      <ng-icon name="lucidePlus" aria-hidden="true" />
    </button>
  </div>
}

<div class="toolbar" role="toolbar" aria-label="Message actions">
  <button
    type="button"
    class="toolbar__btn"
    hlmTooltip="Add reaction"
    aria-label="Add reaction"
    [attr.aria-expanded]="pickerOpen()"
    [attr.aria-controls]="pickerOpen() ? pickerId : null"
    (keydown.escape)="pickerOpen.set(false)"
    (click)="pickerOpen.set(!pickerOpen())"
  >
    <ng-icon name="lucideSmile" aria-hidden="true" />
  </button>

  <button
    type="button"
    class="toolbar__btn"
    hlmTooltip="Reply"
    aria-label="Reply"
    (click)="action.emit({ type: 'reply' })"
  >
    <ng-icon name="lucideReply" aria-hidden="true" />
  </button>

  @if (caps().canThread) {
    <button
      type="button"
      class="toolbar__btn"
      hlmTooltip="Reply in thread"
      aria-label="Reply in thread"
      (click)="action.emit({ type: 'thread' })"
    >
      <ng-icon name="lucideMessagesSquare" aria-hidden="true" />
    </button>
  }

  <button
    type="button"
    class="toolbar__btn"
    [hlmDropdownMenuTrigger]="moreMenu"
    align="end"
    hlmTooltip="More actions"
    aria-label="More actions"
    data-testid="msg-more"
  >
    <ng-icon name="lucideEllipsis" aria-hidden="true" />
  </button>
</div>

<ng-template #moreMenu>
  <div hlmDropdownMenu>
    @if (caps().canPin) {
      <button
        hlmDropdownMenuItem
        (triggered)="action.emit({ type: 'pin' })"
        data-testid="msg-pin"
      >
        <ng-icon name="lucidePin" />
        {{ caps().pinned ? 'Unpin message' : 'Pin message' }}
      </button>
    }
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'copy' })"
      data-testid="msg-copy"
    >
      <ng-icon name="lucideCopy" />
      Copy text
    </button>
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'forward' })"
      data-testid="msg-forward"
    >
      <ng-icon name="lucideForward" />
      Forward
    </button>
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'report' })"
      data-testid="msg-report"
    >
      <ng-icon name="lucideFlag" />
      Report message
    </button>
    @if (caps().canEdit) {
      <button
        hlmDropdownMenuItem
        (triggered)="action.emit({ type: 'edit' })"
        data-testid="msg-edit"
      >
        <ng-icon name="lucidePencil" />
        Edit message
      </button>
    }
    @if (caps().canDelete) {
      <div hlmDropdownMenuSeparator></div>
      <button
        hlmDropdownMenuItem
        variant="destructive"
        (triggered)="action.emit({ type: 'delete' })"
        data-testid="msg-delete"
      >
        <ng-icon name="lucideTrash2" />
        Delete message
      </button>
    }
  </div>
</ng-template>

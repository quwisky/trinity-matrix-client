<ion-header>
  <ion-toolbar>
    <ion-title>Sign in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1 class="sr-only">Sign in to Trinity</h1>
  @if (!baseUrl()) {
    <!-- Step 1: pick a homeserver and discover its login flows. -->
    <ion-list>
      <ion-item>
        <ion-input
          label="Homeserver"
          labelPlacement="stacked"
          autocapitalize="off"
          autocorrect="off"
          placeholder="matrix.org"
          [disabled]="busy()"
          [ngModel]="homeserverInput()"
          (ngModelChange)="homeserverInput.set($event)"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" [disabled]="busy()" (click)="discover()">
      Continue
    </ion-button>
  } @else {
    <!-- Step 2: surface the discovered login options. -->
    <ion-text color="medium">
      <p>Homeserver: {{ baseUrl() }}</p>
    </ion-text>

    @if (passwordSupported()) {
      <ion-list>
        <ion-item>
          <ion-input
            label="Username"
            labelPlacement="stacked"
            autocapitalize="off"
            autocorrect="off"
            [disabled]="busy()"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            [disabled]="busy()"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="block" [disabled]="busy()" (click)="loginPassword()">
        Sign in
      </ion-button>
    }
    @if (ssoSupported()) {
      <ion-button
        expand="block"
        fill="outline"
        [disabled]="busy()"
        (click)="startSso()"
      >
        Continue with SSO
      </ion-button>
    }
  }
  @if (busy()) {
    <div
      class="ion-text-center ion-padding-top"
      role="status"
      aria-live="polite"
    >
      <ion-spinner></ion-spinner>
      <p><ion-text color="medium">Working…</ion-text></p>
    </div>
  }
  @if (error(); as message) {
    <ion-text color="danger">
      <p role="alert">{{ message }}</p>
    </ion-text>
  }
</ion-content>

@switch (mode()) {
  @case ('dock') {
    <div class="call-host__dock" role="region" aria-label="Call">
      <trn-banner variant="accent">
        <trn-icon trnBannerIcon name="phone" />
        Call in progress
        <span trnBannerActions>
          <button trnBtn size="sm" (click)="returnToCall()">
            Return to call
          </button>
          <button trnBtn size="sm" variant="danger" (click)="hangUp()">
            Hang up
          </button>
        </span>
      </trn-banner>
      <div #dockSlot class="call-host__slot"></div>
    </div>
  }
  @case ('failed') {
    <div class="call-host__dock">
      <trn-banner variant="accent" role="alert">
        <trn-icon trnBannerIcon name="triangle-alert" />
        The call could not start
        <span trnBannerActions>
          <button trnBtn size="sm" (click)="hangUp()">Close</button>
        </span>
      </trn-banner>
    </div>
  }
}

@for (id of callIds(); track id) {
  <iframe
    #callFrame
    class="call-host__frame"
    title="Call"
    allow="camera; microphone; display-capture; autoplay; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
    [style.top.px]="rect().top"
    [style.left.px]="rect().left"
    [style.width.px]="rect().width"
    [style.height.px]="rect().height"
  ></iframe>
}

@if (mode() === 'stage' && call()?.state === 'loading') {
  <div
    class="call-host__loading"
    [style.top.px]="rect().top"
    [style.left.px]="rect().left"
    [style.width.px]="rect().width"
    [style.height.px]="rect().height"
  >
    <trn-spinner size="lg" aria-label="Joining the call" />
    <button trnBtn size="sm" variant="danger" (click)="hangUp()">
      Hang up
    </button>
  </div>
}

@if (visible) {
  @if (!isMac) {
    <button
      trnBtn
      presentation="ghost"
      size="sm"
      shape="icon"
      class="title-bar__button"
      type="button"
      aria-label="Application menu"
      aria-haspopup="menu"
      data-testid="title-bar-menu"
      (click)="openMenu($event)"
    >
      <trn-icon name="menu" motion="pop" />
    </button>
  }
  <span class="title-bar__title" data-testid="title-bar-title">{{
    titleBar.title()
  }}</span>
  <div class="title-bar__actions">
    @if (titleBar.quickSwitcher(); as openSwitcher) {
      <button
        trnBtn
        presentation="ghost"
        size="sm"
        shape="icon"
        class="title-bar__button"
        type="button"
        aria-label="Search (Ctrl/Cmd+K)"
        data-testid="title-bar-switcher"
        (click)="openSwitcher()"
      >
        <trn-icon name="command" motion="pop" />
      </button>
    }
    @if (systemStatus.hasProblems()) {
      <button
        trnBtn
        presentation="ghost"
        size="sm"
        shape="icon"
        class="title-bar__button"
        type="button"
        aria-label="System status"
        data-testid="title-bar-status"
        (click)="showStatus($event)"
      >
        <trn-icon name="shield-alert" motion="pop" />
      </button>
    }
  </div>
}

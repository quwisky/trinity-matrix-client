<!-- The drag area: the handle and whatever header the content projects into it. -->
<div class="sheet-frame__grab" trnSheetDragHandle>
  @if (swipeable && !drag.toggleable()) {
    <div
      class="sheet-frame__handle"
      data-testid="sheet-handle"
      aria-hidden="true"
    ></div>
  }
  <ng-content select="[trnSheetFrameHeader]" />
</div>
<ng-content />
<!-- Last in the DOM, first on screen: initial focus and Tab reach the sheet's own content first. -->
@if (swipeable && drag.toggleable(); as toggle) {
  <button
    type="button"
    class="sheet-frame__toggle"
    trnSheetDragHandle
    data-trn-sheet-toggle
    [attr.aria-label]="toggle === 'expand' ? 'Expand' : 'Collapse'"
    [attr.aria-expanded]="toggle === 'collapse'"
    (click)="drag.toggle()"
  >
    <span
      class="sheet-frame__handle"
      data-testid="sheet-handle"
      aria-hidden="true"
    ></span>
  </button>
}

<div class="grid max-w-sm gap-4 p-6">
  <button
    trnBtn
    variant="secondary"
    presentation="outline"
    type="button"
    [trnDropdownMenuTrigger]="menu"
    side="bottom"
    align="end"
    data-testid="dropdown-trigger"
  >
    Open actions
  </button>
  <p role="status" data-testid="dropdown-result">{{ result() }}</p>
</div>

<ng-template #menu>
  <div trnDropdownMenu aria-label="Overlay actions">
    <button
      trnDropdownMenuItem
      data-testid="dropdown-neutral"
      (triggered)="result.set('Neutral chosen')"
    >
      Neutral action
    </button>
    <button
      trnDropdownMenuItem
      variant="danger"
      data-testid="dropdown-danger"
      (triggered)="result.set('Danger chosen')"
    >
      Canonical danger
    </button>
    <button trnDropdownMenuItem disabled data-testid="dropdown-disabled">
      Disabled action
    </button>
    <div trnDropdownMenuSeparator></div>
    <div trnDropdownMenuLabel>Selection states</div>
    <button
      trnDropdownMenuCheckbox
      checked
      data-testid="dropdown-selected-checkbox"
    >
      <trn-dropdown-menu-checkbox-indicator />
      Selected option
    </button>
    <button
      trnDropdownMenuCheckbox
      checked
      disabled
      lockedSelection
      data-testid="dropdown-locked-checkbox"
    >
      <trn-dropdown-menu-checkbox-indicator />
      Locked selection
    </button>
    <button
      trnDropdownMenuItem
      [trnDropdownMenuSubTrigger]="subMenu"
      data-testid="dropdown-submenu-trigger"
    >
      More choices
      <trn-dropdown-menu-item-sub-indicator />
    </button>
  </div>
</ng-template>

<ng-template #subMenu>
  <div trnDropdownMenuSub aria-label="More overlay choices">
    <div trnDropdownMenuLabel>Radio choices</div>
    <button
      trnDropdownMenuRadio
      checked
      [keepOpen]="false"
      data-testid="dropdown-selected-radio"
    >
      <trn-dropdown-menu-radio-indicator />
      Selected radio
    </button>
    <button
      trnDropdownMenuRadio
      [keepOpen]="false"
      data-testid="dropdown-unselected-radio"
    >
      <trn-dropdown-menu-radio-indicator />
      Unselected radio
    </button>
  </div>
</ng-template>

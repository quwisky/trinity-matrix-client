<div class="grid max-w-md gap-3 p-6">
  <button
    trnBtn
    type="button"
    data-testid="alert-neutral"
    (click)="neutralAlert()"
  >
    Neutral alert
  </button>
  <button
    trnBtn
    type="button"
    data-testid="alert-canonical"
    (click)="canonicalAlert()"
  >
    Canonical danger alert
  </button>
  <button
    trnBtn
    type="button"
    data-testid="alert-prompt"
    (click)="canonicalPrompt()"
  >
    Canonical prompt
  </button>
  <button
    trnBtn
    type="button"
    data-testid="sheet-canonical"
    (click)="canonicalSheet()"
  >
    Canonical action sheet
  </button>
  <button
    trnBtn
    type="button"
    data-testid="toast-neutral"
    (click)="neutralToast()"
  >
    Neutral toast
  </button>
  <button
    trnBtn
    type="button"
    data-testid="toast-success"
    (click)="successToast()"
  >
    Success toast
  </button>
  <button
    trnBtn
    type="button"
    data-testid="toast-warning"
    (click)="warningToast()"
  >
    Warning toast
  </button>
  <button
    trnBtn
    type="button"
    data-testid="toast-danger"
    (click)="dangerToast()"
  >
    Danger toast
  </button>
  <button
    trnBtn
    type="button"
    data-testid="toast-action"
    (click)="actionToast()"
  >
    Action toast
  </button>
</div>
<trn-toaster />

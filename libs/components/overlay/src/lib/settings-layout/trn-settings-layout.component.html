<section
  trnOverlaySurface
  variant="neutral"
  size="2xl"
  [layout]="surfaceLayout()"
  class="settings-layout"
  [class.settings-layout--compact]="compact()"
  [style.width]="compact() ? '100vw' : null"
  [style.height]="compact() ? '100dvh' : null"
  [attr.data-testid]="testId()"
>
  <header class="settings-layout__header">
    @if (compact() && !directoryVisible() && selectedSection()) {
      <button
        trnBtn
        presentation="ghost"
        shape="icon"
        size="md"
        aria-label="Back to sections"
        [attr.data-testid]="testId() + '-mobile-back'"
        (click)="backRequested.emit()"
      >
        <trn-icon name="arrow-left" motion="nudge-left" />
      </button>
    }
    <div class="settings-layout__heading">
      <h1 data-autofocus data-settings-autofocus tabindex="-1">
        {{ title() }}
      </h1>
      <ng-content select="[settings-context]" />
    </div>
    <button
      trnBtn
      presentation="ghost"
      shape="icon"
      size="md"
      [attr.aria-label]="'Close ' + title()"
      [attr.data-testid]="resolvedCloseTestId()"
      (click)="closeRequested.emit()"
    >
      <trn-icon name="x" motion="rotate" />
    </button>
  </header>

  <div class="settings-layout__warning">
    <ng-content select="[settings-warning]" />
  </div>

  <div class="settings-layout__workspace" data-testid="settings-workspace">
    <nav
      #directory
      class="settings-layout__directory no-scrollbar"
      [class.settings-pane--hidden]="compact() && !directoryVisible()"
      [attr.aria-label]="directoryLabel()"
      [attr.data-testid]="testId() + '-directory'"
    >
      @for (section of sections(); track section.id; let index = $index) {
        @if (isGroupStart(index)) {
          <p class="settings-layout__group">{{ section.group }}</p>
        }
        <button
          trnBtn
          [variant]="selectedSection() === section.id ? 'secondary' : 'primary'"
          [presentation]="selectedSection() === section.id ? 'solid' : 'ghost'"
          size="md"
          class="settings-layout__directory-item"
          [class.is-active]="selectedSection() === section.id"
          [attr.aria-current]="selectedSection() === section.id ? 'page' : null"
          [attr.data-testid]="sectionTestId(section)"
          [attr.data-trn-settings-section]="section.id"
          (click)="selectSection(section.id)"
        >
          <trn-icon
            [name]="section.icon"
            size="md"
            [variant]="selectedSection() === section.id ? 'accent' : 'muted'"
          />
          <span class="settings-layout__directory-label">{{
            section.label
          }}</span>
          @if (compact()) {
            <trn-icon name="chevron-right" size="md" variant="muted" />
          }
        </button>
      }
      <div class="settings-layout__directory-footer">
        <ng-content select="[settings-nav-footer]" />
      </div>
    </nav>

    <section
      #detail
      [class]="detailClasses()"
      [class.settings-pane--hidden]="compact() && directoryVisible()"
      [attr.data-testid]="resolvedDetailTestId()"
    >
      <div class="settings-layout__detail-content">
        <ng-content />
      </div>
    </section>
  </div>
</section>

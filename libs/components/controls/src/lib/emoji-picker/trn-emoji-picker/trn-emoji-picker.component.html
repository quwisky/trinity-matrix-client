<!--
  The vendor picker (and its emoji data) is about 1 MB, so it loads when this element first
  renders instead of with the app. The placeholder holds the medium picker's footprint so the
  surrounding overlay does not jump on arrival.
-->
@defer (on immediate) {
  <trn-emoji-picker-panel
    [size]="size()"
    [autoFocusSearch]="autoFocusSearch()"
    [fill]="layout() === 'fill'"
    [shown]="shown()"
    [recent]="recent()"
    (emojiSelect)="onSelect($event)"
  />
} @placeholder {
  <div
    class="trn-emoji-picker__placeholder"
    data-testid="emoji-picker-placeholder"
  ></div>
}

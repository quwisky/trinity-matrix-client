<!--
  The vendor picker (and its emoji data) is about 1 MB, so it loads when this element first
  renders instead of with the app. Both call sites only render it while open. The placeholder
  holds the medium picker's footprint so the surrounding overlay does not jump on arrival;
  the vendor pins and theming notes live in the panel's template.
-->
@defer (on immediate) {
  <trn-emoji-picker-panel [size]="size()" (emojiSelect)="onSelect($event)" />
} @placeholder {
  <div
    class="trn-emoji-picker__placeholder"
    data-testid="emoji-picker-placeholder"
  ></div>
}

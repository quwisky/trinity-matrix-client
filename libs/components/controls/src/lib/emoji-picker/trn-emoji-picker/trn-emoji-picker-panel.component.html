<!--
  `isNative`, `showPreview` and `useButton` are pinned, not inputs: native glyphs mean no
  sprite-sheet requests, the preview row is unused, and emoji are actions rather than
  labelled generic spans. `title` and `emoji` are absent because the vendor renders them only
  inside the preview.

  `darkMode` is pinned OFF, not left unbound: the vendor defaults it to
  `matchMedia('(prefers-color-scheme: dark)').matches`, so an absent binding follows the OS
  and would apply `.emoji-mart-dark` whatever the Trinity theme says.

  `color` is the vendor's accent, written as an INLINE style (the anchor bar background and
  the selected anchor's `color`, which its icon takes through `fill: currentColor`). No
  stylesheet rule outranks that without `!important`, so the token goes in through the
  vendor's own input.
-->
@if (ready()) {
  <emoji-mart
    [isNative]="true"
    [showPreview]="false"
    [useButton]="true"
    [darkMode]="false"
    [color]="accent"
    [emojiSize]="vendorEmojiSize()"
    [perLine]="perLine()"
    [style]="vendorStyle()"
    [autoFocus]="autoFocusSearch()"
    [recent]="vendorRecent()"
    (emojiSelect)="emojiSelect.emit($event)"
  />
}

@if (pickerOpen()) {
  <div
    class="toolbar__picker"
    [id]="pickerId"
    (keydown.escape)="pickerOpen.set(false)"
  >
    @for (emoji of quickEmojis; track emoji) {
      <button
        type="button"
        class="toolbar__emoji"
        [title]="emoji"
        (click)="pick(emoji)"
      >
        {{ emoji }}
      </button>
    }
    <button
      type="button"
      class="toolbar__emoji toolbar__emoji--more"
      title="More emoji"
      aria-label="More emoji"
      data-testid="react-more"
      (click)="pickMore()"
    >
      <trn-icon name="plus" />
    </button>
  </div>
}

<div class="toolbar" role="toolbar" aria-label="Message actions">
  <button
    type="button"
    class="toolbar__btn"
    trnTooltip="Add reaction"
    aria-label="Add reaction"
    [attr.aria-expanded]="pickerOpen()"
    [attr.aria-controls]="pickerOpen() ? pickerId : null"
    (keydown.escape)="pickerOpen.set(false)"
    (click)="togglePicker()"
  >
    <trn-icon name="smile" />
  </button>

  <button
    type="button"
    class="toolbar__btn"
    trnTooltip="Reply"
    aria-label="Reply"
    (click)="action.emit({ type: 'reply' })"
  >
    <trn-icon name="reply" />
  </button>

  @if (caps().canThread) {
    <button
      type="button"
      class="toolbar__btn"
      trnTooltip="Reply in thread"
      aria-label="Reply in thread"
      (click)="action.emit({ type: 'thread' })"
    >
      <trn-icon name="messages-square" />
    </button>
  }

  <button
    type="button"
    class="toolbar__btn"
    [hlmDropdownMenuTrigger]="moreMenu"
    align="end"
    trnTooltip="More actions"
    aria-label="More actions"
    data-testid="msg-more"
  >
    <trn-icon name="ellipsis" />
  </button>
</div>

<ng-template #moreMenu>
  <div hlmDropdownMenu>
    @if (caps().canPin) {
      <button
        hlmDropdownMenuItem
        (triggered)="action.emit({ type: 'pin' })"
        data-testid="msg-pin"
      >
        <trn-icon name="pin" />
        {{ caps().pinned ? 'Unpin message' : 'Pin message' }}
      </button>
    }
    @if (caps().canQuote) {
      <button
        hlmDropdownMenuItem
        (triggered)="action.emit({ type: 'quote' })"
        data-testid="msg-quote"
      >
        <trn-icon name="quote" />
        Quote
      </button>
    }
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'copy' })"
      data-testid="msg-copy"
    >
      <trn-icon name="copy" />
      Copy text
    </button>
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'copy-link' })"
      data-testid="msg-copy-link"
    >
      <trn-icon name="link" />
      Copy link
    </button>
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'forward' })"
      data-testid="msg-forward"
    >
      <trn-icon name="forward" />
      Forward
    </button>
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'view-source' })"
      data-testid="msg-view-source"
    >
      <trn-icon name="code" />
      View source
    </button>
    <button
      hlmDropdownMenuItem
      (triggered)="action.emit({ type: 'report' })"
      data-testid="msg-report"
    >
      <trn-icon name="flag" />
      Report message
    </button>
    @if (caps().canEdit) {
      <button
        hlmDropdownMenuItem
        (triggered)="action.emit({ type: 'edit' })"
        data-testid="msg-edit"
      >
        <trn-icon name="pencil" />
        Edit message
      </button>
    }
    @if (caps().canDelete) {
      <div hlmDropdownMenuSeparator></div>
      <button
        hlmDropdownMenuItem
        variant="destructive"
        (triggered)="action.emit({ type: 'delete' })"
        data-testid="msg-delete"
      >
        <trn-icon name="trash-2" />
        Delete message
      </button>
    }
  </div>
</ng-template>

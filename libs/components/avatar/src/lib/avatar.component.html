<hlm-avatar
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.borderRadius]="square() ? '30%' : null"
>
  @if (src()) {
    <img
      decoding="async"
      hlmAvatarImage
      [src]="src()"
      [alt]="name()"
      [style.borderRadius]="square() ? '30%' : null"
    />
  }
  <span
    hlmAvatarFallback
    class="leading-none font-semibold"
    [style.background]="color()"
    [style.color]="initialColor()"
    [style.font-size.px]="size() * 0.4"
    [style.borderRadius]="square() ? '30%' : null"
    >{{ initial() }}</span
  >
</hlm-avatar>
@if (presence(); as state) {
  <span
    class="presence-dot"
    role="img"
    [attr.aria-label]="presenceTitle()"
    [title]="presenceTitle()"
    [attr.data-presence]="state"
    [style.width.px]="dotSize()"
    [style.height.px]="dotSize()"
    [style.background]="presenceColor()"
  ></span>
}
@if (accountBadge(); as badge) {
  <span
    class="account-badge"
    role="img"
    data-testid="account-badge"
    [attr.aria-label]="'Account: ' + badge.name + ' (' + badge.id + ')'"
    [title]="badge.name + ' (' + badge.id + ')'"
    [style.width.px]="badgeSize()"
    [style.height.px]="badgeSize()"
    [style.font-size.px]="badgeSize() * 0.6"
    [style.background]="badgeColor()"
    [style.color]="badgeInk()"
  >
    @if (badgeSrc(); as badgeUrl) {
      <img
        class="account-badge__img"
        decoding="async"
        [src]="badgeUrl"
        alt=""
        (error)="onBadgeImageError()"
      />
    } @else {
      {{ badge.initial }}
    }
  </span>
}

<div
  class="banner"
  [attr.data-variant]="variant()"
  [attr.data-trn-surface]="surface()"
>
  <!-- Keep each slot span free of whitespace: the stylesheet hides an empty slot
       with :empty, and a whitespace text node would keep it (#1221). -->
  <span class="banner__icon"><ng-content select="[trnBannerIcon]" /></span>
  <!-- Presentational only. Announcement is the consumer's job via a persistent
       sr-only live region: a role="status" inserted together with its text (as an
       @if banner is) isn't reliably announced, and making this visible text a second
       live region would double-announce. -->
  <span class="banner__text"><ng-content /></span>
  <span class="banner__actions"
    ><ng-content select="[trnBannerActions]"
  /></span>
</div>

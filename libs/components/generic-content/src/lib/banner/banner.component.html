<div
  class="banner"
  [attr.data-variant]="variant()"
  [attr.data-placement]="placement()"
  [attr.data-trn-surface]="surface()"
>
  <!-- Keep each slot span free of whitespace: a whitespace text node defeats the stylesheet's
       `:empty` hiding. -->
  <span class="banner__icon"><ng-content select="[trnBannerIcon]" /></span>
  <!-- Presentational only. Announcement is the consumer's job via a persistent sr-only live
       region: a role="status" inserted together with its text (as an @if banner is) isn't
       reliably announced, and a second live region here would double-announce. -->
  <span class="banner__text"><ng-content /></span>
  <span class="banner__actions"
    ><ng-content select="[trnBannerActions]"
  /></span>
</div>

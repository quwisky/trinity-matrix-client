<!-- `text-balance` on the copy rather than a width cap: these sit in panels from a 280px
     sidebar to a full chat pane. -->
<div
  [class]="layoutClass()"
  [attr.data-variant]="variant()"
  [attr.data-layout]="layout()"
>
  @if (badge(); as glyph) {
    <!-- `aria-hidden`: decoration for a title that says the same thing in words. -->
    <span
      class="mb-2 flex size-[68px] items-center justify-center rounded-full bg-[var(--trinity-sidebar)] text-[34px] text-muted-foreground"
      aria-hidden="true"
      >{{ glyph }}</span
    >
  }

  @if (icon(); as name) {
    <trn-icon [name]="name" size="xl" variant="muted" />
  }

  @if (title(); as heading) {
    @if (titleAs() === 'h2') {
      <h2 [class]="titleClass()">{{ heading }}</h2>
    } @else {
      <p [class]="titleClass()">{{ heading }}</p>
    }
  }

  <!-- Content wins over `body`: `ng-content` cannot be asked whether it received anything, so
       the interpolation is the slot's fallback and a projecting call site does not set `body`.
       `empty:hidden` covers neither being set (the title's `@if` has no such guard); `:empty`
       still matches with only a comment anchor or empty text node inside (Chromium, WebKit). -->
  <p [class]="bodyClass()">
    <ng-content>{{ body() }}</ng-content>
  </p>

  <div [class]="actionsClass">
    <ng-content select="[trnEmptyStateActions]" />
  </div>
</div>

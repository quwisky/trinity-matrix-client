<!--
  Static attribute, not a binding: NgIcon reads `aria-hidden` via HostAttributeToken at
  construction and force-hides itself when it is absent. The label goes on the HOST; an
  `[attr.aria-label]` here is silently suppressed by that same force-hiding.
  `size` is bound: the public null default resolves to '', so Angular drops `--ng-icon__size`
  and the `1em` default applies.
-->
<ng-icon aria-hidden="true" [name]="name()" [size]="resolvedSize()" />

name: Container

# Publishes the self-hostable web app to ghcr.io/quwisky/trinity-web when a release is
# published. Publishing is a maintainer action, so drafts never reach GHCR. The image is
# built from the release's own Trinity-Web-<version>.zip, verified against the tag commit
# and smoke-tested before anything is pushed. workflow_dispatch republishes a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published vX.Y.Z or vX.Y.Z-next.N release to push to GHCR'
        required: true

# One registry writer at a time; never cancel a half-pushed manifest.
concurrency:
  group: container
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Verifies, smoke-tests and stages the image with a read-only token. This job installs and
  # runs the workspace's dependencies, so the registry token stays in publish below.
  build:
    name: Build and smoke-test the web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      names: ${{ steps.stage.outputs.names }}
      revision: ${{ steps.stage.outputs.revision }}
    steps:
      - id: release
        name: Resolve the release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-next\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z or vX.Y.Z-next.N tag."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "false" ]; then
            echo "::error::$TAG is not a published release."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "asset=Trinity-Web-${TAG#v}.zip"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Restore the released web app
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -xF "$ASSET" >/dev/null; then
            echo "::error::$TAG has no $ASSET release asset; the draft was published without the web zip."
            exit 1
          fi
          if ! gh release download "$TAG" -p "$ASSET" -D release-web; then
            echo "::error::Could not download $ASSET for $TAG; re-run the job."
            exit 1
          fi
          unzip -q "release-web/$ASSET" -d release-web
          rm -rf www
          mv release-web/trinity-web/www www
          mkdir -p dist
          mv release-web/trinity-web/web-bundle-manifest.json dist/web-bundle-manifest.json

      - uses: ./.github/actions/setup
      # Bound to the checked-out tag commit: a zip from another commit stops here.
      - run: node scripts/web-bundle-manifest.mjs verify dist/web-bundle-manifest.json www
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      # Builds the amd64 image locally and proves the HTTP, routing and offline PWA contract.
      - run: pnpm nx run trinity-web-container:smoke

      - id: stage
        name: Stage the image context and its tags
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Every published release, so an old stable never falls out of the comparison.
          PUBLISHED_TAGS=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft | not) | .tag_name')
          export PUBLISHED_TAGS
          # An assignment keeps the script's exit status, so a failure stops the job here.
          out=$(node scripts/web-image-tags.mjs --tag "$TAG")
          mapfile -t names < <(printf '%s\n' "$out" | grep .)
          if [ ${#names[@]} -eq 0 ]; then
            echo "::error::No image tags computed for $TAG."
            exit 1
          fi
          node scripts/web-container.mjs stage dist/web-image-context
          # A tarball keeps the file modes the stage step set; the Dockerfile copies them as is.
          tar -cf dist/web-image-context.tar -C dist web-image-context
          {
            echo "names=${names[*]}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-image-context
          path: dist/web-image-context.tar
          if-no-files-found: error
          retention-days: 1

  # The only job with the registry token. It installs nothing and runs no repository code:
  # Buildx pushes the context build verified and staged.
  publish:
    name: Publish the web image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/quwisky/trinity-web
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-image-context
          path: dist
      - run: tar -xf dist/web-image-context.tar -C dist

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push linux/amd64 and linux/arm64
        env:
          NAMES: ${{ needs.build.outputs.names }}
          VERSION: ${{ needs.build.outputs.version }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          read -ra names <<< "$NAMES"
          tags=()
          for name in "${names[@]}"; do tags+=(--tag "$IMAGE:$name"); done
          # The Dockerfile only copies files onto a multi-arch base, so no emulation is needed.
          # GHCR links a multi-arch package to this repository from the index annotations,
          # not the per-platform labels.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$REVISION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Trinity Matrix client static web host" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --metadata-file dist/web-image-metadata.json \
            --provenance=false \
            --push \
            dist/web-image-context
          # Fails the job rather than printing "undefined" if Buildx omits the digest.
          digest=$(node -e "const d = require('./dist/web-image-metadata.json')['containerimage.digest']; if (!d) process.exit(1); console.log(d)")
          {
            echo "### Pushed $IMAGE"
            for name in "${names[@]}"; do echo "- \`$name\`"; done
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

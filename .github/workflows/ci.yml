  ios-native-build:
    name: iOS Native Build
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - name: Record selected Xcode and simulator SDK
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun --sdk iphonesimulator --show-sdk-version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm nx run trinity-ios:verify
      - name: Compile unsigned simulator host from verified renderer
        id: ios
        run: |
          mkdir -p dist/ios-native
          echo 'started=true' >> "$GITHUB_OUTPUT"
          set -o pipefail
          pnpm nx run trinity-ios:build-prebuilt 2>&1 | tee dist/ios-native/xcodebuild.log
      - name: Retain Xcode diagnostics
        if: ${{ !cancelled() && steps.ios.outputs.started == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            dist/ios-native/xcodebuild.log
            dist/ios-native/run.*/build.xcresult/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify iOS left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  scheduled-e2e:
    name: Scheduled E2E
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit
      # The typed registry is the source of truth for this tier. Its strict
      # preflight fails before starting any suite when a required host is absent.
      - id: scheduled
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 6600000 -- pnpm e2e:scheduled
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.scheduled.outputs.started == 'true' }}
        with:
          surface: scheduled
          report-path: dist/.playwright/**/**

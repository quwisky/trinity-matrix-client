name: CI

on:
  schedule:
    # Registry-classified scheduled E2E only; local-only suites are deliberately
    # absent from this workflow and pull-request suites keep their existing jobs.
    - cron: '23 3 * * 0'
  push:
    # renovate/patch-** is load-bearing, not housekeeping. Patch updates are automerged as
    # a branch with no pull request (.github/renovate.json), so the `pull_request` trigger
    # below — which is what gives every other branch its CI — never fires for them. Without
    # this line those branches carry no status checks at all, Renovate refuses to merge an
    # untested branch, and after its 24h pending window it opens a PR instead: the automerge
    # rule stops working quietly rather than failing. Renovate pushes with a GitHub App
    # token, which does trigger workflows; the default GITHUB_TOKEN would not (renovate.yml).
    #
    # Matched on the patch- prefix, NOT on renovate/** — the pattern has to select exactly
    # the branches that never get a PR. Every other Renovate branch does get one, and would
    # otherwise run all five jobs twice per rebase: once here, once for the pull request.
    branches: [develop, master, 'renovate/patch-**']
  pull_request:

# A newer push to the same branch makes the run in flight obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: classify
        run: node scripts/ci-classify.mjs

  docs-gate:
    name: Documentation contracts
    needs: classify
    if: needs.classify.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm nx test scripts

  # E2E tier contract: pull-request suites run in the existing host/browser jobs,
  # scheduled suites run only in scheduled-e2e, and local-only suites never run here.
  # Everything that reads the code without running it. Grouped because each part is
  # seconds long; split only if one starts dominating.
  quality:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Deliberately separate from `pnpm lint` in this repo — it is not part of it.
      - run: pnpm stylelint
      # `format:check` verifies and exits non-zero on drift, where `pnpm format` fixes.
      - run: pnpm format:check

  test:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Specs are excluded from every project's tsconfig.json AND from the type-aware
      # ESLint block, and Vitest transpiles them without checking — so before this step
      # existed nothing in CI ever ran the compiler over a single test file. Runs BEFORE
      # `pnpm test`: a spec whose mock has drifted out of shape with the code it doubles
      # should fail as the type error it is, not as a downstream assertion nobody can
      # read.
      - run: pnpm exec nx run-many -t typecheck
      - run: pnpm test

  # Not redundant with `test`: the production build runs the AOT compiler, which rejects
  # things Vitest happily runs — template type errors, and the `lib: es2018` trap where
  # ES2019+ methods pass the unit tests and fail the build (docs/reference/stack.md).
  build:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  # electron/ is a separate package with its own lockfile and an explicit trinity-desktop
  # Nx application. The dedicated job additionally launches the real binary.
  desktop:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The binary download is NOT skipped any more, and that is the point of this job.
      # It used to be, on the reasoning that "nothing here launches Electron" — which was
      # true and was the problem: a two-major Chromium bump had no gate at all, and the
      # e2e suite that does launch Electron had silently rotted (it still toggled a CSS
      # class renamed months earlier, and its "crypto WASM loads" test never loaded any
      # WASM). ~100 MB, cached below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('electron/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm electron:install
      # Fetch it here rather than letting `electron:e2e` trip the package's lazy download
      # mid-run: this is the step that populates the cache above, and a wedged @electron/get
      # should fail as itself, not as a Playwright launch timeout.
      - run: pnpm electron:compile
      # `compile` type-checks the main-process sources only — electron/tsconfig.json
      # excludes `src/**/*.spec.ts`. This is the same gate for the specs (see
      # electron/tsconfig.spec.json for why it differs on module resolution).
      - run: pnpm electron:typecheck
      - run: pnpm electron:test
      # Launches the real binary and serves www/ over trinity://app. `electron:e2e` runs
      # the Nx-owned `trinity-desktop:build` first (Angular www/ + main-process tsc), which this job needs
      # and no other job hands it. `xvfb-run` is required — Electron needs an X server
      # even headless. This is the only gate in the repo that exercises the custom
      # privileged scheme, WASM stream-instantiation, the sandbox posture and safeStorage.
      - id: electron
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- xvfb-run -a pnpm electron:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.electron.outputs.started == 'true' }}
        with:
          surface: electron
          report-path: dist/.playwright/trinity-e2e-electron/*/electron.full/**

  # The app journeys, driven against a disposable Synapse + Caddy stack in Docker.
  e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E (Playwright + Synapse)
    runs-on: ubuntu-latest
    # 110 canonical browser specs, each doing a cold UI login (Rust-crypto init + first
    # /sync), at workers: 2 with one diagnostic retry — plus browser installation, three Docker image
    # pulls and a full development build. The measured critical path is 8-11 minutes
    # (docs/contributing/testing.md); the 75-minute ceiling is hang containment, not an
    # expected duration. Keep this count synchronized with the executable E2E registry.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-playwright
        with:
          install: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Separate from the Synapse suite: this builds and serves the component Storybook, then
      # verifies its palette × mode canvas and focused text contrast in the installed browser.
      - id: storybook
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-components:storybook
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.storybook.outputs.started == 'true' }}
        with:
          surface: storybook
          report-path: dist/.playwright/trinity-e2e-components/*/components.storybook/**

      # Real production UI semantics, contrast and geometry across the canonical viewport matrix.
      # Review screenshots are PR uploads, never committed pixel baselines.
      - id: renderer
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-web:production-renderer
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.renderer.outputs.started == 'true' }}
        with:
          surface: renderer
          report-path: dist/.playwright/trinity-e2e-web/*/web.production-renderer/**

      # Separate from the Synapse suite: this serves the already-built app and checks CSS
      # capability queries in desktop and real mobile-device browser profiles.
      - id: styling
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm exec nx run trinity-e2e-components:styling
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.styling.outputs.started == 'true' }}
        with:
          surface: styling
          report-path: dist/.playwright/trinity-e2e-components/*/components.styling/**

      # No env var needed to make this strict: the harness's graceful "Docker is missing,
      # skip the authenticated specs" fallback turns itself off whenever CI is set, so a
      # runner that cannot reach Docker Hub fails here instead of reporting a green E2E
      # job that tested almost nothing. See e2e/playwright/support/global-setup.mts.
      - id: browser
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.browser.outputs.started == 'true' }}
        with:
          surface: browser
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**

      # The QR protocol harness owns the same fixed Synapse stack, so run it only after
      # the main suite has completed and torn its stack down. Its synthetic camera feeds
      # a real SDK payload through production rendering, decoding and reciprocation.
      - id: qr
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm e2e:verify:qr
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.qr.outputs.started == 'true' }}
        with:
          surface: qr
          report-path: dist/.playwright/trinity-e2e-protocol/*/protocol.verify-qr/**

  # A separate job because it boots an API 36 emulator and drives the installed
  # Capacitor WebView. Browser E2E cannot substitute for native Back, process
  # relaunch, Android TLS policy, or the packaged application itself.
  android-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Android E2E (Capacitor WebView, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright/android-*
          key: android-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: android-playwright-${{ runner.os }}-

      - name: Grant emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm -a -w /dev/kvm

      - id: android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trinity_api_36_ci
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo 'started=true' >> "$GITHUB_OUTPUT"
            TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 2700000 -- pnpm e2e:android -- --fail-on-flaky-tests --shard=${{ matrix.shard }}/4

      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.android.outputs.started == 'true' }}
        with:
          surface: android
          shard: ${{ matrix.shard }}
          report-path: dist/.playwright/trinity-e2e-android/*/android.installed-webview/**

      - name: Verify Android E2E left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  scheduled-e2e:
    name: Scheduled E2E
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit
      # The typed registry is the source of truth for this tier. Its strict
      # preflight fails before starting any suite when a required host is absent.
      - id: scheduled
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 6600000 -- pnpm e2e:scheduled
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.scheduled.outputs.started == 'true' }}
        with:
          surface: scheduled
          report-path: dist/.playwright/**/**

name: CI

on:
  schedule:
    # Registry-classified scheduled E2E only; local-only suites are deliberately
    # absent from this workflow and pull-request suites keep their existing jobs.
    - cron: '23 3 * * 0'
  push:
    # renovate/patch-** is load-bearing, not housekeeping. Patch updates are automerged as
    # a branch with no pull request (.github/renovate.json), so the `pull_request` trigger
    # below — which is what gives every other branch its CI — never fires for them. Without
    # this line those branches carry no status checks at all, Renovate refuses to merge an
    # untested branch, and after its 24h pending window it opens a PR instead: the automerge
    # rule stops working quietly rather than failing. Renovate pushes with a GitHub App
    # token, which does trigger workflows; the default GITHUB_TOKEN would not (renovate.yml).
    #
    # Matched on the patch- prefix, NOT on renovate/** — the pattern has to select exactly
    # the branches that never get a PR. Every other Renovate branch does get one, and would
    # otherwise run all five jobs twice per rebase: once here, once for the pull request.
    branches: [develop, master, 'renovate/patch-**']
  pull_request:

# A newer push to the same branch makes the run in flight obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: classify
        run: node scripts/ci-classify.mjs

  docs-gate:
    name: Documentation site
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: pnpm format:check
      - run: pnpm nx test scripts
      - run: pnpm nx test docs-site
      - run: pnpm nx run docs-site:check
      - run: pnpm nx run docs-site:assemble
      - run: pnpm nx run docs-site:e2e

  # E2E tier contract: pull-request suites run in the existing host/browser jobs,
  # scheduled suites run only in scheduled-e2e, and local-only suites never run here.
  # Everything that reads the code without running it. Grouped because each part is
  # seconds long; split only if one starts dominating.
  quality:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Deliberately separate from `pnpm lint` in this repo — it is not part of it.
      - run: pnpm stylelint
      # `format:check` verifies and exits non-zero on drift, where `pnpm format` fixes.
      - run: pnpm format:check

  test:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Specs are excluded from every project's tsconfig.json AND from the type-aware
      # ESLint block, and Vitest transpiles them without checking — so before this step
      # existed nothing in CI ever ran the compiler over a single test file. Runs BEFORE
      # `pnpm test`: a spec whose mock has drifted out of shape with the code it doubles
      # should fail as the type error it is, not as a downstream assertion nobody can
      # read.
      - run: pnpm exec nx run-many -t typecheck
      - run: pnpm test

  # The production AOT build remains independent of unit/type checks.
  renderer:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Web build
    uses: ./.github/workflows/_renderer.yml
    permissions:
      contents: read
    with:
      sha: ${{ github.sha }}
      artifact-name: renderer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      retention-days: 30

  # electron/ is a separate package with its own lockfile and an explicit trinity-desktop
  # Nx application. The dedicated job additionally launches the real binary.
  desktop:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - name: Install pinned Node runner prerequisites
        run: node scripts/ci-runner-prerequisites.mjs electron
      # The binary download is NOT skipped any more, and that is the point of this job.
      # It used to be, on the reasoning that "nothing here launches Electron" — which was
      # true and was the problem: a two-major Chromium bump had no gate at all, and the
      # e2e suite that does launch Electron had silently rotted (it still toggled a CSS
      # class renamed months earlier, and its "crypto WASM loads" test never loaded any
      # WASM). ~100 MB, cached below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('electron/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm electron:install
      # Fetch it here rather than letting `electron:e2e` trip the package's lazy download
      # mid-run: this is the step that populates the cache above, and a wedged @electron/get
      # should fail as itself, not as a Playwright launch timeout.
      - run: pnpm electron:compile
      # `compile` type-checks the main-process sources only — electron/tsconfig.json
      # excludes `src/**/*.spec.ts`. This is the same gate for the specs (see
      # electron/tsconfig.spec.json for why it differs on module resolution).
      - run: pnpm electron:typecheck
      - run: pnpm electron:test
      # Launch the host built from the verified renderer without another Angular build.
      - id: electron
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- xvfb-run -a pnpm nx run trinity-e2e-electron:full-prebuilt
      - id: electron-runner-smoke
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- xvfb-run -a pnpm nx run trinity-e2e-electron:runner-smoke
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.electron.outputs.started == 'true' }}
        with:
          surface: electron
          report-path: dist/.playwright/trinity-e2e-electron/*/electron.full/**
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.electron-runner-smoke.outputs.started == 'true' }}
        with:
          surface: electron-runner-smoke
          report-path: dist/.playwright/trinity-e2e-electron/*/runner.electron/**

      # The app journeys, driven against a disposable Synapse + Caddy stack in Docker.
      - name: Verify Desktop left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: E2E (Playwright + Synapse)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # 110 canonical browser specs, each doing a cold UI login (Rust-crypto init + first
    # /sync), at workers: 2 with one diagnostic retry — plus browser installation, three Docker image
    # pulls and a full development build. The measured critical path is 8-11 minutes
    # (developer testing guide); the 75-minute ceiling is hang containment, not an
    # expected duration. Keep this count synchronized with the executable E2E registry.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-playwright
        with:
          install: 'false'
      - name: Install pinned Chromium runner prerequisites
        run: node scripts/ci-runner-prerequisites.mjs chromium
      - name: Prepare e2e prerequisites
        id: prerequisites
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Separate from the Synapse suite: this builds and serves the component Storybook, then
      # verifies its palette × mode canvas and focused text contrast in the installed browser.
      # The full 163-test matrix reached 157 passes at 10 minutes on a standard runner.
      # Allow the remaining tests and teardown to finish; retain a finite command deadline.
      - id: storybook
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 900000 -- pnpm exec nx run trinity-e2e-components:storybook
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.storybook.outputs.started == 'true' }}
        with:
          surface: storybook
          report-path: dist/.playwright/trinity-e2e-components/*/components.storybook/**

      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download

      # Real production UI semantics, contrast and geometry across the canonical viewport matrix.
      # Review screenshots are PR uploads, never committed pixel baselines.
      - id: renderer
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-web:production-renderer
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.renderer.outputs.started == 'true' }}
        with:
          surface: renderer
          report-path: dist/.playwright/trinity-e2e-web/*/web.production-renderer/**

      # Separate from the Synapse suite: this serves the already-built app and checks CSS
      # capability queries in desktop and real mobile-device browser profiles.
      - id: styling
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm exec nx run trinity-e2e-components:styling
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.styling.outputs.started == 'true' }}
        with:
          surface: styling
          report-path: dist/.playwright/trinity-e2e-components/*/components.styling/**

      # No env var needed to make this strict: the harness's graceful "Docker is missing,
      # skip the authenticated specs" fallback turns itself off whenever CI is set, so a
      # runner that cannot reach Docker Hub fails here instead of reporting a green E2E
      # job that tested almost nothing. See e2e/playwright/support/global-setup.mts.
      - id: browser
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - id: chromium-runner-smoke
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:runner-smoke
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.browser.outputs.started == 'true' }}
        with:
          surface: browser
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.chromium-runner-smoke.outputs.started == 'true' }}
        with:
          surface: chromium-runner-smoke
          report-path: dist/.playwright/trinity-e2e-browser/*/runner.chromium/**

      # The QR protocol harness owns the same fixed Synapse stack, so run it only after
      # the main suite has completed and torn its stack down. Its synthetic camera feeds
      # a real SDK payload through production rendering, decoding and reciprocation.
      - id: qr
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm e2e:verify:qr
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.qr.outputs.started == 'true' }}
        with:
          surface: qr
          report-path: dist/.playwright/trinity-e2e-protocol/*/protocol.verify-qr/**

  # A separate job because it boots an API 36 emulator and drives the installed
  # Capacitor WebView. Browser E2E cannot substitute for native Back, process
  # relaunch, Android TLS policy, or the packaged application itself.
  android-e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Android E2E (Capacitor WebView, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Six shards keep every emulator session under four hours. Run 36064938227
    # showed four could not: shard 2 queued about 263 native minutes, its
    # emulator stopped answering adb after 3h15m, and shard 4 hit its 180-minute
    # limit inside retained Playwright. Budgets use the slowest native target
    # durations observed across the ten preceding runs, a 45-minute retained
    # Playwright command budget and 15 minutes for setup/diagnostics:
    # shard 1 about 113 native minutes, shard 2 about 117, shard 3 about 158
    # (240), shard 4 about 165 (240), shard 5 about 110 and shard 6 about 118.
    # Shard 4's figure adds a provisional 30-40 minutes for message-links,
    # shard 5's a provisional 15-20 minutes for message-markdown, and shard
    # 1's a provisional 6-8 minutes for message-poll.
    # Shard 6's figure adds a provisional 12 minutes for message-quote.
    timeout-minutes: ${{ matrix.shard == 3 && 240 || matrix.shard == 4 && 240 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup
      - name: Install pinned Maestro prerequisite
        run: node scripts/ci-runner-prerequisites.mjs maestro
      - name: Install pinned Chrome fixture prerequisite
        if: ${{ matrix.shard == 5 }}
        run: node scripts/ci-runner-prerequisites.mjs chromium
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright/android-*
          key: android-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: android-playwright-${{ runner.os }}-

      - name: Grant emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm -a -w /dev/kvm

      - id: android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trinity_api_36_ci
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            echo 'smoke-started=true' >> "$GITHUB_OUTPUT"
            TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:runner-smoke
            if [ "${{ matrix.shard }}" = "4" ]; then echo 'recovery-reset-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 3000000 -- pnpm exec nx run trinity-e2e-android:recovery-reset; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'critical-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:critical-journeys; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'sidebar-filter-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:sidebar-filter; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'sidebar-touch-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:sidebar-touch; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'room-tags-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:room-tags; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'room-read-state-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:room-read-state; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'room-list-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:room-list; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'unread-badges-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:unread-badges; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'leave-room-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:leave-room; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'recent-activity-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:recent-activity; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'room-filter-spaceless-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:room-filter-spaceless; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'space-curation-create-join-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:space-curation-create-join; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'space-room-order-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:space-room-order; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'room-http-error-recovery-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:room-http-error-recovery; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'message-linkify-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-android:message-linkify; fi
            if [ "${{ matrix.shard }}" = "1" ]; then echo 'message-poll-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1500000 -- pnpm exec nx run trinity-e2e-android:message-poll; fi
            if [ "${{ matrix.shard }}" = "2" ]; then echo 'edit-history-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 2700000 -- pnpm nx run trinity-e2e-android:edit-history; fi
            if [ "${{ matrix.shard }}" = "2" ]; then echo 'message-forward-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1500000 -- pnpm nx run trinity-e2e-android:message-forward; fi
            if [ "${{ matrix.shard }}" = "2" ]; then echo 'message-grouping-started=true' >> "$GITHUB_OUTPUT"; TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 1500000 -- pnpm nx run trinity-e2e-android:message-grouping; fi

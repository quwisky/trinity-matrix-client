name: CI
on:
  schedule:
    - cron: '23 3 * * 0'
  push:
    branches: [develop, master, 'renovate/patch-**']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  classify:
    name: Classify changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - id: classify
        run: node scripts/ci-classify.mjs
  docs-gate:
    name: Documentation contracts
    needs: classify
    if: needs.classify.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm nx test scripts
  quality:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm stylelint
      - run: pnpm format:check
  unit-and-types:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Unit tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec nx run-many -t typecheck
      - run: pnpm test
  renderer:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Web build
    uses: ./.github/workflows/_renderer.yml
    permissions: { contents: read }
    with:
      sha: ${{ github.sha }}
      artifact-name: renderer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      retention-days: 30
  component-storybook-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E components storybook
    uses: ./.github/workflows/_e2e-suite.yml
    permissions: { contents: read, actions: read }
    with:
      sha: ${{ github.sha }}
      suite-id: components.storybook
      diagnostics-artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-components-storybook-linux-all
      retention-days: 7
  component-styling-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E components styling
    uses: ./.github/workflows/_e2e-suite.yml
    permissions: { contents: read, actions: read }
    with:
      sha: ${{ github.sha }}
      suite-id: components.styling
      diagnostics-artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-components-styling-linux-all
      retention-days: 7
  browser-synapse-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E browser canonical
    uses: ./.github/workflows/_e2e-suite.yml
    permissions: { contents: read, actions: read }
    with:
      sha: ${{ github.sha }}
      suite-id: browser.canonical
      diagnostics-artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-browser-canonical-linux-all
      retention-days: 7
  qr-protocol-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E QR protocol
    uses: ./.github/workflows/_e2e-suite.yml
    permissions: { contents: read, actions: read }
    with:
      sha: ${{ github.sha }}
      suite-id: protocol.verify-qr
      diagnostics-artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-protocol-verify-qr-linux-all
      retention-days: 7
  production-renderer-e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: E2E production renderer
    uses: ./.github/workflows/_e2e-suite.yml
    permissions: { contents: read, actions: read }
    with:
      sha: ${{ needs.renderer.outputs.sha }}
      suite-id: web.production-renderer
      source-run-id: ${{ github.run_id }}
      artifact-id: ${{ needs.renderer.outputs.artifact-id }}
      artifact-name: ${{ needs.renderer.outputs.artifact-name }}
      manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
      diagnostics-artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-web-production-renderer-linux-all
      retention-days: 7
  web-container:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Web container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - id: container
        env:
          CI_E2E_SUITE: web.container
          CI_E2E_SHA: ${{ needs.renderer.outputs.sha }}
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1800000 -- pnpm nx run trinity-web-container:smoke
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.container.outputs.started == 'true' }}
        with:
          surface: web.container
          shard: all
          report-path: dist/.playwright/trinity-e2e-web/*/web.container/**
          artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-web-container-linux-all
          retention-days: 7
      - if: ${{ !cancelled() }}
        run: git diff --exit-code
  desktop-e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('electron/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm electron:install
      - run: pnpm electron:compile
      - run: pnpm electron:typecheck
      - run: pnpm electron:test
      - id: electron
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- xvfb-run -a pnpm nx run trinity-e2e-electron:full-prebuilt
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.electron.outputs.started == 'true' }}
        with:
          surface: electron
          shard: all
          report-path: dist/.playwright/trinity-e2e-electron/*/electron.full/**
          artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-electron-linux-all
          retention-days: 7
      - if: ${{ !cancelled() }}
        run: git diff --exit-code
  android-e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Android E2E (Capacitor WebView, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    timeout-minutes: 75
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3, 4] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '21' }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright/android-*
          key: android-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: android-playwright-${{ runner.os }}-
      - name: Grant emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm -a -w /dev/kvm
      - id: android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trinity_api_36_ci
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo 'started=true' >> "$GITHUB_OUTPUT"
            TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 2700000 -- pnpm e2e:android -- --fail-on-flaky-tests --shard=${{ matrix.shard }}/4
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.android.outputs.started == 'true' }}
        with:
          surface: android
          shard: ${{ matrix.shard }}
          report-path: dist/.playwright/trinity-e2e-android/*/android.installed-webview/**
          artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-android-linux-shard-${{ matrix.shard }}
          retention-days: 7
      - if: ${{ !cancelled() }}
        run: git diff --exit-code
  ios-native-build:
    name: iOS Native Build
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    runs-on: macos-26
    # Step budgets total 50 minutes, leaving five minutes for action post-steps.
    timeout-minutes: 55
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - uses: ./.github/actions/restore-verified-renderer
        timeout-minutes: 3
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - name: Record selected Xcode and simulator SDK
        timeout-minutes: 1
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun --sdk iphonesimulator --show-sdk-version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm nx run trinity-ios:verify
        timeout-minutes: 2
      - name: Compile unsigned simulator host from verified renderer
        timeout-minutes: 27
        id: ios
        env:
          CI_IOS_SHA: ${{ needs.renderer.outputs.sha }}
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1500000 -- pnpm nx run trinity-ios:build-prebuilt
      - name: Probe 582 remove iOS evidence after a successful compile
        timeout-minutes: 1
        env:
          CI_IOS_DIAGNOSTICS_ROOT: ${{ steps.ios.outputs.diagnostic-root }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { renameSync, rmSync, writeFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.CI_IOS_DIAGNOSTICS_ROOT;
          const results = [];
          const check = (label, expected) => {
            const result = spawnSync(process.execPath, ['scripts/ios-native-build.mjs', 'validate-diagnostics'], { env: process.env, encoding: 'utf8' });
            const output = `${result.stdout}${result.stderr}`;
            console.log(`probe-582: ${label}, exit=${result.status}\n${output}`);
            results.push({ label, exitCode: result.status, output });
            if (expected ? result.status !== 1 || !output.includes(expected) : result.status !== 0) throw new Error(`Unexpected diagnostic outcome for ${label}`);
          };
          check('complete native build', null);
          for (const [file, label] of [['build-settings.json', 'settings'], ['build.xcresult', 'result']]) {
            const path = join(root, file);
            renameSync(path, `${path}.probe-backup`);
            try { check(`missing ${label}`, `missing iOS diagnostic: ${label}`); }
            finally { renameSync(`${path}.probe-backup`, path); }
          }
          mkdirSync('dist/.ci', { recursive: true });
          writeFileSync('dist/.ci/probe-582-ios-evidence.json', JSON.stringify(results, null, 2));
          rmSync(join(root, 'build-settings.json'));
          rmSync(join(root, 'build.xcresult'), { recursive: true });
          JS
      - name: Validate iOS diagnostics
        timeout-minutes: 1
        if: ${{ !cancelled() && steps.ios.outputs.started == 'true' }}
        env:
          CI_IOS_DIAGNOSTICS_ROOT: ${{ steps.ios.outputs.diagnostic-root }}
        run: node scripts/ios-native-build.mjs validate-diagnostics
      - name: Retain Xcode diagnostics
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.ios.outputs.started == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-macos-all
          path: |
            ${{ steps.ios.outputs.diagnostic-root }}/toolchain.txt
            ${{ steps.ios.outputs.diagnostic-root }}/build-settings.json
            ${{ steps.ios.outputs.diagnostic-root }}/xcodebuild.log
            ${{ steps.ios.outputs.diagnostic-root }}/execution.json
            ${{ steps.ios.outputs.diagnostic-root }}/build.xcresult/**
            dist/.ci/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: git diff --exit-code
  required:
    name: Required
    needs:
      [
        classify,
        docs-gate,
        quality,
        unit-and-types,
        renderer,
        component-storybook-e2e,
        component-styling-e2e,
        browser-synapse-e2e,
        qr-protocol-e2e,
        production-renderer-e2e,
        web-container,
        desktop-e2e,
        android-e2e,
        ios-native-build,
      ]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - name: Evaluate required results
        env:
          CI_CLASSIFICATION_JSON: ${{ needs.classify.outputs.classification }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-required-result.mjs
  scheduled-e2e:
    name: Scheduled E2E
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with: { browsers: chromium firefox webkit }
      - id: scheduled
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 6600000 -- pnpm e2e:scheduled
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.scheduled.outputs.started == 'true' }}
        with:
          surface: scheduled
          shard: all
          report-path: dist/.playwright/**/**
          artifact-name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-scheduled-linux-all
          retention-days: 7

name: CI

on:
  push:
    # renovate/patch-** is load-bearing, not housekeeping. Patch updates are automerged as
    # a branch with no pull request (.github/renovate.json), so the `pull_request` trigger
    # below — which is what gives every other branch its CI — never fires for them. Without
    # this line those branches carry no status checks at all, Renovate refuses to merge an
    # untested branch, and after its 24h pending window it opens a PR instead: the automerge
    # rule stops working quietly rather than failing. Renovate pushes with a GitHub App
    # token, which does trigger workflows; the default GITHUB_TOKEN would not (renovate.yml).
    #
    # Matched on the patch- prefix, NOT on renovate/** — the pattern has to select exactly
    # the branches that never get a PR. Every other Renovate branch does get one, and would
    # otherwise run all five jobs twice per rebase: once here, once for the pull request.
    branches: [develop, master, 'renovate/patch-**']
  pull_request:
    # Documentation-only pull requests skip CI. The filter lives here and not on `push`
    # because a feature branch never matches the push branch list above — `pull_request` is
    # the only trigger it gets, and GitHub ignores `[skip ci]` markers for that event, so a
    # commit-message convention cannot do this job.
    #
    # GitHub evaluates these against the PR's whole diff, not one push, so a branch that
    # touches code AND docs still runs everything. Only an entirely-documentation PR is
    # skipped. Safe today because `develop` has no required status checks; if branch
    # protection is ever turned on, a skipped run reports nothing and would block the merge.
    #
    # `docs/reference/stack.md` is deliberately absent: scripts/stack-versions.spec.mjs
    # parses its version table and asserts every row against node_modules, so editing it
    # really can fail `pnpm test`. The rest of docs/reference is listed file by file rather
    # than as `docs/reference/**` for the same reason — a new page there runs CI until
    # someone decides otherwise, which is the safe direction to fail.
    paths-ignore:
      - 'docs/index.md'
      - 'docs/users/**'
      - 'docs/contributing/**'
      - 'docs/architecture/**'
      - 'docs/platforms/**'
      - 'docs/reference/push-notifications.md'
      - 'docs/reference/troubleshooting.md'

# A newer push to the same branch makes the run in flight obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that reads the code without running it. Grouped because each part is
  # seconds long; split only if one starts dominating.
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Deliberately separate from `pnpm lint` in this repo — it is not part of it.
      - run: pnpm stylelint
      # `format:check` verifies and exits non-zero on drift, where `pnpm format` fixes.
      - run: pnpm format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Specs are excluded from every project's tsconfig.json AND from the type-aware
      # ESLint block, and Vitest transpiles them without checking — so before this step
      # existed nothing in CI ever ran the compiler over a single test file. Runs BEFORE
      # `pnpm test`: a spec whose mock has drifted out of shape with the code it doubles
      # should fail as the type error it is, not as a downstream assertion nobody can
      # read.
      - run: pnpm exec nx run-many -t typecheck
      - run: pnpm test

  # Not redundant with `test`: the production build runs the AOT compiler, which rejects
  # things Vitest happily runs — template type errors, and the `lib: es2018` trap where
  # ES2019+ methods pass the unit tests and fail the build (docs/reference/stack.md).
  build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  # electron/ is a separate package with its own lockfile and an explicit trinity-desktop
  # Nx application. The dedicated job additionally launches the real binary.
  desktop:
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The binary download is NOT skipped any more, and that is the point of this job.
      # It used to be, on the reasoning that "nothing here launches Electron" — which was
      # true and was the problem: a two-major Chromium bump had no gate at all, and the
      # e2e suite that does launch Electron had silently rotted (it still toggled a CSS
      # class renamed months earlier, and its "crypto WASM loads" test never loaded any
      # WASM). ~100 MB, cached below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('electron/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm electron:install
      # Fetch it here rather than letting `electron:e2e` trip the package's lazy download
      # mid-run: this is the step that populates the cache above, and a wedged @electron/get
      # should fail as itself, not as a Playwright launch timeout.
      - run: pnpm electron:compile
      # `compile` type-checks the main-process sources only — electron/tsconfig.json
      # excludes `src/**/*.spec.ts`. This is the same gate for the specs (see
      # electron/tsconfig.spec.json for why it differs on module resolution).
      - run: pnpm electron:typecheck
      - run: pnpm electron:test
      # Launches the real binary and serves www/ over trinity://app. `electron:e2e` runs
      # the Nx-owned `trinity-desktop:build` first (Angular www/ + main-process tsc), which this job needs
      # and no other job hands it. `xvfb-run` is required — Electron needs an X server
      # even headless. This is the only gate in the repo that exercises the custom
      # privileged scheme, WASM stream-instantiation, the sandbox posture and safeStorage.
      - run: xvfb-run -a pnpm electron:e2e

  # The app journeys, driven against a disposable Synapse + Caddy stack in Docker.
  e2e:
    name: E2E (Playwright + Synapse)
    runs-on: ubuntu-latest
    # 110 canonical browser specs, each doing a cold UI login (Rust-crypto init + first
    # /sync), at workers: 2 with retries: 2 — plus browser installation, three Docker image
    # pulls and a full development build. The measured critical path is 8-11 minutes
    # (docs/contributing/testing.md); the 60-minute ceiling is hang containment, not an
    # expected duration. Keep this count synchronized with the executable E2E registry.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Browsers are cached. `--with-deps` still runs (it apt-installs the shared
      # libraries Chromium and WebKit need, which no cache covers) but the download is skipped
      # on a hit. The restore-keys prefix matters: without it, any dependency change at
      # all re-downloads Chromium on the one job with the longest budget.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      # Three independent legs that would otherwise run strictly one after another:
      # Playwright orders webServer (the dev build) BEFORE globalSetup (the Synapse
      # boot), and the browser install is its own step ahead of both. Overlapping them
      # is the only real saving available on this job — roughly 25-45s of an 8-11min
      # critical path. The pre-build is not duplicated work: the suite's own webServer
      # replays it from the in-job Nx cache (measured 0.97s on the second invocation).
      - name: Prepare e2e prerequisites
        run: |
          pnpm exec playwright install --with-deps chromium webkit >/tmp/pw.log 2>&1 &
          pw=$!
          docker compose -f e2e/synapse/docker-compose.yml pull -q >/tmp/pull.log 2>&1 &
          dk=$!
          pnpm exec nx run trinity:build:development
          # Per-pid, deliberately: `wait $pw $dk` returns only the LAST pid's status, so a
          # failed browser install would be swallowed and the job would then burn its
          # 60-minute budget on 104 specs x 3 attempts of "Executable doesn't exist".
          wait "$pw"; pw_rc=$?
          wait "$dk"; dk_rc=$?
          echo '--- playwright install ---'; cat /tmp/pw.log
          echo '--- docker pull ---';        cat /tmp/pull.log
          # The browser install is fatal; the pre-pull is not. `compose up` in global setup
          # pulls anything missing anyway, so a Hub rate-limit blip stays self-healing
          # instead of becoming a hard job failure.
          [ "$dk_rc" -eq 0 ] || echo "::warning::docker pre-pull failed (rc=$dk_rc); global setup will pull"
          exit "$pw_rc"

      # Separate from the Synapse suite: this builds and serves the component Storybook, then
      # verifies its palette × mode canvas and focused text contrast in the installed browser.
      - run: pnpm exec nx run trinity-e2e-components:storybook

      # Real production UI semantics, contrast and geometry across the canonical viewport matrix.
      # Review screenshots are PR uploads, never committed pixel baselines.
      - run: pnpm exec nx run trinity-e2e-web:production-renderer

      # Separate from the Synapse suite: this serves the already-built app and checks CSS
      # capability queries in desktop and real mobile-device browser profiles.
      - run: pnpm exec nx run trinity-e2e-components:styling

      # No env var needed to make this strict: the harness's graceful "Docker is missing,
      # skip the authenticated specs" fallback turns itself off whenever CI is set, so a
      # runner that cannot reach Docker Hub fails here instead of reporting a green E2E
      # job that tested almost nothing. See e2e/playwright/support/global-setup.mts.
      - run: pnpm exec nx run trinity-e2e-browser:e2e

      # The QR protocol harness owns the same fixed Synapse stack, so run it only after
      # the main suite has completed and torn its stack down. Its synthetic camera feeds
      # a real SDK payload through production rendering, decoding and reciprocation.
      - run: pnpm e2e:verify:qr

      # always(), not failure(): `timeout-minutes` CANCELS the job, and failure() does not
      # fire on a cancellation — so the run most in need of a trace would upload nothing.
      # A superseded run is cancelled too, but concurrency already discards those.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          # Each lifecycle config emits mergeable blob and JUnit reports plus raw output under
          # one project/run id, so a single recursive upload preserves the complete evidence.
          path: |
            dist/.playwright/trinity-e2e-browser/
            dist/.playwright/trinity-e2e-components/
            dist/.playwright/trinity-e2e-web/
          if-no-files-found: warn
          retention-days: 7
          # Artifacts are immutable per run, so without this a re-run of a failed job
          # dies with "409 Conflict: an artifact with this name already exists".
          overwrite: true

  # A separate job because it boots an API 36 emulator and drives the installed
  # Capacitor WebView. Browser E2E cannot substitute for native Back, process
  # relaunch, Android TLS policy, or the packaged application itself.
  android-e2e:
    name: Android E2E (Capacitor WebView, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ms-playwright/android-*
          key: android-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-e2e-${{ runner.os }}-

      - name: Grant emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trinity_api_36_ci
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" pnpm e2e:android -- --fail-on-flaky-tests --shard=${{ matrix.shard }}/4

      - name: Verify Android E2E left the worktree unchanged
        if: always()
        run: git diff --exit-code

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-playwright-report-${{ matrix.shard }}
          path: dist/.playwright/android/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

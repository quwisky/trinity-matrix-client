name: CI

on:
  schedule:
    # Registry-classified scheduled E2E only; local-only suites are deliberately
    # absent from this workflow and pull-request suites keep their existing jobs.
    - cron: '23 3 * * 0'
  push:
    # renovate/patch-** is load-bearing, not housekeeping. Patch updates are set to automerge
    # as a branch without a pull request (.github/renovate.json), so until one falls back to a
    # pull request the `pull_request` trigger below never fires for it. Without
    # this line those branches carry no status checks at all, Renovate refuses to merge an
    # untested branch, and after its 24h pending window it opens a PR instead: the automerge
    # rule stops working quietly rather than failing. Renovate pushes with a GitHub App
    # token, which does trigger workflows; the default GITHUB_TOKEN would not (renovate.yml).
    #
    # Matched on the patch- prefix, NOT on renovate/** — the pattern has to select exactly
    # the branches meant to merge without a PR. Every other Renovate branch does get one, and would
    # otherwise run all five jobs twice per rebase: once here, once for the pull request.
    branches: [main, 'release/**', 'renovate/patch-**']
  pull_request:

# A newer push to the same branch makes the run in flight obsolete. The weekly cron run reports
# to an issue and its ref is main too, so it gets its own group: a push must not cancel it, and
# a cancelled run would open a false "Nightly E2E failing" issue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: classify
        run: node scripts/ci-classify.mjs

  docs-gate:
    name: Documentation site
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: pnpm format:check
      - run: pnpm nx test scripts
      - run: pnpm nx test docs-site
      - run: pnpm nx run docs-site:check
      - run: pnpm nx run docs-site:assemble
      - id: docs-e2e
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          pnpm nx run docs-site:e2e
      # Not a registry suite, so not the registry-validated diagnostics action; same
      # artifact conventions. `.playwright` is a dot-directory, hence the hidden files.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.docs-e2e.outputs.started == 'true' }}
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}-docs-site
          path: |
            dist/.playwright/docs-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # E2E tier contract: pull-request suites run in the existing host/browser jobs,
  # scheduled suites run only in scheduled-e2e, and local-only suites never run here.
  # Everything that reads the code without running it. Grouped because each part is
  # seconds long; split only if one starts dominating.
  quality:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Deliberately separate from `pnpm lint` in this repo — it is not part of it.
      - run: pnpm stylelint
      # `format:check` verifies and exits non-zero on drift, where `pnpm format` fixes.
      - run: pnpm format:check
      # Specs are excluded from every project's tsconfig.json AND from the type-aware
      # ESLint block, and Vitest transpiles them without checking — so this is the only CI
      # step that runs the compiler over test files. It checks every project here, in the
      # job with spare time, so `Unit tests` can skip projects a pull request leaves alone.
      - if: ${{ !cancelled() }}
        run: pnpm exec nx run-many -t typecheck

  test:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Pull requests test only the projects their diff affects, by the Nx project graph
      # against the PR base. Any root-level file or anything under .github/ runs every
      # project: Nx maps files such as .nvmrc or the setup action to no project. Pushes to
      # main, release/** and renovate/patch-** always run every project.
      - id: unit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            pnpm test
          elif git -c core.quotePath=false diff --no-renames --name-only "$BASE...HEAD" | grep -E '^[^/]+$|^\.github/' > /dev/null; then
            echo 'Root-level or workflow files changed; testing every project.'
            pnpm test
          else
            pnpm nx affected -t test --base="$BASE" --head=HEAD
          fi

  # The production AOT build remains independent of unit/type checks.
  renderer:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Web build
    uses: ./.github/workflows/_renderer.yml
    permissions:
      contents: read
    with:
      sha: ${{ github.sha }}
      artifact-name: renderer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      retention-days: 30

  # electron/ is a separate package with its own lockfile and an explicit trinity-desktop
  # Nx application. The dedicated job additionally launches the real binary.
  desktop:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      # The binary download is NOT skipped any more, and that is the point of this job.
      # It used to be, on the reasoning that "nothing here launches Electron" — which was
      # true and was the problem: a two-major Chromium bump had no gate at all, and the
      # e2e suite that does launch Electron had silently rotted (it still toggled a CSS
      # class renamed months earlier, and its "crypto WASM loads" test never loaded any
      # WASM). ~100 MB, cached below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('electron/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm electron:install
      # Fetch it here rather than letting `electron:e2e` trip the package's lazy download
      # mid-run: this is the step that populates the cache above, and a wedged @electron/get
      # should fail as itself, not as a Playwright launch timeout.
      - run: pnpm electron:compile
      # `compile` type-checks the main-process sources only — electron/tsconfig.json
      # excludes `src/**/*.spec.ts`. This is the same gate for the specs (see
      # electron/tsconfig.spec.json for why it differs on module resolution).
      - run: pnpm electron:typecheck
      - run: pnpm electron:test
      # Launch the host built from the verified renderer without another Angular build.
      - id: electron
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- xvfb-run -a pnpm nx run trinity-e2e-electron:full-prebuilt
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.electron.outputs.started == 'true' }}
        with:
          surface: electron
          report-path: dist/.playwright/trinity-e2e-electron/*/electron.full/**

      # The app journeys, driven against a disposable homeserver (Tuwunel) + Caddy stack in Docker.
      - name: Verify Desktop left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  # The renderer-backed part of the E2E tier: it needs the verified production artifact,
  # so it still waits for `renderer`. The browser journeys and the Storybook check run in
  # their own jobs below, and `e2e-result` reports all three under the required check name.
  e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: E2E (renderer, styling, QR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Production renderer, styling and QR take about 3 minutes after setup; the ceiling is
    # hang containment, not an expected duration.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-playwright
        with:
          install: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download

      # Real production UI semantics, contrast and geometry across the canonical viewport matrix.
      # Review screenshots are PR uploads, never committed pixel baselines.
      - id: renderer
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-web:production-renderer
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.renderer.outputs.started == 'true' }}
        with:
          surface: renderer
          report-path: dist/.playwright/trinity-e2e-web/*/web.production-renderer/**

      # Separate from the homeserver suite: this serves the already-built app and checks CSS
      # capability queries in desktop and real mobile-device browser profiles.
      - id: styling
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm exec nx run trinity-e2e-components:styling
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.styling.outputs.started == 'true' }}
        with:
          surface: styling
          report-path: dist/.playwright/trinity-e2e-components/*/components.styling/**

      # No env var needed to make this strict: the harness's graceful "Docker is missing,
      # skip the authenticated specs" fallback turns itself off whenever CI is set, so a
      # runner that cannot reach Docker Hub fails here instead of reporting a green job.
      # The QR protocol harness is the only homeserver suite in this job. Its synthetic
      # camera feeds a real SDK payload through production rendering, decoding and
      # reciprocation.
      - id: qr
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm e2e:verify:qr
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.qr.outputs.started == 'true' }}
        with:
          surface: qr
          report-path: dist/.playwright/trinity-e2e-protocol/*/protocol.verify-qr/**

  # The app journeys, driven against a disposable homeserver (Tuwunel) + Caddy stack in
  # Docker, split into three Playwright shards. Each shard job starts its own homeserver,
  # so the per-homeserver worker cap in e2e/browser/playwright.config.mts holds per job.
  # The journeys use the development build, not the production renderer, so they start
  # without waiting for `renderer`.
  browser-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E browser journeys (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # 110 canonical browser specs, each doing a cold UI login (Rust-crypto init + first
    # /sync), at workers: 2 with one diagnostic retry, split across three jobs — plus
    # browser installation, three Docker image pulls and a full development build per job.
    # Keep this count synchronized with the executable E2E registry. The ceiling is hang
    # containment, not an expected duration.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The browser project is Chromium only: skip WebKit and the host libraries the
      # ubuntu image already provides for Chrome.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
          install: 'false'
          with-deps: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        env:
          TRINITY_PLAYWRIGHT_BROWSERS: chromium
          TRINITY_PLAYWRIGHT_WITH_DEPS: 'false'
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}-${{ matrix.shard }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The registry validator pins this command line, so the shard is an environment
      # variable read by the Playwright config rather than a --shard argument.
      - id: browser
        env:
          TRINITY_E2E_SHARD: ${{ matrix.shard }}/3
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.browser.outputs.started == 'true' }}
        with:
          surface: browser
          shard: ${{ matrix.shard }}
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**

  # Builds and serves the component Storybook, then verifies its palette × mode canvas and
  # focused text contrast in the installed browsers. It needs neither the renderer nor a
  # homeserver, so it starts as soon as `classify` finishes.
  storybook:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
      - id: storybook
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-components:storybook
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.storybook.outputs.started == 'true' }}
        with:
          surface: storybook
          report-path: dist/.playwright/trinity-e2e-components/*/components.storybook/**

  # Branch rules require the check "E2E (Playwright + homeserver)". The work behind it now
  # runs in several jobs, so this job reports under that name and succeeds only when every
  # one of them succeeded. A skipped job (for example after a renderer failure) fails it.
  e2e-result:
    needs: [classify, e2e, browser-e2e, storybook]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E (Playwright + homeserver)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every split job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # WebdriverIO + Appium on the installed app: it boots an API 36 emulator because browser
  # E2E cannot substitute for native Back, process relaunch, Android TLS policy, or the
  # packaged application itself. See e2e/README.md.
  #
  # Two jobs, each with its own emulator and homeserver, split the spec files by measured
  # duration (run 37659485183): navigation (~2:20) and deep-link (~1:30) are the slow ones
  # and sit in different shards, about 4:50 of specs each. Put a new spec in the lighter
  # shard; scripts/ci-workflow.spec.mjs fails while a spec file is in neither.
  mobile-e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Mobile E2E (Android ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            specs: >-
              ./specs/app-shell.e2e.mts,
              ./specs/appearance.e2e.mts,
              ./specs/location.e2e.mts,
              ./specs/navigation.e2e.mts,
              ./specs/notifications.e2e.mts
          - shard: 2
            specs: >-
              ./specs/attachments.e2e.mts,
              ./specs/composer-format-native.e2e.mts,
              ./specs/deep-link.e2e.mts,
              ./specs/native-capabilities.e2e.mts,
              ./specs/session.e2e.mts,
              ./specs/share.e2e.mts,
              ./specs/smoke.e2e.mts,
              ./specs/sso.e2e.mts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .appium
          key: appium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/setup-appium.mjs') }}
          restore-keys: appium-${{ runner.os }}-

      - name: Grant emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm -a -w /dev/kvm

      # Parallel steps: the app build and the homeserver image pull run while the emulator
      # action installs its system image and boots (~1:50 measured). The emulator script's
      # first line waits for the build's status file, so the suite's own sync and Gradle
      # run find everything up to date and never race this build.
      - name: Build the Android app while the emulator boots
        id: android-prebuild
        background: true
        timeout-minutes: 20
        run: |
          set +e
          pnpm android:build:prebuilt && ./android/gradlew -p android assembleSecondaryDebug
          status=$?
          mkdir -p dist/.ci
          echo "$status" > dist/.ci/android-prebuild.status
          exit "$status"
      - name: Pull the homeserver images while the emulator boots
        id: homeserver-pull
        background: true
        # Optional, like the browser prerequisites' pre-pull: the suite pulls what is missing.
        continue-on-error: true
        run: docker compose -f e2e/support/homeserver/docker-compose.yml -f e2e/support/homeserver/tuwunel/docker-compose.yml pull -q

      - id: mobile
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TRINITY_MOBILE_SPECS: ${{ matrix.specs }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trinity_api_36_ci
          # The AVD default left the emulator unresponsive after a WebView relaunch; local
          # runs that stay stable use 4 GB and 4 cores (the hosted runner has 16 GB, 4 vCPU).
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The action runs each line as its own `sh -c`. The first line fails the step with
          # the background build's exit code, or after 15 minutes without one.
          script: |
            timeout 900 sh -c 'until [ -s dist/.ci/android-prebuild.status ]; do sleep 5; done; exit "$(cat dist/.ci/android-prebuild.status)"'
            echo 'started=true' >> "$GITHUB_OUTPUT"
            TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 2700000 -- pnpm e2e:mobile

      - name: Wait for the background build and image pull
        wait: [android-prebuild, homeserver-pull]

      # Also covers dist/.ci (full run stdout) and a run killed before its own cleanup.
      - name: Scrub identifiers from mobile artifacts
        id: mobile-scrub
        if: ${{ !cancelled() && steps.mobile.outputs.started == 'true' }}
        run: node e2e/mobile/scrub-cli.mts dist/.ci dist/.playwright

      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.mobile.outputs.started == 'true' && steps.mobile-scrub.outcome == 'success' }}
        with:
          surface: mobile
          shard: ${{ matrix.shard }}
          report-path: dist/.playwright/trinity-e2e-mobile/*/mobile.android/**

      - name: Verify Mobile E2E left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  # Branch rules require the check "Mobile E2E (Android)"; both Android jobs report under
  # it through this job, which succeeds only when both succeeded.
  mobile-e2e-result:
    needs: [classify, mobile-e2e]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Mobile E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every split job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  ios-native-build:
    name: iOS Native Build
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.renderer.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - name: Record selected Xcode and simulator SDK
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun --sdk iphonesimulator --show-sdk-version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm nx run trinity-ios:verify
      - name: Compile unsigned simulator host from verified renderer
        id: ios
        run: |
          mkdir -p dist/ios-native
          echo 'started=true' >> "$GITHUB_OUTPUT"
          set -o pipefail
          pnpm nx run trinity-ios:build-prebuilt 2>&1 | tee dist/ios-native/xcodebuild.log
      - name: Retain Xcode diagnostics
        if: ${{ !cancelled() && steps.ios.outputs.started == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            dist/ios-native/xcodebuild.log
            dist/ios-native/run.*/build.xcresult/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify iOS left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  scheduled-e2e:
    name: Scheduled E2E
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit
      # The typed registry is the source of truth for this tier. Its strict
      # preflight fails before starting any suite when a required host is absent.
      - id: scheduled
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 6600000 -- pnpm e2e:scheduled
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.scheduled.outputs.started == 'true' }}
        with:
          surface: scheduled
          report-path: dist/.playwright/**/**

  # Weekly run only: opens, updates and closes the "Nightly E2E failing" issue.
  notify:
    name: Scheduled E2E issue
    needs: [scheduled-e2e]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-alert.yml
    with:
      needs: ${{ toJSON(needs) }}

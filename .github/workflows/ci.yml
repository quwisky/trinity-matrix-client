name: CI

on:
  schedule:
    # Registry-classified scheduled E2E only; local-only suites are deliberately
    # absent from this workflow and pull-request suites keep their existing jobs.
    - cron: '23 3 * * 0'
  push:
    # No renovate/** branches: every Renovate update opens a pull request, which the
    # `pull_request` trigger below tests, and a push trigger would run each one twice.
    branches: [main, 'release/**']
  pull_request:

# A newer push to the same branch makes the run in flight obsolete. The weekly cron run reports
# to an issue and its ref is main too, so it gets its own group: a push must not cancel it, and
# a cancelled run would open a false "Nightly E2E failing" issue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      classification: ${{ steps.classify.outputs.classification }}
      mas: ${{ steps.mas.outputs.run }}
      scrollbars: ${{ steps.scrollbars.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: classify
        run: node scripts/ci-classify.mjs
      # Whether a pull request touches what the `mas-e2e` and `tuwunel-oauth-e2e` journeys
      # check: sign-in code (QR sign-in's lib is under libs/data-access/auth), the Settings
      # link-device panel and the Devices list and trust state it reads, the matrix-js-sdk or crypto-wasm version, the SDK patch, and the MAS
      # and Tuwunel OAuth harnesses with those journeys. It is a step here, not an `on.pull_request.paths` filter, so a pull request
      # that skips the journeys still reports the required check. Pushes skip them: the Synapse
      # nightly runs the same journeys against main. The diffs are read into variables first,
      # and a missing base is rejected, so a failure fails the step instead of quietly skipping
      # the journeys.
      - id: mas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            : "${BASE:?pull request has no base sha}"
            paths='^(libs/data-access/(auth|matrix-client|accounts)/|libs/feature/auth/|libs/platform-native/src/lib/(session|secure)-storage\.service\.ts$|libs/util/matrix/src/lib/session\.model\.ts$|libs/application/runtime/src/lib/composition/application-capability\.providers\.ts$|patches/matrix-js-sdk|e2e/support/homeserver/mas/|e2e/support/homeserver/(Caddyfile|start\.mjs|stop\.mjs|constants\.mjs|kind\.mts|paths\.mjs)$|e2e/browser/journeys/accounts/mas-[^/]*\.spec\.mts$|e2e/browser/support/mas\.mts$|e2e/browser/journeys/accounts/qr-sign-in\.spec\.mts$|e2e/browser/support/qr-existing-device\.mts$|e2e/support/qr-camera\.mts$|e2e/support/homeserver/tuwunel-oauth/|libs/feature/settings/src/lib/devices/link-device/|libs/data-access/trust/|libs/feature/settings/src/lib/devices/devices-section\.component)'
            changed=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE...HEAD")
            # A version bump rewrites the matrix-js-sdk or crypto-wasm entries in these manifests.
            manifests=$(git diff --no-renames -U0 "$BASE...HEAD" -- package.json pnpm-lock.yaml pnpm-workspace.yaml)
            if grep -qE "$paths" <<< "$changed" || grep -qE '^[+-].*(matrix-js-sdk|@matrix-org/matrix-sdk-crypto-wasm)' <<< "$manifests"; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # Whether a pull request touches what the scheduled `components.scrollbars` suite renders
      # or runs on, so `scrollbars-e2e` runs it before merge. The paths are the suite's own
      # imports and rendered surfaces, not a guess: the Settings feature, overlay and layout
      # primitives it opens, the theme tokens and shared scrollbar and code-block styles it
      # measures, the Markdown renderer and sanitizer that emit the code block's language
      # class and attribute, the code highlighter, and its spec, config, target, registry entry
      # and the fixtures and harness files it loads. A version bump of Playwright, Tailwind or
      # Shiki, which render or measure what it checks, counts too. Pushes answer false, as for
      # `mas`: the weekly scheduled run covers main.
      - id: scrollbars
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            : "${BASE:?pull request has no base sha}"
            paths=(
              'libs/feature/settings/'
              'libs/components/(overlay|navigation-layout)/'
              'libs/theme-foundation/'
              'apps/trinity/src/(global|rendered-markdown)\.scss$'
              'libs/util/matrix/src/lib/(message-view|message-content|message-html|markdown-render)\.ts$'
              'libs/feature/rooms/src/lib/message-presentation/'
              'libs/feature/rooms/src/lib/message-row/message-row\.component\.(html|scss)$'
              'e2e/components/(scrollbars/|playwright\.scrollbars\.config\.mts$|project\.json$)'
              'e2e/registry/'
              'e2e/(fixtures|web-fixtures)\.mts$'
              'e2e/browser/support/app-e2e-config\.mts$'
              'e2e/support/homeserver/'
              'e2e/support/(account|app|artifact-path|composition-fixture\.types|e2e-registry\.types|host-suites|invocation|journeys/navigation|managed-command|message-composer|namespace|platform-contracts|playwright-config|process-lock|registry-metadata\.reporter|resource-fixtures|run-playwright|session|test-resources|touch-platform)\.mts$'
              'e2e/support/serve\.mjs$'
            )
            pattern="^($(IFS='|'; echo "${paths[*]}"))"
            changed=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE...HEAD")
            # A version bump rewrites these packages' entries in the manifests.
            manifests=$(git diff --no-renames -U0 "$BASE...HEAD" -- package.json pnpm-lock.yaml pnpm-workspace.yaml)
            packages="(@playwright/test|playwright(-core)?|tailwindcss|@tailwindcss/[a-z0-9-]+|shiki|@shikijs/[a-z0-9-]+)"
            if grep -qE "$pattern" <<< "$changed" || grep -qE "^[+-][[:space:]]*['\"]?${packages}(['\"]?:|@)" <<< "$manifests"; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  docs-gate:
    name: Documentation site
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: pnpm format:check
      - run: pnpm nx test scripts
      - run: pnpm nx test docs-site
      - run: pnpm nx run docs-site:check
      - run: pnpm nx run docs-site:assemble
      - id: docs-e2e
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          pnpm nx run docs-site:e2e
      # Not a registry suite, so not the registry-validated diagnostics action; same
      # artifact conventions. `.playwright` is a dot-directory, hence the hidden files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.docs-e2e.outputs.started == 'true' }}
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}-docs-site
          path: |
            dist/.playwright/docs-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # E2E tier contract: pull-request suites run in the existing host/browser jobs,
  # scheduled suites run in scheduled-e2e (and `scrollbars-e2e` adds a pull-request run of
  # `components.scrollbars` when its paths change), and local-only suites never run here.
  # Everything that reads the code without running it. Grouped because each part is
  # seconds long; split only if one starts dominating.
  quality:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Deliberately separate from `pnpm lint` in this repo — it is not part of it.
      - run: pnpm stylelint
      # `format:check` verifies and exits non-zero on drift, where `pnpm format` fixes.
      - run: pnpm format:check
      # Specs are excluded from every project's tsconfig.json AND from the type-aware
      # ESLint block, and Vitest transpiles them without checking — so this is the only CI
      # step that runs the compiler over test files. It checks every project here, in the
      # job with spare time, so `Unit tests` can skip projects a pull request leaves alone.
      - if: ${{ !cancelled() }}
        run: pnpm exec nx run-many -t typecheck

  test:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Pull requests test only the projects their diff affects, by the Nx project graph
      # against the PR base. Any root-level file or anything under .github/ runs every
      # project: Nx maps files such as .nvmrc or the setup action to no project. Pushes to
      # main and release/** always run every project.
      - id: unit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            pnpm test
          elif git -c core.quotePath=false diff --no-renames --name-only "$BASE...HEAD" | grep -E '^[^/]+$|^\.github/' > /dev/null; then
            echo 'Root-level or workflow files changed; testing every project.'
            pnpm test
          else
            pnpm nx affected -t test --base="$BASE" --head=HEAD
          fi

  # The production AOT build remains independent of unit/type checks.
  renderer:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Web build
    uses: ./.github/workflows/_renderer.yml
    permissions:
      contents: read
    with:
      sha: ${{ github.sha }}
      artifact-name: renderer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      retention-days: 30

  # electron/ is a separate package with its own lockfile and an explicit trinity-desktop
  # Nx application. The dedicated job additionally launches the real binary.
  desktop:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # The event's commit, like every renderer consumer below: restore-verified-renderer
      # fails unless HEAD equals the renderer's SHA. No `ref:` input (see _renderer.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      # The binary download is NOT skipped any more, and that is the point of this job.
      # It used to be, on the reasoning that "nothing here launches Electron" — which was
      # true and was the problem: a two-major Chromium bump had no gate at all, and the
      # e2e suite that does launch Electron had silently rotted (it still toggled a CSS
      # class renamed months earlier, and its "crypto WASM loads" test never loaded any
      # WASM). ~100 MB, cached below, one entry per Electron version: an older version's
      # download is no use, so there is no prefix fallback. Only main saves.
      - id: electron-version
        run: echo "version=$(node -p "require('./electron/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron-version.outputs.version }}
      # Fetch it here rather than letting `electron:e2e` trip the package's lazy download
      # mid-run: this is the step that populates the cache above, and a wedged @electron/get
      # should fail as itself, not as a Playwright launch timeout.
      - run: pnpm electron:install
      - if: github.ref == 'refs/heads/main' && steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron-version.outputs.version }}
      - run: pnpm electron:compile
      # `compile` type-checks the main-process sources only — electron/tsconfig.json
      # excludes `src/**/*.spec.ts`. This is the same gate for the specs (see
      # electron/tsconfig.spec.json for why it differs on module resolution).
      - run: pnpm electron:typecheck
      - run: pnpm electron:test
      # Launch the host built from the verified renderer without another Angular build.
      - id: electron
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- xvfb-run -a pnpm nx run trinity-e2e-electron:full-prebuilt
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.electron.outputs.started == 'true' }}
        with:
          surface: electron
          report-path: dist/.playwright/trinity-e2e-electron/*/electron.full/**

      # The app journeys, driven against a disposable homeserver (Tuwunel) + Caddy stack in Docker.
      - name: Verify Desktop left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  # The renderer-backed part of the E2E tier: it needs the verified production artifact,
  # so it still waits for `renderer`. The browser journeys and the Storybook check run in
  # their own jobs below, and `e2e-result` reports all three under the required check name.
  e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: E2E (renderer, styling, QR)
    # shortcut: Playwright's WebKit needs libicu the ubuntu-26.04 image lacks; move back once it runs.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    # Production renderer, styling and QR take about 3 minutes after setup; the ceiling is
    # hang containment, not an expected duration.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-playwright
        with:
          install: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        run: node scripts/ci-prerequisites.mjs
      # Installed by the helper above, so the browser caches are saved here (main only).
      - uses: ./.github/actions/save-playwright
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download

      # Real production UI semantics, contrast and geometry across the canonical viewport matrix.
      # Review screenshots are PR uploads, never committed pixel baselines.
      - id: renderer
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-web:production-renderer
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.renderer.outputs.started == 'true' }}
        with:
          surface: renderer
          report-path: dist/.playwright/trinity-e2e-web/*/web.production-renderer/**

      # Separate from the homeserver suite: this serves the already-built app and checks CSS
      # capability queries in desktop and real mobile-device browser profiles.
      - id: styling
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm exec nx run trinity-e2e-components:styling
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.styling.outputs.started == 'true' }}
        with:
          surface: styling
          report-path: dist/.playwright/trinity-e2e-components/*/components.styling/**

      # No env var needed to make this strict: the harness's graceful "Docker is missing,
      # skip the authenticated specs" fallback turns itself off whenever CI is set, so a
      # runner that cannot reach Docker Hub fails here instead of reporting a green job.
      # The QR protocol harness is the only homeserver suite in this job. Its synthetic
      # camera feeds a real SDK payload through production rendering, decoding and
      # reciprocation.
      - id: qr
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 300000 -- pnpm e2e:verify:qr
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.qr.outputs.started == 'true' }}
        with:
          surface: qr
          report-path: dist/.playwright/trinity-e2e-protocol/*/protocol.verify-qr/**

  # The app journeys, driven against a disposable homeserver (Tuwunel) + Caddy stack in
  # Docker, split into three Playwright shards. Each shard job starts its own homeserver,
  # so the per-homeserver worker cap in e2e/browser/playwright.config.mts holds per job.
  # The journeys use the development build, not the production renderer, so they start
  # without waiting for `renderer`.
  browser-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E browser journeys (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # 110 canonical browser specs, each doing a cold UI login (Rust-crypto init + first
    # /sync), at workers: 2 with one diagnostic retry, split across three jobs — plus
    # browser installation, three Docker image pulls and a full development build per job.
    # Keep this count synchronized with the executable E2E registry. The ceiling is hang
    # containment, not an expected duration.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The browser project is Chromium only: skip WebKit and the host libraries the
      # ubuntu image already provides for Chrome.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
          install: 'false'
          with-deps: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        env:
          TRINITY_PLAYWRIGHT_BROWSERS: chromium
          TRINITY_PLAYWRIGHT_WITH_DEPS: 'false'
        run: node scripts/ci-prerequisites.mjs
      - uses: ./.github/actions/save-playwright
        with:
          browsers: chromium
          with-deps: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}-${{ matrix.shard }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The registry validator pins this command line, so the shard is an environment
      # variable read by the Playwright config rather than a --shard argument.
      - id: browser
        env:
          TRINITY_E2E_SHARD: ${{ matrix.shard }}/3
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.browser.outputs.started == 'true' }}
        with:
          surface: browser
          shard: ${{ matrix.shard }}
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**

  # App lock's Windows Hello addon (electron/native/windows-hello): the shell's only native
  # module, so the only job that needs a Windows compiler. Builds it against Electron's
  # headers and loads it with Electron-as-Node; a hosted runner has no Hello hardware, so
  # the smoke accepts any known availability.
  desktop-windows:
    needs: [classify]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Desktop (Windows Hello addon)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm electron:install
      - run: pnpm -C electron run build:windows-hello
      - run: pnpm -C electron compile
      - name: Load the addon in Electron
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: pnpm -C electron exec electron scripts/smoke-windows-hello.cjs

  # Builds and serves the component Storybook, then verifies its palette × mode canvas and
  # focused text contrast in the installed browsers. It needs neither the renderer nor a
  # homeserver, so it starts as soon as `classify` finishes.
  storybook:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E Storybook
    # shortcut: Playwright's WebKit needs libicu the ubuntu-26.04 image lacks; move back once it runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
      - id: storybook
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 600000 -- pnpm exec nx run trinity-e2e-components:storybook
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.storybook.outputs.started == 'true' }}
        with:
          surface: storybook
          report-path: dist/.playwright/trinity-e2e-components/*/components.storybook/**

  # The MAS-backed OAuth journeys (accounts/mas-session.spec.mts) and QR sign-in
  # (accounts/qr-sign-in.spec.mts) against the opt-in MAS stack, only for a pull request that
  # touches sign-in code (the `mas` step of `classify`). The refresh journey waits out two real
  # 60 s token lifetimes (about three minutes), so that file takes about six minutes on two
  # workers, and the QR file about two; the Synapse nightly runs both against main.
  mas-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mas == 'true' }}
    name: E2E browser journeys (MAS)
    runs-on: ubuntu-latest
    # Hang containment. Expected ~16 min: setup and build ~5, and per spec file the stack ~1
    # plus specs ~6 and ~2.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
          install: 'false'
          with-deps: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        env:
          TRINITY_PLAYWRIGHT_BROWSERS: chromium
          TRINITY_PLAYWRIGHT_WITH_DEPS: 'false'
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # The registry validator pins this command line, so the journey file is an environment
      # variable read by the Playwright config (as the shard is), not an argument.
      - id: browser
        env:
          TRINITY_E2E_MAS: '1'
          TRINITY_E2E_SPEC: accounts/mas-session.spec.mts
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.browser.outputs.started == 'true' }}
        with:
          surface: browser-mas
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**
      # TRINITY_E2E_SPEC takes one file, so QR sign-in is a second invocation. It runs after
      # a failed MAS session journey too, so one failure does not hide the other.
      - id: qr
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'success' }}
        env:
          TRINITY_E2E_MAS: '1'
          TRINITY_E2E_SPEC: accounts/qr-sign-in.spec.mts
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.qr.outputs.started == 'true' }}
        with:
          surface: browser-mas-qr
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**

  # QR sign-in (accounts/qr-sign-in.spec.mts) against Tuwunel's built-in OAuth server, the
  # other server that offers it, on the same pull requests as `mas-e2e`. The job-level kind
  # also selects the images the prerequisites step pulls; they are Tuwunel's public images.
  tuwunel-oauth-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mas == 'true' }}
    name: E2E browser journeys (Tuwunel OAuth)
    runs-on: ubuntu-latest
    # Hang containment. Expected ~9 min: setup and build ~5, images and stack ~1, specs ~2.
    timeout-minutes: 30
    env:
      TRINITY_E2E_HOMESERVER: tuwunel-oauth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
          install: 'false'
          with-deps: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        env:
          TRINITY_PLAYWRIGHT_BROWSERS: chromium
          TRINITY_PLAYWRIGHT_WITH_DEPS: 'false'
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: browser
        env:
          TRINITY_E2E_SPEC: accounts/qr-sign-in.spec.mts
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-browser:e2e
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.browser.outputs.started == 'true' }}
        with:
          surface: browser-tuwunel-oauth
          report-path: dist/.playwright/trinity-e2e-browser/*/browser.canonical/**

  # The scheduled scrollbar suite (Chromium, Firefox and WebKit against the development build
  # and a disposable homeserver), only for a pull request that changes what it renders (the
  # `scrollbars` step of `classify`). It stays in the scheduled tier, which runs it on main.
  scrollbars-e2e:
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.scrollbars == 'true' }}
    name: E2E scrollbars
    # shortcut: Playwright's WebKit needs libicu the ubuntu-26.04 image lacks; move back once it runs.
    runs-on: ubuntu-24.04
    # Hang containment. Setup, browsers and the development build take most of it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit
          install: 'false'
      - name: Prepare e2e prerequisites
        id: prerequisites
        env:
          TRINITY_PLAYWRIGHT_BROWSERS: chromium firefox webkit
        run: node scripts/ci-prerequisites.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'failure' }}
        with:
          name: prerequisites-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}
          path: dist/.ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: scrollbars
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 1200000 -- pnpm exec nx run trinity-e2e-components:scrollbars
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.scrollbars.outputs.started == 'true' }}
        with:
          surface: scrollbars
          report-path: dist/.playwright/trinity-e2e-components/*/components.scrollbars/**

  # Branch rules require the check "E2E (Playwright + homeserver)". The work behind it now
  # runs in several jobs, so this job reports under that name and succeeds only when every
  # one of them succeeded. A skipped job (for example after a renderer failure) fails it,
  # except `mas-e2e`, `tuwunel-oauth-e2e` and `scrollbars-e2e`, which are skipped by design
  # when a pull request leaves the paths they check alone.
  e2e-result:
    needs:
      [
        classify,
        e2e,
        browser-e2e,
        storybook,
        mas-e2e,
        tuwunel-oauth-e2e,
        scrollbars-e2e,
      ]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: E2E (Playwright + homeserver)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every split job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.[]; .value.result == "success" or ((.key == "mas-e2e" or .key == "tuwunel-oauth-e2e" or .key == "scrollbars-e2e") and .value.result == "skipped"))' > /dev/null

  # WebdriverIO + Appium on the installed app: it boots an API 36 emulator because browser
  # E2E cannot substitute for native Back, process relaunch, Android TLS policy, or the
  # packaged application itself. See e2e/README.md.
  #
  # Two jobs, each with its own emulator and homeserver, split the spec files by measured
  # duration (run 37659485183): navigation (~2:20) and deep-link (~1:30) are the slow ones
  # and sit in different shards, about 4:50 of specs each. Put a new spec in the lighter
  # shard; scripts/ci-workflow.spec.mjs fails while a spec file is in neither.
  mobile-e2e:
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    name: Mobile E2E (Android ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 75
    # The emulator action's api-level, target and arch. The cache and install steps derive the
    # package names and cache key from these, so the packages they prepare are the ones the
    # action looks for.
    env:
      TRINITY_EMULATOR_API_LEVEL: '36'
      TRINITY_EMULATOR_TARGET: google_apis
      TRINITY_EMULATOR_ARCH: x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            specs: >-
              ./specs/app-lock.e2e.mts,
              ./specs/app-shell.e2e.mts,
              ./specs/appearance.e2e.mts,
              ./specs/capture.e2e.mts,
              ./specs/location.e2e.mts,
              ./specs/navigation.e2e.mts,
              ./specs/notifications.e2e.mts,
              ./specs/push-render-android.e2e.mts
          - shard: 2
            specs: >-
              ./specs/attachments.e2e.mts,
              ./specs/composer-format-native.e2e.mts,
              ./specs/deep-link.e2e.mts,
              ./specs/message-links.e2e.mts,
              ./specs/native-capabilities.e2e.mts,
              ./specs/push-render-ios.e2e.mts,
              ./specs/session.e2e.mts,
              ./specs/share.e2e.mts,
              ./specs/smoke.e2e.mts,
              ./specs/sso.e2e.mts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download

      # Restored here and saved at the end of a successful run on main only; other refs
      # restore main's entries.
      - id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'android/**/*.gradle', 'libs/native/*/android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - id: appium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .appium
          key: appium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/setup-appium.mjs') }}
          restore-keys: appium-${{ runner.os }}-

      - name: Grant emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm -a -w /dev/kvm

      # Parallel steps: the app build and the homeserver image pull run while the emulator and
      # its system image are restored or installed and the emulator boots (~2:30 measured, run
      # 38852577922, with or without a cache hit). The emulator script's first line waits for
      # the build's status file, so the suite's own sync and Gradle run find everything up to
      # date and never race this build.
      - name: Build the Android app while the emulator boots
        id: android-prebuild
        background: true
        timeout-minutes: 20
        run: |
          set +e
          pnpm android:build:prebuilt && ./android/gradlew -p android assembleSecondaryDebug testDebugUnitTest
          status=$?
          mkdir -p dist/.ci
          echo "$status" > dist/.ci/android-prebuild.status
          exit "$status"
      - name: Pull the homeserver images while the emulator boots
        id: homeserver-pull
        background: true
        # Optional, like the browser prerequisites' pre-pull: the suite pulls what is missing.
        continue-on-error: true
        run: docker compose -f e2e/support/homeserver/docker-compose.yml -f e2e/support/homeserver/tuwunel/docker-compose.yml pull -q

      # The runner image ships neither the emulator nor the system image, and the emulator
      # action installs both with sdkmanager on every run, once and silently: a download that
      # arrives corrupt ("Error on ZipFile unknown archive") fails the job before any spec runs.
      # These steps restore both packages from a cache, have sdkmanager install whatever is
      # missing or outdated with up to three attempts, and leave the action's own sdkmanager
      # calls nothing to download. The job's TRINITY_EMULATOR_* variables name the packages.
      - name: Locate the emulator packages
        id: emulator-packages
        run: |
          variant="$TRINITY_EMULATOR_API_LEVEL-$TRINITY_EMULATOR_TARGET-$TRINITY_EMULATOR_ARCH"
          {
            echo "image=system-images;android-$TRINITY_EMULATOR_API_LEVEL;$TRINITY_EMULATOR_TARGET;$TRINITY_EMULATOR_ARCH"
            echo "key-prefix=android-emulator-$RUNNER_OS-$variant"
            echo 'paths<<EOF'
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/system-images/android-$TRINITY_EMULATOR_API_LEVEL/$TRINITY_EMULATOR_TARGET/$TRINITY_EMULATOR_ARCH"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Restore the emulator and its system image
        id: emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.emulator-packages.outputs.paths }}
          # Saved keys end in the installed versions; the newest one is restored.
          key: ${{ steps.emulator-packages.outputs.key-prefix }}
          restore-keys: ${{ steps.emulator-packages.outputs.key-prefix }}-
      - name: Install the emulator and its system image
        id: emulator-install
        # Three attempts of at most 2 + 10 minutes each, plus the pauses between them.
        timeout-minutes: 40
        env:
          PACKAGE_PATHS: ${{ steps.emulator-packages.outputs.paths }}
          RESTORED_KEY: ${{ steps.emulator-cache.outputs.cache-matched-key }}
          SYSTEM_IMAGE: ${{ steps.emulator-packages.outputs.image }}
          KEY_PREFIX: ${{ steps.emulator-packages.outputs.key-prefix }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -n "$RESTORED_KEY" ]; then
            echo "Restored $RESTORED_KEY"
          else
            # A restore that failed part-way leaves files behind; sdkmanager must not see them.
            while read -r dir; do rm -rf "$dir"; done <<< "$PACKAGE_PATHS"
          fi
          version() {
            "$sdkmanager" --list_installed 2> /dev/null |
              awk -F '|' -v pkg="$1" '{ gsub(/ /, "", $1); gsub(/ /, "", $2) } $1 == pkg { print $2; exit }'
          }
          # sdkmanager exits non-zero when a download is corrupt. After a failed attempt its
          # partial downloads and both package directories are deleted, so the next attempt
          # downloads afresh and cannot install beside a half-moved package. `{ yes || :; }`
          # keeps the licence pipe's status sdkmanager's even under pipefail, where `yes`
          # exiting on SIGPIPE would otherwise fail every attempt.
          for attempt in 1 2 3; do
            start=$SECONDS
            if { yes || :; } | timeout 120 "$sdkmanager" --licenses > /dev/null &&
              timeout 600 "$sdkmanager" --install emulator "$SYSTEM_IMAGE" --channel=0 > /dev/null &&
              [ -n "$(version emulator)" ] && [ -n "$(version "$SYSTEM_IMAGE")" ]; then
              echo "sdkmanager attempt $attempt succeeded in $((SECONDS - start))s"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::sdkmanager could not install the emulator and $SYSTEM_IMAGE in 3 attempts"
              exit 1
            fi
            echo "::warning::sdkmanager attempt $attempt failed after $((SECONDS - start))s; retrying"
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates"
            while read -r dir; do rm -rf "$dir"; done <<< "$PACKAGE_PATHS"
            sleep $((attempt * 15))
          done
          emulator=$(version emulator)
          image=$(version "$SYSTEM_IMAGE")
          echo "Installed emulator $emulator and system image revision $image"
          echo "key=$KEY_PREFIX-$emulator-r$image" >> "$GITHUB_OUTPUT"

      - id: mobile
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TRINITY_MOBILE_SPECS: ${{ matrix.specs }}
        with:
          api-level: ${{ env.TRINITY_EMULATOR_API_LEVEL }}
          target: ${{ env.TRINITY_EMULATOR_TARGET }}
          arch: ${{ env.TRINITY_EMULATOR_ARCH }}
          profile: pixel_6
          avd-name: trinity_api_${{ env.TRINITY_EMULATOR_API_LEVEL }}_ci
          # The AVD default left the emulator unresponsive after a WebView relaunch; local
          # runs that stay stable use 4 GB and 4 cores (the hosted runner has 16 GB, 4 vCPU).
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The action runs each line as its own `sh -c`. The first line hides system error
          # dialogs at once, since the launcher has frozen during the prebuild wait and left
          # an "isn't responding" dialog holding input focus (#1194); the suite turns the
          # setting on again and closes open dialogs, so a failure here is only logged. The
          # second line fails the step with the background build's exit code, or after 15
          # minutes without one.
          script: |
            adb shell settings put global hide_error_dialogs 1 || echo 'could not hide error dialogs'
            timeout 900 sh -c 'until [ -s dist/.ci/android-prebuild.status ]; do sleep 5; done; exit "$(cat dist/.ci/android-prebuild.status)"'
            echo 'started=true' >> "$GITHUB_OUTPUT"
            TRINITY_ANDROID_SERIAL="$ANDROID_SERIAL" node scripts/ci-run-command.mjs --timeout-ms 2700000 -- pnpm e2e:mobile

      - name: Wait for the background build and image pull
        wait: [android-prebuild, homeserver-pull]

      # Saved only after the emulator booted from these packages (the script writes `started`
      # once the emulator has booted and the background app build has succeeded), so a cache
      # entry cannot hold a package that does not work, and only when
      # the installed versions differ from the restored entry's. Only main saves: the entry is
      # 2 GB, and pull requests restore main's, so there is one entry rather than one per pull
      # request. A pull request run before main has an entry installs with the retry alone.
      # Shard 1 saves; both shards install the same packages, and two 2 GB uploads would race.
      - name: Save the emulator and its system image
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.mobile.outputs.started == 'true' && steps.emulator-install.outputs.key != steps.emulator-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.emulator-packages.outputs.paths }}
          key: ${{ steps.emulator-install.outputs.key }}

      # Also covers dist/.ci (full run stdout) and a run killed before its own cleanup.
      - name: Scrub identifiers from mobile artifacts
        id: mobile-scrub
        if: ${{ !cancelled() && steps.mobile.outputs.started == 'true' }}
        run: node e2e/mobile/scrub-cli.mts dist/.ci dist/.playwright

      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.mobile.outputs.started == 'true' && steps.mobile-scrub.outcome == 'success' }}
        with:
          surface: mobile
          shard: ${{ matrix.shard }}
          report-path: dist/.playwright/trinity-e2e-mobile/*/mobile.android/**

      - name: Verify Mobile E2E left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

      # The restored entry carries every Gradle distribution an older key ever downloaded;
      # only the one gradle-wrapper.properties names is used. The wrapper runs from the
      # unpacked distribution once its .ok marker exists, so a downloaded zip beside it is dead
      # weight too. Sizes are logged for tuning; this runs on every ref, saving only on main.
      - name: Prune the Gradle cache
        continue-on-error: true
        run: |
          current=$(sed -n 's#^distributionUrl=.*/\(gradle-[^/]*\)\.zip$#\1#p' android/gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$current" ]; then echo 'No distributionUrl found; not pruning'; exit 0; fi
          echo "Keeping $current"
          du -sh ~/.gradle/wrapper/dists/*
          for dist in ~/.gradle/wrapper/dists/*/; do
            if [ "$(basename "$dist")" != "$current" ]; then rm -rf "$dist"; fi
          done
          find ~/.gradle/wrapper/dists -name '*.zip' -type f -print -delete
          du -sh ~/.gradle/caches ~/.gradle/wrapper
          du -sh ~/.gradle/caches/* | sort -h | tail -n 6
      # Shard 1 saves both, so the shards don't race to upload the same entries.
      - if: github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - if: github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.appium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .appium
          key: ${{ steps.appium-cache.outputs.cache-primary-key }}

  # Branch rules require the check "Mobile E2E (Android)"; both Android jobs report under
  # it through this job, which succeeds only when both succeeded.
  mobile-e2e-result:
    needs: [classify, mobile-e2e]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' }}
    name: Mobile E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every split job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  ios-native-build:
    name: iOS Native Build
    needs: [classify, renderer]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.mode != 'docs' && needs.renderer.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore-verified-renderer
        with:
          sha: ${{ needs.renderer.outputs.sha }}
          source-run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.renderer.outputs.artifact-id }}
          artifact-name: ${{ needs.renderer.outputs.artifact-name }}
          manifest-digest: ${{ needs.renderer.outputs.manifest-digest }}
          destination: dist/renderer-download
      - name: Record selected Xcode and simulator SDK
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun --sdk iphonesimulator --show-sdk-version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm nx run trinity-ios:verify
      - name: Compile unsigned simulator host from verified renderer
        id: ios
        run: |
          mkdir -p dist/ios-native
          echo 'started=true' >> "$GITHUB_OUTPUT"
          set -o pipefail
          pnpm nx run trinity-ios:build-prebuilt 2>&1 | tee dist/ios-native/xcodebuild.log
      - name: Retain Xcode diagnostics
        if: ${{ !cancelled() && steps.ios.outputs.started == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            dist/ios-native/xcodebuild.log
            dist/ios-native/run.*/build.xcresult/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify iOS left the worktree unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  scheduled-e2e:
    name: Scheduled E2E
    if: github.event_name == 'schedule'
    # shortcut: Playwright's WebKit needs libicu the ubuntu-26.04 image lacks; move back once it runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit
      # The typed registry is the source of truth for this tier. Its strict
      # preflight fails before starting any suite when a required host is absent.
      - id: scheduled
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node scripts/ci-run-command.mjs --timeout-ms 6600000 -- pnpm e2e:scheduled
      - uses: ./.github/actions/upload-playwright-diagnostics
        if: ${{ !cancelled() && steps.scheduled.outputs.started == 'true' }}
        with:
          surface: scheduled
          report-path: dist/.playwright/**/**

  # Weekly run only: opens, updates and closes the "Nightly E2E failing" issue.
  notify:
    name: Scheduled E2E issue
    needs: [scheduled-e2e]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      issues: write
    uses: ./.github/workflows/_nightly-alert.yml
    with:
      needs: ${{ toJSON(needs) }}

name: CodeQL

# CodeQL advanced setup. It replaces default setup, which analysed actions, java-kotlin and
# javascript-typescript but had to leave Swift out: its autobuild builds the biggest Xcode
# target, ios/App, and that needs `pnpm install` and `cap sync` first because
# ios/App/CapApp-SPM/Package.swift points into node_modules/.pnpm. Default setup must be off
# for this workflow's uploads to be accepted (docs-internal/maintenance/ci-and-releases.md).
#
# Every category is `/language:<language>`, the name default setup used, so the alert history
# of the three existing languages continues instead of starting over.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, like default setup: picks up new queries for code nobody has changed.
    - cron: '37 5 * * 1'

# A newer pull request push makes the analysis in flight obsolete. Runs on main always finish,
# so every main commit keeps its analysis; the weekly run has its own group, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The languages and build modes default setup ran. Neither needs a build.
        language: [actions, java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Each analysis of main saves a new overlay base database per language (about 350 MB for
  # JavaScript, 48 MB for Java) and CodeQL never deletes the old ones, so they filled the
  # 10 GB Actions cache and evicted every other workflow's entries. CodeQL restores the newest
  # one, so keep that per language and delete the rest. Its documented off switch, the
  # `github-codeql-disable-overlay` property, exists only for organization-owned repositories.
  prune-overlay-caches:
    name: Prune CodeQL overlay caches
    needs: analyze
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The key is codeql-overlay-base-database-<v>-<hash>-<language>-<cli>-<sha>-<run>-<attempt>.
          stale=$(gh cache list --ref refs/heads/main --key codeql-overlay-base-database- \
            --limit 100 --json id,key,createdAt \
            --jq 'group_by(.key | split("-")[6])[] | sort_by(.createdAt) | .[:-1][] | "\(.id) \(.key)"')
          while read -r id key; do
            [ -n "$id" ] || continue
            echo "Deleting $key"
            gh cache delete "$id"
          done <<< "$stale"

  # Whether a pull request touches Swift or its build files. Swift needs a macOS runner, the
  # most expensive kind, so pull requests that leave Swift alone skip the swift job; pushes to
  # main and the weekly run always analyse it. Like the `mas` step in ci.yml this reads the diff
  # in a job, not an `on.pull_request.paths` filter, so the other languages still run on every
  # pull request. No CodeQL check is required by the main ruleset, and a skipped job counts as
  # passed, so a skipped swift job never leaves a check pending. A missing base fails the job
  # instead of quietly skipping Swift.
  changes:
    name: Swift changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.swift.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: swift
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          : "${BASE:?pull request has no base sha}"
          paths='\.swift$|(^|/)Package\.resolved$|\.(xcodeproj|xcworkspace)/|^\.github/workflows/codeql\.yml$'
          changed_paths=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE...HEAD")
          changed=false
          if grep -qE "$paths" <<< "$changed_paths"; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Builds only the Swift CodeQL can compile without the app: the TrinityPush package
  # (libs/native/capacitor-push/ios/TrinityPush, Foundation, Security and CryptoKit only), the
  # push rendering shared by the plugin and the NotificationService extension; and the
  # TrinityAppLockCore package (libs/native/capacitor-app-lock/ios/TrinityAppLockCore,
  # Foundation, Security and CommonCrypto only), the App lock PIN verifier.
  #
  # Not covered:
  # - The PushHandoff and AppLock plugins (libs/native/capacitor-*/ios/Sources). Their packages
  #   depend on capacitor-swift-pm's Capacitor product alone, and Capacitor's headers import
  #   Cordova, so they compile only inside the app, where CapApp-SPM also links Cordova.
  # - ios/App: the app target and the NotificationService extension. Building them needs the
  #   workspace's node_modules and `cap sync`; ci.yml's iOS Native Build job compiles them.
  swift:
    name: Analyze (swift)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      - name: Record selected Xcode and Swift
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          swift --version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # CodeQL extracts what this build compiles. A fresh checkout has no .build directory, so
      # every source file compiles; host architecture only, as CodeQL recommends.
      - name: Build TrinityPush
        run: swift build --package-path libs/native/capacitor-push/ios/TrinityPush
      - name: Build TrinityAppLockCore
        run: swift build --package-path libs/native/capacitor-app-lock/ios/TrinityAppLockCore
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift

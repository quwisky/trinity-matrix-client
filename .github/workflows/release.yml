name: Release

# release-please runs on every push to main (prerelease line: vX.Y.Z-next.N) and to each
# release/X.Y.x branch (stable line: vX.Y.Z and its patch releases). It keeps one release PR
# open per branch; merging that PR makes release-please tag the merge commit and create a
# DRAFT GitHub release, and the jobs below package the desktop installers into that draft
# in the same run. A stable tag also opens the back-merge PR from release/X.Y.x into main.
#
# Tags created with GITHUB_TOKEN never trigger other workflows, which is why packaging
# lives here instead of behind a tag trigger.
#
# workflow_dispatch re-packages an existing tag: artifacts are immutable per run, and
# recovering a failed release must not require deleting and re-pushing a tag.
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z or vX.Y.Z-next.N tag to package'
        required: true

# One group for every release run. Never cancel mid-flight: a half-uploaded draft is
# worse than a slow one, and a push and a dispatch for the same tag must not both
# --clobber one draft. A newer queued push replaces an older one, losing nothing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A release branch's first stable release takes the version of the prerelease it was
      # cut from. The action ignores release-as in manifest mode, so the CLI opens that PR
      # with --release-as and the action below only tags and releases. Once the line has a
      # stable tag the helper prints nothing and always-bump-patch proposes patch releases.
      - name: Check out the release branch
        if: ${{ startsWith(github.ref_name, 'release/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and every tag: the helper reads the tags reachable from HEAD.
          fetch-depth: 0
          persist-credentials: false
      # The script uses import.meta.main (Node 24+); the runner's default Node is older.
      - name: Set up Node
        if: ${{ startsWith(github.ref_name, 'release/') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: version
        name: Find the first stable version
        if: ${{ startsWith(github.ref_name, 'release/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-version.mjs "$BRANCH")
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      # release-please aborts here while a merged release PR is still untagged, so the push
      # that merges the release PR leaves tagging to the action.
      - id: first-release-pr
        name: Open the first stable release PR
        if: ${{ steps.version.outputs.version != '' }}
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          npx --yes release-please@17.11.2 release-pr
          --token "$TOKEN"
          --repo-url "$GITHUB_REPOSITORY"
          --target-branch "$GITHUB_REF_NAME"
          --config-file release-please-config.json
          --manifest-file .release-please-manifest.json
          --release-as "$VERSION"
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: ${{ steps.version.outputs.version != '' }}
          config-file: ${{ startsWith(github.ref_name, 'release/') && 'release-please-config.json' || 'release-please-config.next.json' }}
          manifest-file: ${{ startsWith(github.ref_name, 'release/') && '.release-please-manifest.json' || '.release-please-manifest.next.json' }}

  # Merges the release branch back into main so main gets the changelog, the stable
  # version files and any fixes made on the branch. Independent of packaging: a failed
  # installer build must not hold the back-merge.
  back-merge:
    name: Open the back-merge PR
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' && startsWith(github.ref_name, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release App's private key lives only in this environment. It has no required
    # reviewers, so the automation never waits for a maintainer.
    environment: release-app
    steps:
      # GITHUB_TOKEN pushes trigger no workflows, so CI would never run on the PR.
      # The token comes from the release App.
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The release branch's own copy of the script. back-merge.mjs fetches main and
      # branches from origin/main itself; it pushes only its back-merge/vX.Y.Z branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # The script uses import.meta.main (Node 24+); the runner's default Node is older.
      # Node only: the script needs no workspace dependencies, so skip the full setup.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Merge the release into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'trinity-release[bot]'
          git config user.email 'trinity-release[bot]@users.noreply.github.com'
          node scripts/back-merge.mjs --tag "$TAG" --branch "$BRANCH"

  # The whole gate for a release: the same checks ci.yml runs on a branch, plus the
  # tag/ancestry/version checks below. A dispatch can name any tag, so nothing here may
  # assume the tag came from release-please.
  verify:
    name: Verify the tag
    needs: release-please
    # !cancelled(): on a dispatch release-please is skipped, which would otherwise skip
    # this job too. On a push this runs only when release-please created a release.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Validated before anything uses it: a dispatch input is free text.
      - id: tag
        name: Tag is a release version
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-next\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z or vX.Y.Z-next.N tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          # Full history and every branch: the ancestry check needs the branch tips.
          fetch-depth: 0
          persist-credentials: false

      # A tag is not evidence of review — anyone who can push one can point it at an
      # arbitrary commit. Require that the commit is reachable from main or a release
      # branch, so releases can only be cut from code that went through a PR.
      - name: Tagged commit is on main or a release branch
        run: |
          for branch in origin/main $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/); do
            if git merge-base --is-ancestor HEAD "$branch"; then
              echo "Tagged commit is contained in $branch."
              exit 0
            fi
          done
          echo "::error::${TAG} points at a commit that is not contained in main or a release branch. Release only from a merged commit."
          exit 1
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - uses: ./.github/actions/setup

      # electron-builder names every artifact after package.json's version, NOT the tag,
      # so a mismatch silently ships "Trinity Setup 0.1.0.exe" for tag v0.3.0. The
      # release PR bumps both manifests (electron/package.json via extra-files); this
      # catches a hand edit or a dispatch of the wrong tag before anything is built.
      - name: Tag matches the package versions
        run: |
          tag="${TAG#v}"
          root=$(node -p "require('./package.json').version")
          desktop=$(node -p "require('./electron/package.json').version")
          if [ "$tag" != "$root" ] || [ "$tag" != "$desktop" ]; then
            echo "::error::Tag $TAG does not match package.json ($root) / electron/package.json ($desktop). release-please bumps both in the release PR; fix the mismatch in a new PR."
            exit 1
          fi
          echo "Version $tag agrees across the tag and both manifests."
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      # The same gates ci.yml runs on a branch. `pnpm build` in particular catches
      # AOT-only failures (the `lib: es2018` trap) that Vitest passes — far better here
      # than three times over on 2x/10x-billed macOS and Windows runners.
      - run: pnpm lint
      - run: pnpm stylelint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # These Nx-owned targets install the standalone shell dependency graph but do not
      # download or launch the Electron binary. The explicit repeat after `pnpm test`
      # keeps the release gate's desktop type-check and unit-test intent visible.
      - run: pnpm electron:typecheck
      - run: pnpm electron:test

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    # Explicit, not the default success(): that also requires release-please, which a
    # dispatch skips, and would skip packaging on every manual re-package.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ${{ matrix.os }}
    # Gates the signing secrets behind an environment. Required reviewers on `release`
    # gate packaging only (the release App jobs use `release-app`); without them this is
    # a no-op, with them it is what stops a pushed tag from minting a signed installer
    # unattended. The certificate is the asset worth protecting: electron-builder runs
    # repo-controlled hooks (afterPack.cjs) in the same process that holds CSC_KEY_PASSWORD.
    environment: release
    # Without this the job inherits the 6-hour default, and a wedged @electron/get download
    # would hold the release all day. macOS gets 120 minutes: Apple's notary queue alone
    # can take most of an hour, and the first signed release outlasted 45.
    timeout-minutes: ${{ matrix.platform == 'mac' && 120 || 45 }}
    strategy:
      # One platform's toolchain breaking should not deny you the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            flag: '--linux'
            assets: |
              electron/release/*.AppImage
              electron/release/*.deb
          # Apple Silicon, and electron-builder defaults to the host architecture — this
          # produces arm64 artifacts only, by choice. macos-26 brings Xcode 26's actool,
          # which compiles the Icon Composer app icon.
          - os: macos-26
            platform: mac
            flag: '--mac'
            assets: |
              electron/release/*.dmg
              electron/release/*.zip
          - os: windows-latest
            platform: win
            flag: '--win'
            assets: |
              electron/release/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The release-specific Nx path builds the shared renderer and shell without the
      # local `trinity-dev` signature. electron-builder owns real signing below.
      - run: pnpm electron:build:release

      # Half a signing setup yields an app that is signed but not notarized, or the
      # reverse; Gatekeeper and the Homebrew tap reject both. All five or none.
      - name: macOS signing secrets are complete
        if: matrix.platform == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          count=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name:-}" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -ne 0 ] && [ "$count" -ne 5 ]; then
            echo "::error::Set all five macOS signing secrets or none; $count of 5 are set."
            exit 1
          fi

      - name: electron-builder ${{ matrix.flag }}
        working-directory: electron
        run: pnpm exec electron-builder ${{ matrix.flag }} --publish never
        env:
          # Signing is wired but optional: with no secrets set these resolve to empty and
          # the artifacts are simply unsigned. macOS auto-discovery is forced OFF in that
          # case so a stray keychain identity can't turn an unsigned build into a failing
          # one; add MAC_CSC_LINK (base64 of the .p12) and it flips back on by itself.
          #
          # The nested `|| ''` is load-bearing. `a && b || c` collapses to `c` whenever b
          # is empty, so the plain form would hand the *Windows* cert to the macOS build
          # the moment MAC_CSC_LINK was unset. electron-builder reads WIN_CSC_LINK on its
          # own for Windows, so CSC_LINK is scoped to macOS and empty everywhere else.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Notarization (macOS). electron-builder notarizes the signed app when all three are
          # present and skips it otherwise. The App Store Connect API-key style it also supports needs APPLE_API_KEY to be
          # a path to a .p8 file, which a secret cannot be directly — hence the Apple ID
          # style here, whose three values are all plain strings.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trinity-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          # This is the whole recovery window if the draft step fails: long enough to
          # re-run the release job alone rather than the entire matrix.
          retention-days: 30
          # Artifacts are immutable per run, so a re-run without this dies with
          # "409 Conflict: an artifact with this name already exists".
          overwrite: true

  # The self-hostable web app: the verified production renderer as a zip on the draft.
  # container.yml builds the GHCR image from this exact zip once the release is published.
  package-web:
    name: Package (web)
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm nx run trinity:build
      # Records www/ hashes bound to the tag commit; container.yml verifies them again.
      - run: node scripts/web-bundle-manifest.mjs write www
      - name: Pack the web zip
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/web-release-zip.mjs --version "${TAG#v}" --out release-web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trinity-web
          path: release-web/Trinity-Web-*.zip
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft the release
    needs: [verify, package, package-web]
    # NOT the default `success()`. A matrix job reports failure if ANY leg fails, even
    # with fail-fast off — so the default would skip this entirely when one platform
    # breaks, throwing away the installers that did build. That is the exact opposite of
    # what fail-fast: false is for. The missing-platform check below makes the gap loud.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that may write to the repo, and only to attach these artifacts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: trinity-*
          merge-multiple: true

      - name: Check which platforms landed
        run: |
          ls -lR artifacts || true
          missing=''
          ls artifacts/*.AppImage >/dev/null 2>&1 || missing="$missing linux"
          ls artifacts/*.dmg >/dev/null 2>&1 || missing="$missing mac"
          ls artifacts/*.exe >/dev/null 2>&1 || missing="$missing win"
          ls artifacts/Trinity-Web-*.zip >/dev/null 2>&1 || missing="$missing web"
          if [ -n "$missing" ]; then
            echo "::warning::No artifact for:$missing — drafting a PARTIAL release. Re-run the workflow once fixed."
          fi
          if ! ls artifacts/* >/dev/null 2>&1; then
            echo "::error::Every platform failed; nothing to attach."
            exit 1
          fi

      # Stays a DRAFT here; the `publish` job below publishes it once every platform's
      # package is attached. release-please normally created this draft already
      # (with its notes); a dispatch for a tag without a release creates it here.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            false)
              # --clobber DELETES the existing assets before uploading. On a published
              # release that silently swaps what people already have — and electron-builder
              # output is not bit-reproducible, so even a same-commit rebuild differs.
              echo "::error::$TAG is already published. Refusing to replace its assets; cut a new version instead."
              exit 1
              ;;
            true)
              gh release upload "$TAG" artifacts/* --clobber
              ;;
            *)
              prerelease=''
              case "$TAG" in *-next.*) prerelease='--prerelease' ;; esac
              gh release create "$TAG" artifacts/* \
                --draft $prerelease \
                --verify-tag \
                --title "Trinity $TAG" \
                --notes "Desktop and web builds for $TAG. Artifacts are unsigned unless signing secrets were configured — see https://quwisky.github.io/trinity-matrix-client/developers/platforms/electron/"
              ;;
          esac

  # Publishes the draft once every platform's package is attached. A partial draft stays a
  # draft with a warning; re-packaging the tag (workflow_dispatch) completes and publishes it.
  publish:
    name: Publish the release
    needs: [verify, draft-release]
    if: ${{ !cancelled() && needs.draft-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release App's private key lives only in this environment. It has no required
    # reviewers, so the automation never waits for a maintainer.
    environment: release-app
    steps:
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Publish when complete
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/release-publish.mjs --tag "$TAG"

name: Release

# Version tags only — `v1.2.3`. Pre-release tags (`v1.2.3-beta.1`) deliberately do not
# match: they would publish installers named after a version this pipeline never
# verified. Widen the pattern here if you start shipping pre-releases.
#
# workflow_dispatch exists because artifacts are immutable per run: re-running a failed
# release is the normal recovery path, and it must not require deleting and re-pushing a
# tag (which is precisely what the version gate below exists to make unnecessary).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.X.X tag to package'
        required: true

# Never cancel a release mid-flight: a half-uploaded draft is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A tag can be pushed from anywhere, and a tag push triggers NO ci.yml run at all, so
  # nothing else would ever check this commit. This job is the whole gate.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history: the ancestry check below needs to reach the branch tips.
          fetch-depth: 0

      # A tag is not evidence of review — anyone who can push one can point it at an
      # arbitrary commit. Require that the commit is actually reachable from a long-lived
      # branch, so releases can only be cut from code that went through a PR.
      - name: Tagged commit is on develop or master
        run: |
          git fetch --quiet --no-tags origin \
            '+refs/heads/develop:refs/remotes/origin/develop' \
            '+refs/heads/master:refs/remotes/origin/master' || true
          for branch in origin/develop origin/master; do
            if git rev-parse --verify --quiet "$branch" >/dev/null &&
               git merge-base --is-ancestor HEAD "$branch"; then
              echo "Tagged commit is contained in $branch."
              exit 0
            fi
          done
          echo "::error::${TAG} points at a commit that is not contained in develop or master. Release only from a merged commit."
          exit 1
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - uses: ./.github/actions/setup

      # electron-builder names every artifact after package.json's version, NOT the tag,
      # so a mismatch silently ships "Trinity Setup 0.1.0.exe" for tag v0.3.0. The repo's
      # semver rule already says the version bump and the CHANGELOG land in one release
      # commit — this enforces it before anything is built.
      - name: Tag matches the package versions
        run: |
          tag="${TAG#v}"
          root=$(node -p "require('./package.json').version")
          desktop=$(node -p "require('./electron/package.json').version")
          if [ "$tag" != "$root" ] || [ "$tag" != "$desktop" ]; then
            echo "::error::Tag $TAG does not match package.json ($root) / electron/package.json ($desktop). Bump both in the release commit, then re-tag."
            exit 1
          fi
          echo "Version $tag agrees across the tag and both manifests."
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # The same gates ci.yml runs on a branch. Not redundant: a tag gets no ci.yml run,
      # and `pnpm build` in particular catches AOT-only failures (the `lib: es2018` trap)
      # that Vitest passes — far better here than three times over on 2x/10x-billed
      # macOS and Windows runners.
      - run: pnpm lint
      - run: pnpm stylelint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # No binary download to opt out of: Electron has had no postinstall since v42, and this
      # job never launches it (`pnpm -C electron test` is main-process unit tests only). The
      # `ELECTRON_SKIP_BINARY_DOWNLOAD=1` that used to sit here gated that postinstall, so it
      # had stopped doing anything at all.
      - run: pnpm -C electron install --frozen-lockfile
      - run: pnpm -C electron test

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    # Gates the signing secrets behind an environment. Until you configure required
    # reviewers on it in repo settings this is a no-op; once secrets exist it is what
    # stops a pushed tag from minting a signed installer unattended. The certificate is
    # the asset worth protecting: electron-builder runs repo-controlled hooks
    # (afterPack.cjs, build/notarize.cjs) in the same process that holds CSC_KEY_PASSWORD.
    environment: release
    # Without this the job inherits the 6-hour default on two platforms that have never
    # run, and a wedged @electron/get download would hold the release all day.
    timeout-minutes: 45
    strategy:
      # One platform's toolchain breaking should not deny you the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            flag: '--linux'
            assets: |
              electron/release/*.AppImage
              electron/release/*.deb
          # macos-latest is Apple Silicon, and electron-builder defaults to the host
          # architecture — this produces arm64 artifacts only, by choice.
          - os: macos-latest
            platform: mac
            flag: '--mac'
            assets: |
              electron/release/*.dmg
              electron/release/*.zip
          - os: windows-latest
            platform: win
            flag: '--win'
            assets: |
              electron/release/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup

      # The three steps `pnpm electron:build` would have run — minus its trailing
      # `electron:sign:dev`, which shells out to `codesign` against a local "trinity-dev"
      # identity. That exists on no runner and not at all off macOS.
      - run: pnpm build
      # Note: electron-builder does NOT package the npm-installed Electron binary — it
      # downloads its own dist through @electron/get, since electron-builder.yml sets no
      # electronDist. This install is for the devDependencies (electron-builder itself).
      - run: pnpm -C electron install --frozen-lockfile
      - run: pnpm -C electron run build

      - name: electron-builder ${{ matrix.flag }}
        working-directory: electron
        run: pnpm exec electron-builder ${{ matrix.flag }} --publish never
        env:
          # Signing is wired but optional: with no secrets set these resolve to empty and
          # the artifacts are simply unsigned. macOS auto-discovery is forced OFF in that
          # case so a stray keychain identity can't turn an unsigned build into a failing
          # one; add MAC_CSC_LINK (base64 of the .p12) and it flips back on by itself.
          #
          # The nested `|| ''` is load-bearing. `a && b || c` collapses to `c` whenever b
          # is empty, so the plain form would hand the *Windows* cert to the macOS build
          # the moment MAC_CSC_LINK was unset. electron-builder reads WIN_CSC_LINK on its
          # own for Windows, so CSC_LINK is scoped to macOS and empty everywhere else.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Notarization (macOS). build/notarize.cjs no-ops unless all three are present.
          # The App Store Connect API-key style it also supports needs APPLE_API_KEY to be
          # a path to a .p8 file, which a secret cannot be directly — hence the Apple ID
          # style here, whose three values are all plain strings.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trinity-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          # This is the whole recovery window if the draft step fails: long enough to
          # re-run the release job alone rather than the entire matrix.
          retention-days: 30
          # Artifacts are immutable per run, so a re-run without this dies with
          # "409 Conflict: an artifact with this name already exists".
          overwrite: true

  draft-release:
    name: Draft the release
    needs: package
    # NOT the default `success()`. A matrix job reports failure if ANY leg fails, even
    # with fail-fast off — so the default would skip this entirely when one platform
    # breaks, throwing away the installers that did build. That is the exact opposite of
    # what fail-fast: false is for. The missing-platform check below makes the gap loud.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that may write to the repo, and only to attach these artifacts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: trinity-*
          merge-multiple: true

      - name: Check which platforms landed
        run: |
          ls -lR artifacts || true
          missing=''
          ls artifacts/*.AppImage >/dev/null 2>&1 || missing="$missing linux"
          ls artifacts/*.dmg >/dev/null 2>&1 || missing="$missing mac"
          ls artifacts/*.exe >/dev/null 2>&1 || missing="$missing win"
          if [ -n "$missing" ]; then
            echo "::warning::No installer for:$missing — drafting a PARTIAL release. Re-run the workflow once fixed."
          fi
          if ! ls artifacts/* >/dev/null 2>&1; then
            echo "::error::Every platform failed; nothing to attach."
            exit 1
          fi

      # Left as a DRAFT on purpose: nothing is downloadable until you review the
      # artifacts and press publish. Re-running re-uploads into the same draft.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            false)
              # --clobber DELETES the existing assets before uploading. On a published
              # release that silently swaps what people already have — and electron-builder
              # output is not bit-reproducible, so even a same-commit rebuild differs.
              echo "::error::$TAG is already published. Refusing to replace its assets; cut a new version instead."
              exit 1
              ;;
            true)
              gh release upload "$TAG" artifacts/* --clobber
              ;;
            *)
              gh release create "$TAG" artifacts/* \
                --draft \
                --title "Trinity $TAG" \
                --notes "Desktop builds for $TAG. Artifacts are unsigned unless signing secrets were configured — see https://github.com/quwisky/trinity-matrix-client/blob/develop/docs/platforms/desktop.md"
              ;;
          esac

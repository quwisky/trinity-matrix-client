name: Verified production renderer
on:
  workflow_call:
    inputs:
      sha:
        description: Exact full commit SHA to build.
        required: true
        type: string
      artifact-name:
        description: Renderer artifact name containing caller run, attempt and full SHA.
        required: true
        type: string
      retention-days:
        required: true
        type: number
    outputs:
      artifact-id:
        value: ${{ jobs.renderer.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.renderer.outputs.artifact-name }}
      manifest-digest:
        value: ${{ jobs.renderer.outputs.manifest-digest }}
      sha:
        value: ${{ jobs.renderer.outputs.sha }}
permissions:
  contents: read
jobs:
  renderer:
    name: Build and verify renderer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRINITY_RENDERER_SHA: ${{ inputs.sha }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ inputs.artifact-name }}
      manifest-digest: ${{ steps.manifest.outputs.manifest-digest }}
      sha: ${{ steps.manifest.outputs.sha }}
    steps:
      # The calling event's commit, which ci.yml passes as inputs.sha; `assert-source` fails
      # unless HEAD equals it. No `ref:` input: CodeQL's cache-poisoning query reads a
      # caller-supplied ref as untrusted code on the weekly schedule run, although that run
      # skips this job and would build the default branch's own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate renderer request
        env:
          RENDERER_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: node scripts/renderer-artifact.mjs assert-source
      - run: pnpm nx build trinity --configuration=production --skipNxCache
      - id: manifest
        run: pnpm nx run scripts:record-renderer
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            www/
            dist/web-bundle-manifest.json
            dist/web-bundle-manifest.json.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - run: git diff --exit-code

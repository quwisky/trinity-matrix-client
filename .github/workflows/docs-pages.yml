name: Documentation Pages

on:
  push:
    branches: [main]
  # A published stable release re-runs this workflow on main (the only branch Pages
  # accepts) so the user guide moves to that release.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  redeploy:
    name: Redeploy for the published release
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs-pages.yml --ref main

  build:
    name: Build documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: pnpm format:check
      - run: pnpm nx test scripts
      - run: pnpm nx test docs-site
      # The developer guide always deploys from main. Between a stable release PR's
      # back-merge and publishing that release, the user guide names a draft version, so
      # build it from the newest commit whose version is published.
      - name: Use the user guide of the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=HEAD
          while :; do
            version=$(git show "$ref:apps/docs-users/release.json" | jq -r .version)
            [ "$(gh release view "v$version" --json isDraft -q .isDraft 2>/dev/null)" = false ] && break
            echo "::notice::v$version is not published; building the user guide from before it."
            ref="$(git log -1 --format=%H "$ref" -- apps/docs-users/release.json)^"
          done
          if [ "$ref" != HEAD ]; then
            rm -rf apps/docs-users
            git checkout "$ref" -- apps/docs-users
          fi
      - run: pnpm nx run docs-site:check
      - run: pnpm nx run docs-site:assemble
      - run: pnpm nx run docs-site:e2e
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs-site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

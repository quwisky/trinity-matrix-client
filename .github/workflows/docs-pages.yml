name: Documentation Pages

on:
  push:
    branches: [develop]
  # The user guide waits for its release to be published. Pages only accepts develop,
  # so a published stable release re-runs this workflow there.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  redeploy:
    name: Redeploy for the published release
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs-pages.yml --ref develop

  build:
    name: Build documentation
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Between a stable release PR's back-merge and publishing the release, develop's
      # user guide names a draft version: build and check, but keep the live site.
      - name: Check the user guide release is published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version apps/docs-users/release.json)
          if [ "$(gh release view "v$version" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
            echo publish=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$version is not published yet; deploying after its release is published."
            echo publish=false >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: pnpm format:check
      - run: pnpm nx test scripts
      - run: pnpm nx test docs-site
      - run: pnpm nx run docs-site:check
      - run: pnpm nx run docs-site:assemble
      - run: pnpm nx run docs-site:e2e
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs-site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/develop' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

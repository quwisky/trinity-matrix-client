name: Prepare Playwright browsers
description: Restore cached browser downloads and optionally install browsers and host libraries.
inputs:
  browsers:
    description: Space-separated Playwright browser names.
    default: chromium webkit
  install:
    description: Set false when the prerequisite helper owns concurrent installation.
    default: 'true'
  with-deps:
    description: Set false to skip the host-library install (Chromium on the hosted Ubuntu image).
    default: 'true'
runs:
  using: composite
  steps:
    # Playwright's --with-deps downloads about 115 MB of host packages with apt, and a slow
    # mirror timed that install out. Keep the .debs in a user-owned directory that
    # actions/cache can save. The hosted image has no docker-clean, but pin the keep anyway.
    - id: apt
      if: runner.os == 'Linux' && inputs.with-deps == 'true'
      shell: bash
      run: |
        archives="$HOME/.cache/apt-archives"
        mkdir -p "$archives/partial"
        # apt downloads as the sandbox user _apt, which must be able to write partial/.
        sudo chown _apt "$archives/partial"
        printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$archives" |
          sudo tee /etc/apt/apt.conf.d/99trinity-archives > /dev/null
        echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
    # Keys follow the Playwright version, not the whole lockfile, so an unrelated dependency
    # update reuses the same entries. Only `main` saves (save-playwright); other refs restore.
    - id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    # Only the .debs are cached: partial/ belongs to _apt and lock is root-only, so tar
    # cannot read either. One entry is saved, for the default `chromium webkit` set; the other
    # sets restore it through the prefix and apt downloads only what it lacks.
    - if: runner.os == 'Linux' && inputs.with-deps == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives/*.deb
        key: apt-${{ runner.os }}-${{ steps.apt.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
        restore-keys: apt-${{ runner.os }}-${{ steps.apt.outputs.image }}-${{ steps.playwright.outputs.version }}-
    # One entry per browser, so each is stored once whatever set a job asks for. Firefox is
    # not cached: only the pull-request scrollbar check and the weekly scheduled run use it.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright/chromium-*
          ~/.cache/ms-playwright/chromium_headless_shell-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
    - if: contains(inputs.browsers, 'webkit')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright/webkit-*
        key: playwright-${{ runner.os }}-webkit-${{ steps.playwright.outputs.version }}
    - if: inputs.install == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
        WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        flags=()
        if [ "$WITH_DEPS" = true ]; then flags=(--with-deps); fi
        # A stalled mirror made this step hang for tens of minutes: bound each attempt, retry once.
        for attempt in 1 2; do
          rc=0
          timeout -k 10 360 pnpm exec playwright install "${flags[@]}" "${browsers[@]}" || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$attempt" -eq 1 ]; then
            echo "::warning::playwright install attempt 1 failed (rc=$rc); retrying"
          fi
        done
        exit "$rc"
    # When install is false the job installs later (scripts/ci-prerequisites.mjs) and calls
    # save-playwright itself after that.
    - if: inputs.install == 'true'
      uses: ./.github/actions/save-playwright
      with:
        browsers: ${{ inputs.browsers }}
        with-deps: ${{ inputs.with-deps }}

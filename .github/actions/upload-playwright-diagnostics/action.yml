name: Upload Playwright diagnostics
description: >-
  Require report output from a started suite and retain hidden diagnostic files. A redaction or
  report failure withholds what was not verified and fails the job at its final step, so the
  job's later suites still run.
inputs:
  surface:
    description: Suite surface used in the immutable artifact name.
    required: true
  shard:
    description: Matrix shard identity.
    default: all
  report-path:
    description: Registry-owned report paths or globs, separated by newlines.
    required: true
runs:
  using: composite
  steps:
    # Android diagnostics never publish a raw Matrix Room or event identifier.
    # The redaction also covers the shared dist/.ci logs this upload includes.
    # Verification failures continue so later suites still run; the deferral
    # step below records them and the job's final step fails the job.
    - name: Redact Matrix identifiers from Android diagnostics
      id: matrix-identifiers
      if: ${{ inputs.surface == 'android' || startsWith(inputs.surface, 'android-') }}
      continue-on-error: true
      shell: bash
      env:
        CI_REPORT_PATH: ${{ inputs.report-path }}
      run: node scripts/ci-matrix-identifiers.mjs
    # Every other surface keeps Room and event ids for debugging but never publishes
    # a Matrix credential or test-account password, inside blob, HTML and trace archives too.
    - name: Redact Matrix credentials from diagnostics
      id: matrix-credentials
      if: ${{ inputs.surface != 'android' && !startsWith(inputs.surface, 'android-') }}
      continue-on-error: true
      shell: bash
      env:
        CI_REPORT_PATH: ${{ inputs.report-path }}
      run: node scripts/ci-matrix-credentials.mjs
    - name: Require suite diagnostics
      id: reports
      continue-on-error: true
      shell: bash
      env:
        CI_REPORT_PATH: ${{ inputs.report-path }}
      run: node scripts/ci-diagnostics.mjs
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      # Still retain process logs if report validation failed during startup/timeout,
      # but never diagnostics the identifier or credential redaction did not verify.
      if: ${{ !cancelled() && (steps.matrix-identifiers.outputs.verified == 'true' || steps.matrix-credentials.outputs.verified == 'true') }}
      with:
        name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ github.job }}-${{ inputs.surface }}-${{ inputs.shard }}
        path: |
          ${{ inputs.report-path }}
          dist/.ci/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - name: Defer unverified diagnostics to the end of the job
      if: ${{ !cancelled() && (steps.matrix-identifiers.outcome == 'failure' || steps.matrix-credentials.outcome == 'failure' || steps.reports.outcome == 'failure') }}
      shell: bash
      env:
        SURFACE: ${{ inputs.surface }}
        SHARD: ${{ inputs.shard }}
      run: |
        echo "::error title=Diagnostics not verified::${SURFACE} (shard ${SHARD}): redaction or report verification failed; unverified files were withheld."
        echo "TRINITY_UNVERIFIED_DIAGNOSTICS=${TRINITY_UNVERIFIED_DIAGNOSTICS:+${TRINITY_UNVERIFIED_DIAGNOSTICS},}${SURFACE}/${SHARD}" >> "$GITHUB_ENV"

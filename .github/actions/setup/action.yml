name: Set up the workspace
description: The .nvmrc Node, the pinned pnpm, and installed dependencies.

# Shared by every job in ci.yml and release.yml. Jobs run in parallel on separate
# runners, so each one repeats this; the pnpm store cache is what keeps that cheap.
#
# Actions are pinned to commit SHAs, not tags. A tag is mutable — `pnpm/action-setup@v6`
# has been re-pointed repeatedly in normal maintenance — and the same pin installs the
# pnpm binary that runs electron-builder with the signing certificates in its
# environment (release.yml). Retargeting one tag is exactly how CVE-2025-30066 reached
# ~23k repositories. Renovate (.github/renovate.json) keeps the pins current — it updates
# the digest behind each tag rather than letting the pin quietly rot.
runs:
  using: composite
  steps:
    # Before setup-node, so pnpm (the version in package.json's `packageManager` field) is on
    # PATH for the store steps below. Passing a `version:` input as well is an error, not an
    # override.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # .nvmrc tracks the supported Node 24 line, while package.json's engines enforce
        # the ^24.15.0 floor. Using the file keeps CI, nvm and fnm on the latest available
        # Node 24 maintenance release without duplicating the version declaration here.
        node-version-file: .nvmrc
        # The pnpm store is cached below instead: setup-node's own cache saves from every
        # ref, so each pull request kept a private copy of the store.
        package-manager-cache: false

    # Only `main` saves the store; every other ref restores main's entry (GitHub lets any
    # branch read the default branch's caches). The key covers the root lockfile only:
    # electron/ is installed later and separately (`pnpm electron:install`), after the save,
    # so its packages are never in the entry. Saved right after the install, when the store
    # holds exactly what the root install needed plus whatever an older entry carried.
    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - id: pnpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    # --frozen-lockfile fails when pnpm-lock.yaml is out of sync with package.json, so a
    # dependency edit committed without its lockfile change is caught here rather than
    # by a mystery version drift later.
    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

# NOTE: there is deliberately no actions/cache step for Nx.
#
# Caching `.nx/cache` does nothing on ephemeral runners: Nx 23 keeps the hash-to-result
# INDEX in a SQLite database under .nx/workspace-data (not .nx/cache), and that database
# is keyed by machine ID — so a restored cache directory yields a 0% hit rate, measured,
# while still paying the upload and download. Caching both directories was tried and is
# not sound for the same machine-ID reason. The supported answer for ephemeral runners is
# a remote cache (Nx Cloud or a self-hosted equivalent), which this repo does not use.

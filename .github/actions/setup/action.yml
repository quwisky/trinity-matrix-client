name: Set up the workspace
description: Node 24, the pinned pnpm, and installed dependencies.

# Shared by every job in ci.yml and release.yml. Jobs run in parallel on separate
# runners, so each one repeats this; the pnpm store cache is what keeps that cheap.
#
# Actions are pinned to commit SHAs, not tags. A tag is mutable — `pnpm/action-setup@v6`
# has been re-pointed repeatedly in normal maintenance — and this action installs the
# pnpm binary that later runs electron-builder with the signing certificates in its
# environment (release.yml). Retargeting one tag is exactly how CVE-2025-30066 reached
# ~23k repositories. Renovate (.github/renovate.json) keeps the pins current — it updates
# the digest behind each tag rather than letting the pin quietly rot.
runs:
  using: composite
  steps:
    # Must come BEFORE setup-node: its `cache: pnpm` resolves the store path by shelling
    # out to pnpm, which is not on the runner yet. The version comes from package.json's
    # `packageManager` field (pnpm@11.15.1) — passing a `version:` input as well is an
    # error, not an override.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        # electron/ is a second pnpm project with its own lockfile. Both share one
        # global store, so its packages land in the cache either way — but without
        # this the cache key ignores electron/pnpm-lock.yaml, so a change there hits
        # the primary key exactly, skips the save, and re-downloads its delta forever.
        cache-dependency-path: |
          pnpm-lock.yaml
          electron/pnpm-lock.yaml

    # --frozen-lockfile fails when pnpm-lock.yaml is out of sync with package.json, so a
    # dependency edit committed without its lockfile change is caught here rather than
    # by a mystery version drift later.
    - run: pnpm install --frozen-lockfile
      shell: bash

# NOTE: there is deliberately no actions/cache step for Nx.
#
# Caching `.nx/cache` does nothing on ephemeral runners: Nx 23 keeps the hash-to-result
# INDEX in a SQLite database under .nx/workspace-data (not .nx/cache), and that database
# is keyed by machine ID — so a restored cache directory yields a 0% hit rate, measured,
# while still paying the upload and download. Caching both directories was tried and is
# not sound for the same machine-ID reason. The supported answer for ephemeral runners is
# a remote cache (Nx Cloud or a self-hosted equivalent), which this repo does not use.

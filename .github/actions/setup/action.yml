name: Set up the workspace
description: The .nvmrc Node, the pinned pnpm, and installed dependencies.

# Shared by every job in ci.yml and release.yml. Jobs run in parallel on separate
# runners, so each one repeats this; installing from the registry takes under a minute.
#
# Actions are pinned to commit SHAs, not tags. A tag is mutable — `pnpm/action-setup@v6`
# has been re-pointed repeatedly in normal maintenance — and the same pin installs the
# pnpm binary that runs electron-builder with the signing certificates in its
# environment (release.yml). Retargeting one tag is exactly how CVE-2025-30066 reached
# ~23k repositories. Renovate (.github/renovate.json) keeps the pins current — it updates
# the digest behind each tag rather than letting the pin quietly rot.
runs:
  using: composite
  steps:
    # Before setup-node. The version comes from package.json's `packageManager` field;
    # passing a `version:` input as well is an error, not an override.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # .nvmrc tracks the supported Node 24 line, while package.json's engines enforce
        # the ^24.22.1 floor. Using the file keeps CI, nvm and fnm on the latest available
        # Node 24 maintenance release without duplicating the version declaration here.
        node-version-file: .nvmrc
        # The pnpm store is deliberately not cached. Measured on hosted runners, a full
        # download took as long as restoring setup-node's cache (13-19 s on Linux, 36 s on
        # macOS, 50 s on Windows, against 17-18, 44 and 45 s with a hit), while the entries
        # took about 1 GB of the repository's 10 GB budget and setup-node saved one from every
        # ref. `false` keeps setup-node from caching it implicitly.
        package-manager-cache: false

    # --frozen-lockfile fails when pnpm-lock.yaml is out of sync with package.json, so a
    # dependency edit committed without its lockfile change is caught here rather than
    # by a mystery version drift later.
    - run: pnpm install --frozen-lockfile
      shell: bash

# NOTE: there is deliberately no actions/cache step for Nx.
#
# Caching `.nx/cache` does nothing on ephemeral runners: Nx 23 keeps the hash-to-result
# INDEX in a SQLite database under .nx/workspace-data (not .nx/cache), and that database
# is keyed by machine ID — so a restored cache directory yields a 0% hit rate, measured,
# while still paying the upload and download. Caching both directories was tried and is
# not sound for the same machine-ID reason. The supported answer for ephemeral runners is
# a remote cache (Nx Cloud or a self-hosted equivalent), which this repo does not use.

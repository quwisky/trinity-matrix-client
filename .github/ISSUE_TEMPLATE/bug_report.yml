name: Bug report
description: Something in Trinity behaves incorrectly
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Before you paste anything:** Trinity is an end-to-end encrypted client, and its
        logs can contain access tokens, recovery keys and message content. Redact them.
        Report suspected security vulnerabilities privately to [quwisky@qwky.eu](mailto:quwisky@qwky.eu).
        Ordinary encryption, verification and sign-in bugs can use this form.
        Search [existing issues](https://github.com/quwisky/trinity-matrix-client/issues)
        first and add new information to a matching report.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe what you actually observed, including any error message.
      placeholder: |
        Editing a message a second time replaced the wrong version.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the result you expected. Say "unknown" if you are unsure.
      placeholder: The latest edited text should appear in the room.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Include the starting state (for example, already signed in) and the actions
        before the problem. If you cannot reproduce it reliably, say so and describe
        what you remember; "unknown" is fine for steps you do not know.
      placeholder: |
        1. Sign in to matrix.org
        2. Open an encrypted room
        3. Send "hello", then edit it twice
        4. Click "(edited)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Affected platforms
      description: Select only where you observed the problem. Choose Unknown if you cannot tell.
      multiple: true
      options:
        - Web (browser)
        - Desktop (Electron)
        - Android
        - iOS
        - Unknown
    validations:
      required: true

  - type: textarea
    id: os
    attributes:
      label: Environment
      description: |
        For each affected platform, give the OS, browser (for Web), and device if relevant.
        Include how you installed or launched Trinity if known. Write "unknown" for missing details.
      placeholder: Desktop (Electron), Fedora 42, AppImage; Web, Firefox 141 on Fedora 42
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Trinity version
      description: Copy the version and commit from Settings if available. Write "unknown" if you cannot access them.
      placeholder: Trinity v0.1.0 · ae36459
    validations:
      required: true

  - type: dropdown
    id: encrypted
    attributes:
      label: Was the room encrypted?
      description: Optional. Include this if the problem involves a room.
      options:
        - 'Yes'
        - 'No'
        - Not sure
        - Not applicable (not about a room)
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Optional. Choose an area if you know where the problem belongs.
      options:
        - Timeline and messages
        - Composer (sending, editing, attachments)
        - Encryption, verification and recovery
        - Sign-in, SSO or session
        - Rooms, spaces and invites
        - Notifications and push
        - Search
        - Settings and appearance
        - Desktop app (window, tray, deep links)
        - Something else / not sure
    validations:
      required: false

  - type: input
    id: homeserver
    attributes:
      label: Homeserver
      description: Optional. The server implementation and version matter for anything protocol-related.
      placeholder: matrix.org · or · Synapse 1.119 (self-hosted)

  - type: textarea
    id: logs
    attributes:
      label: Console output or errors
      description: |
        Browser devtools console, or the terminal for the desktop app. Rendered as a code
        block, so no backticks needed.
        **Redact access tokens, recovery keys and anything you would not post publicly.**
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Other observations
      description: Optional. How often does it happen? Did it work in an earlier version? Include any checks you actually tried and their results; no diagnosis is required.

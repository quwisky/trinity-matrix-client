name: Feature request
description: Suggest a capability Trinity does not have yet
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/quwisky/trinity-matrix-client/issues)
        first. If a request already describes your problem, add new context there.
        You do not need a technical solution or roadmap knowledge to suggest an improvement.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not the solution. What were you trying to do, and what got in the way?
      placeholder: I can't tell which of my devices sent a message, so I can't spot a session I don't recognise.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What would you like to happen?
      description: Describe what you would be able to do if the problem were solved, without needing to design the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. If you have an approach in mind, describe it here.

  - type: input
    id: prior_art
    attributes:
      label: Does another Matrix client do this?
      description: Optional. Link an example or describe an alternative you have tried.
      placeholder: Element Web calls it "Threads"; FluffyChat does X instead

  - type: checkboxes
    id: platforms
    attributes:
      label: Which platforms does this apply to?
      description: Trinity builds from one codebase for all four, but some ideas only make sense on some of them.
      options:
        - label: Web (browser)
        - label: Desktop (Electron)
        - label: Android
        - label: iOS

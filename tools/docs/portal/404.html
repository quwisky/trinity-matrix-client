<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Trinity documentation</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: oklch(18% 0.025 278deg);
        color: oklch(96% 0.012 278deg);
      }

      body {
        display: grid;
        min-block-size: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
      }

      main {
        max-inline-size: 42rem;
      }

      p {
        color: oklch(78% 0.025 278deg);
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
      }

      a {
        color: oklch(79% 0.14 278deg);
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 0.2rem solid currentColor;
        outline-offset: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        This address is not part of the current Trinity documentation. Choose a
        documentation home to continue.
      </p>
      <nav aria-label="Documentation homes">
        <a href="/trinity-matrix-client/">Documentation home</a>
        <a href="/trinity-matrix-client/users/">User guide</a>
        <a href="/trinity-matrix-client/developers/">Developer guide</a>
      </nav>
    </main>
  </body>
</html>

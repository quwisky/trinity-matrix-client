disallowed-methods = [
  { path = "matrix_sdk::encryption::recovery::Recovery::reset_identity", reason = "Never call it: it deletes the key backup and secret storage in its own order. Reset with reset_cross_signing and its CrossSigningResetHandle, ordered by TypeScript." },
  { path = "matrix_sdk::encryption::recovery::Recovery::recover_and_fix_backup", reason = "Never call it: it can create a new key backup. Call open_secret_store, then import_secrets." },
  { path = "matrix_sdk::Account::change_password", reason = "Never call it: it logs the other devices out. Send the raw change_password::v3 request with logout_devices: false." },
  { path = "std::time::SystemTime::now", reason = "It panics on wasm: take now from ruma's MilliSecondsSinceUnixEpoch::now()." },
  { path = "matrix_sdk::encryption::dehydrated_devices::DehydratedDevices::delete", reason = "Never call it: it succeeds when there is no device. Send the raw request, which fails then." },
]

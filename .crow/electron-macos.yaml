# macOS Electron build (.dmg + .zip), produced on tags.
#
# electron-builder can ONLY build macOS targets on macOS, so this is a separate
# workflow routed to a macOS runner via the `os: macos` label — a Crow agent must be
# connected on a Mac advertising that label (e.g. CROW_AGENT_LABELS="os=macos").
# Runner needs Node 22+ + corepack (bundled with Node). No container `image:` —
# macOS agents use the local backend and run commands directly on the host.
#
# Signing/notarization: this does an UNSIGNED dev build (no Developer ID cert / no
# notarization creds). For a shippable, notification-capable artifact, switch the build
# command to `pnpm electron:package:mac:signed` and provide a Developer ID cert +
# notarization creds as Crow secrets, wired into `environment:` below (see
# docs/DEVELOPMENT.md → "macOS signing & notarization").
when:
  - event: tag

labels:
  os: macos

steps:
  package-macos:
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # --- Signed + notarized build (enable once these secrets are defined) ---
      # Signing identity (Developer ID Application cert as base64/path .p12):
      # CSC_LINK:
      #   from_secret: macos_csc_link
      # CSC_KEY_PASSWORD:
      #   from_secret: macos_csc_key_password
      # Notarization — App Store Connect API key (preferred):
      # APPLE_API_KEY:
      #   from_secret: apple_api_key        # path to the .p8 staged on the runner
      # APPLE_API_KEY_ID:
      #   from_secret: apple_api_key_id
      # APPLE_API_ISSUER:
      #   from_secret: apple_api_issuer
      # …or notarization — Apple ID:
      # APPLE_ID:
      #   from_secret: apple_id
      # APPLE_APP_SPECIFIC_PASSWORD:
      #   from_secret: apple_app_specific_password
      # APPLE_TEAM_ID:
      #   from_secret: apple_team_id
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm electron:install
      - pnpm electron:package:mac # unsigned dev build → electron/release/*.dmg, *.zip
      # Signed + notarized (swap the line above for this once secrets are wired):
      # - pnpm electron:package:mac:signed

# pnpm workspace root.
#
# Trinity is an Nx *integrated* monorepo: the deployable app plus every reusable lib
# are one project, driven by a single root `package.json` and wired together through
# `@trinity/*` TypeScript path aliases (`tsconfig.base.json`) — not pnpm workspace
# linking. So there are no pnpm sub-packages to install/symlink here:
#
#   - `libs/spartan/*` carry a `package.json` (name `@trinity/helm/*`) only for the
#     `@spartan-ng/cli` generator; they are consumed via the path aliases above.
#   - `electron/` (name `trinity-desktop`) is a standalone app with its own dependency
#     tree, installed separately via `pnpm electron:install` — intentionally not a member.
#
# Keeping `packages` empty declares the workspace root explicitly (so pnpm never walks
# up to a parent dir) while leaving the single-project install exactly as it is.
packages: []
minimumReleaseAge: 1440

# Which dependencies may run install/build scripts. pnpm 11 removed
# `pnpm.onlyBuiltDependencies` (the old allowlist, formerly in package.json) in favour
# of `allowBuilds` — an explicit name → boolean map, with `strictDepBuilds` defaulting
# to true so any build-script dep left off this map fails the install. The six `true`
# entries are the previous allowlist; `less` (a transitive build-script dep) was never
# allowed, so it stays off — blocked here explicitly, since strict mode would otherwise
# error rather than silently skip it as pnpm 10 did.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  less: false
  # WDIO transitively includes other engines; Chromium-only coverage never installs them.
  edgedriver: false
  geckodriver: false

patchedDependencies:
  '@capacitor/browser@8.0.4': patches/@capacitor__browser@8.0.4.patch
  '@spartan-ng/brain@1.3.0': patches/@spartan-ng__brain@1.3.0.patch
  matrix-widget-api@1.17.0: patches/matrix-widget-api@1.17.0.patch

# pnpm workspace root.
#
# Trinity is an Nx *integrated* monorepo: the deployable app plus every reusable lib
# are one project, driven by a single root `package.json` and wired together through
# `@trinity/*` TypeScript path aliases (`tsconfig.base.json`) — not pnpm workspace
# linking. Native Capacitor plugins are the one exception:
#
#   - `libs/native/capacitor-push` (name `@trinity/capacitor-push`) is a member because
#     the Capacitor CLI discovers plugins only as installed dependencies. The root
#     `package.json` depends on it with `workspace:*`, `pnpm install` links it into
#     `node_modules`, and `cap sync` wires its Android module and Swift package into the
#     hosts. Its TypeScript is still imported through its `@trinity/*` alias, and it
#     declares no dependencies, so it adds nothing to the install tree.
#   - `libs/spartan/*` carry a `package.json` (name `@trinity/helm/*`) only for the
#     `@spartan-ng/cli` generator; they are consumed via the path aliases above.
#   - `electron/` (name `trinity-desktop`) is a standalone app with its own dependency
#     tree, installed separately via `pnpm electron:install` — intentionally not a member.
#
# Listing the members explicitly also declares the workspace root (so pnpm never walks up
# to a parent dir); every other library stays out of `packages`.
packages:
  - libs/native/capacitor-push
minimumReleaseAge: 1440

# Which dependencies may run install/build scripts. pnpm 11 removed
# `pnpm.onlyBuiltDependencies` (the old allowlist, formerly in package.json) in favour
# of `allowBuilds` — an explicit name → boolean map, with `strictDepBuilds` defaulting
# to true so any build-script dep left off this map fails the install. The six `true`
# entries are the previous allowlist; `less` (a transitive build-script dep) was never
# allowed, so it stays off — blocked here explicitly, since strict mode would otherwise
# error rather than silently skip it as pnpm 10 did.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  less: false
  appium: false
  edgedriver: false
  geckodriver: false

patchedDependencies:
  '@spartan-ng/brain@1.5.0': patches/@spartan-ng__brain@1.5.0.patch
  matrix-js-sdk@43.0.0: patches/matrix-js-sdk@43.0.0.patch
  matrix-widget-api@1.20.0: patches/matrix-widget-api@1.20.0.patch
  pagefind@1.5.2: patches/pagefind@1.5.2.patch
minimumReleaseAgeExclude:
  # Renovate security update: @angular/common@22.1.5
  - '@angular/common@22.1.5'
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

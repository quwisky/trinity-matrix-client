<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trinity</title>

    <!-- This must precede Angular's injected stylesheet link so every host sees one order. -->
    <style data-trn-cascade-contract>
      @layer theme, base, vendor, components, utilities, overrides;
    </style>

    <!--
      Content-Security-Policy backstop behind the explicit message-HTML
      sanitization. The homeserver is user-chosen at login, so connect/media
      can't be pinned to a fixed host — they're scoped to https/wss (not *), which
      still blocks http:/data: exfiltration. img-src omits https: on purpose: the
      app never binds a remote <img> — avatars and media are fetched over
      connect-src and bound as blob: (see Avatar/MediaService), and the sanitizer
      strips remote <img src> from message HTML, so allowing https: images would
      only re-open the tracking-pixel/IP-leak vector. connect-src allows blob: so a
      saved file can be read back from the URL the media engine minted; a blob:
      URL only names bytes this origin created. 'wasm-unsafe-eval' is
      required by the Rust crypto WASM; 'unsafe-inline' style is required by the
      runtime <style> injection from Angular component styles + the CDK overlay /
      spartan helm layer. Clickjacking (frame-ancestors) must be set as a
      real response header at the host — it is ignored in a <meta> CSP.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src https:"
    />

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg" />
    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- Install metadata for the web build; Capacitor and Electron wrap this same index.html
         and ignore it. Manifest icon `src`s resolve against the manifest URL, served from the
         app root alongside index.html. -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- add to homescreen for ios (iOS reads the apple-touch-icon, not the manifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
  </head>

  <body>
    <!--
      The first paint, before any Angular code has run. Angular clears this when the root
      component renders. No script is involved: the CSP above allows 'unsafe-inline' for
      STYLE but not for script, so a splash torn down by an inline script could not exist.

      Colours come from `prefers-color-scheme`, not the app's theme tokens: the tokens live in
      a stylesheet the app owns, and the chosen Theme is in storage this document cannot read
      without script. The default preference is `system`, so this matches everyone who has
      not overridden it.

      Anyone who has (dark on a light OS, or the reverse) sees the wrong colour for the whole
      pre-bootstrap window, seconds on a slow cold start. That is a deliberate trade:
      reading the stored preference needs script, which the CSP allows none of inline
      (`boot-splash.spec.mjs` pins that). Keying the light rule on `:root:not(.dark)` would
      match before the Appearance document effect stamps anything and flash white at every
      system-dark user; a marker stamped during Application Runtime startup only covers the
      app-initializer-to-root-render window, not the part that hurts. A splash that is
      occasionally the wrong colour beats a blank screen.

      The values are duplicated from Theme Foundation's `--background` / `--trinity-text`
      defaults on purpose: a stylesheet import would be another request to wait for.
    -->
    <style data-trn-boot-style>
      @layer components {
        .trn-boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: oklch(99% 0.004 85deg);
          color: oklch(32% 0.012 60deg);
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
        }

        @media (prefers-color-scheme: dark) {
          .trn-boot {
            background: oklch(20% 0.005 269deg);
            color: oklch(90% 0.004 269deg);
          }
        }

        .trn-boot__mark {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.04em;
        }

        .trn-boot__hint {
          font-size: 13px;
          opacity: 0.7;
        }

        /* Opt IN to motion rather than out of it: this markup paints before the app's
         stylesheet, so it cannot rely on the reduced-motion reset in global.scss. */
        @media (prefers-reduced-motion: no-preference) {
          .trn-boot__mark {
            animation: trn-boot-pulse 1.6s ease-in-out infinite;
          }

          @keyframes trn-boot-pulse {
            0%,
            100% {
              opacity: 1;
            }

            50% {
              opacity: 0.55;
            }
          }
        }
      }
    </style>

    <trn-root>
      <div class="trn-boot" role="status" aria-live="polite">
        <span class="trn-boot__mark">TRINITY</span>
        <span class="trn-boot__hint">Starting up…</span>
      </div>
    </trn-root>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trinity</title>

    <!-- This must precede Angular's injected stylesheet link so every host sees one order. -->
    <style data-trn-cascade-contract>
      @layer theme, base, vendor, components, utilities, overrides;
    </style>

    <!--
      Content-Security-Policy backstop behind the explicit message-HTML
      sanitization. The homeserver is user-chosen at login, so connect/media
      can't be pinned to a fixed host — they're scoped to https/wss (not *), which
      still blocks http:/data: exfiltration. img-src omits https: on purpose: the
      app never binds a remote <img> — avatars and media are fetched over
      connect-src and bound as blob: (see Avatar/MediaService), and the sanitizer
      strips remote <img src> from message HTML, so allowing https: images would
      only re-open the tracking-pixel/IP-leak vector. 'wasm-unsafe-eval' is
      required by the Rust crypto WASM; 'unsafe-inline' style is required by the
      runtime <style> injection from Angular component styles + the CDK overlay /
      spartan helm layer. Clickjacking (frame-ancestors) must be set as a
      real response header at the host — it is ignored in a <meta> CSP.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src https:"
    />

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- Install metadata for the web build. Native (Capacitor) and desktop (Electron)
         wrap this same index.html and ignore both: they ship their own icons and are
         already installed. Icon `src`s inside the manifest resolve against the manifest
         URL, which is served from the app root alongside index.html. -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- add to homescreen for ios (iOS reads the apple-touch-icon, not the manifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
  </head>

  <body>
    <!--
      The first paint, before a single byte of Angular has run.

      Everything inside <trn-root> is the browser's to show until the root component
      renders, at which point Angular clears the host element and this is gone. No script is
      involved, which matters: the CSP above allows 'unsafe-inline' for STYLE but not for
      script, so a splash that had to be torn down by an inline script could not exist here.

      Colours come from `prefers-color-scheme` rather than from the app's theme tokens,
      because the tokens live in a stylesheet the app owns and the user's chosen Theme is
      in storage this document cannot read without script. The default preference IS
      `system` (see Appearance preferences), so this matches for everyone who has not overridden it.

      For those who HAVE overridden it — dark chosen on a light OS, or the reverse — this
      paints the wrong colour for the whole pre-bootstrap window: HTML paint until Angular's
      root component renders, which on a cold start on a slow phone is not a frame but
      seconds. That is not fixable from here and is a deliberate trade. Reading the stored
      preference needs script, the CSP above allows none inline (`boot-splash.spec.mjs` pins
      that), and the alternatives are worse: keying the light rule on `:root:not(.dark)`
      would match BEFORE the Appearance document effect has stamped anything and so hand every system-dark
      user a white flash, while a marker stamped during Application Runtime startup covers the window
      from app-initializer to root render — tens of milliseconds, and not the part that
      hurts. A splash that is occasionally the wrong colour beats a blank screen, which is
      what this replaced.

      The values are duplicated from Theme Foundation's `--background` /
      `--trinity-text` defaults on purpose — a stylesheet import would be another request to
      wait for, which defeats the point of painting early.
    -->
    <style data-trn-boot-style>
      @layer components {
        .trn-boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: oklch(99% 0.004 265deg);
          color: oklch(30% 0.018 265deg);
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
        }

        @media (prefers-color-scheme: dark) {
          .trn-boot {
            background: oklch(28% 0.016 265deg);
            color: oklch(90% 0.012 265deg);
          }
        }

        .trn-boot__mark {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.04em;
        }

        .trn-boot__hint {
          font-size: 13px;
          opacity: 0.7;
        }

        /* Opt IN to motion rather than out of it: this markup paints before the app's
         stylesheet, so it cannot rely on the reduced-motion reset in global.scss. */
        @media (prefers-reduced-motion: no-preference) {
          .trn-boot__mark {
            animation: trn-boot-pulse 1.6s ease-in-out infinite;
          }

          @keyframes trn-boot-pulse {
            0%,
            100% {
              opacity: 1;
            }

            50% {
              opacity: 0.55;
            }
          }
        }
      }
    </style>

    <trn-root>
      <div class="trn-boot" role="status" aria-live="polite">
        <span class="trn-boot__mark">TRINITY</span>
        <span class="trn-boot__hint">Starting up…</span>
      </div>
    </trn-root>
  </body>
</html>

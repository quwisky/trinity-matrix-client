# Standalone pnpm workspace root for the hand-rolled Electron desktop shell.
#
# This marks electron/ as its OWN pnpm project (its own pnpm-lock.yaml + node_modules)
# so `pnpm -C electron install` resolves here instead of walking up to the repo-root
# pnpm-workspace.yaml. The shell is deliberately not part of the Nx app/libs graph and
# is installed separately (`pnpm electron:install`); without this file the root
# workspace swallows it and its node_modules (incl. the `electron` types tsc needs)
# never get installed.
packages: []
minimumReleaseAge: 1440

# pnpm 11's `strictDepBuilds` defaults to true, so a transitive dep with an install
# script that is neither allowed nor blocked fails the install. `electron-winstaller`
# (pulled in by electron-builder for Windows/Squirrel packaging) has one, and pnpm 10
# never allowlisted it — it was silently skipped, and packaging still worked. Keep that:
# block it explicitly so the install stays clean instead of erroring.
allowBuilds:
  electron-winstaller: false
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

# electron-updater, add a `publish` block (e.g. provider: github / generic) and
# integrate autoUpdater in the main process. Never ship an unsigned update
# channel — updates must be served over https from a signed artifact.
# publish:
#   provider: github
#   owner: <owner>
#   repo: <repo>

# electron-builder configuration for the Trinity desktop app.
# Declarative + reproducible. Run from electron/ via `pnpm run package`.
#
# IMPORTANT: this packages the compiled main/preload (dist/) plus the copied
# Angular web build (www/). Run `pnpm run build` in this folder first (the root
# `electron:package` script chains the web build + copy + compile for you).
appId: eu.qwky.trinity
productName: Trinity
copyright: Copyright © 2026 Trinity

# Source files that go INTO the app bundle (relative to electron/).
# We have no production npm dependencies, so node_modules is intentionally absent.
files:
  - dist/**/*
  - www/**/*
  - package.json
  - '!**/*.map'

asar: true

# Harden the packaged binary's fuses (disable RUN_AS_NODE / NODE_OPTIONS / --inspect,
# and pin the app to the asar above) so a local process can't re-launch the signed app
# as Node — or swap in its own app/ directory — to inject code into the
# keychain-privileged main process. Runs before signing; see afterPack.cjs.
afterPack: ./afterPack.cjs

# OS deep-link scheme for the desktop SSO callback
# (eu.qwky.trinity://sso-callback?…). This declares the protocol in the packaged
# artifacts so the OS routes the browser redirect back into the app:
#   - macOS: writes CFBundleURLTypes into Info.plist (required for `open-url`).
#   - Linux: adds `MimeType=x-scheme-handler/eu.qwky.trinity` to the .desktop entry.
#   - Windows: registration is done at runtime via app.setAsDefaultProtocolClient
#     in src/main.ts (HKCU registry); this block is a no-op there but harmless.
# The runtime setAsDefaultProtocolClient call in main.ts complements this for the
# Windows/dev cases. Distinct from the in-session `trinity://app` www/ scheme.
protocols:
  - name: Trinity SSO Callback
    schemes:
      - eu.qwky.trinity

# Runtime assets that must live OUTSIDE the asar as real files. The tray icons
# live in build/ (buildResources) at dev time; ship them into Resources/build/
# so the main process resolves them via process.resourcesPath when packaged.
# (See resolveTrayIcon() in src/main.ts for the dev + packaged lookup order.)
extraResources:
  - from: build/trinityTray.png
    to: build/trinityTray.png
  - from: build/trinityTrayTemplate.png
    to: build/trinityTrayTemplate.png
  # Windows taskbar unread-overlay badge (red dot). setOverlayIcon needs a real
  # file resolvable via process.resourcesPath — see resolveOverlayIcon() in
  # src/dock-badge.ts. macOS/Linux ignore it (they use app.setBadgeCount).
  - from: build/unreadOverlay.png
    to: build/unreadOverlay.png

directories:
  output: release
  # icon.png (1024, transparent Trinity mark) lives here; electron-builder
  # generates the macOS .icns, Windows .ico, and Linux png set from it at package time.
  buildResources: build

# afterSign hook: notarizes the signed macOS .app via @electron/notarize, but ONLY
# when notarization credentials are present in the env. It is a clean no-op for
# unsigned/ad-hoc local builds, so `pnpm electron:package:mac` keeps working without a
# cert. See electron/build/notarize.cjs and the mac block below.
afterSign: build/notarize.cjs

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - AppImage
    - deb
  category: Network
  synopsis: Trinity Matrix client
  maintainer: Trinity <quwisky@qwky.eu>

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - dmg
    - zip
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  # Hardened-runtime entitlements (V8/WASM JIT + Matrix network.client). Applied only
  # when the app is signed with a Developer ID identity.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing + notarization (full guide: docs/platforms/desktop.md, "macOS signing and
  # notarization"). NOTE: `identity` is intentionally NOT pinned here, so electron-builder
  # auto-discovers the "Developer ID Application" cert and signs when one is available.
  #   - Cert source: the login keychain, OR CSC_LINK (path/base64 of a .p12) +
  #     CSC_KEY_PASSWORD.
  #   - Unsigned/ad-hoc dev build: `pnpm electron:package:mac` sets
  #     CSC_IDENTITY_AUTO_DISCOVERY=false so a stray cert can't trigger a failing sign.
  #   - Signed+notarized build: `pnpm electron:package:mac:signed` (auto-discovery on).
  # The afterSign hook (build/notarize.cjs) then notarizes IF notarization creds are set:
  #   App Store Connect API key: APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER
  #   Apple ID:                  APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
  # Notifications on macOS require a signed + notarized app, so ship via the signed path.

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  target:
    - nsis
  # TODO(signing): configure code signing (Authenticode / Azure Trusted Signing).
  #   e.g. signtoolOptions / azureSignOptions, or CSC_LINK + CSC_KEY_PASSWORD env.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# ---------------------------------------------------------------------------
# Auto-update (TODO)
# ---------------------------------------------------------------------------
# Not wired yet. To enable signed, signature-verified updates with
# electron-updater, add a `publish` block (e.g. provider: github / generic) and
# integrate autoUpdater in the main process. Never ship an unsigned update
# channel — updates must be served over https from a signed artifact.
# publish:
#   provider: github
#   owner: <owner>
#   repo: <repo>

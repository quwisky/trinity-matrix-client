# Synapse adapter (TRINITY_E2E_HOMESERVER=synapse), layered on ../docker-compose.yml.
# Paths resolve against the shared file's directory. start.mjs generates and patches
# homeserver.yaml into ./data and ./remote-data before `up` (see synapse/adapter.mjs).
services:
  homeserver:
    image: ghcr.io/element-hq/synapse:v1.161.0
    container_name: trinity-e2e-homeserver
    restart: 'no'
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: 'no'
      # Run as the invoking user so the bind-mounted ./data (config, signing key, sqlite
      # DB) stays writable by us — the image otherwise runs as 991 and chowns it, which
      # breaks the next start.mjs config patch and stop.mjs's cleanup on any filesystem
      # that does NOT remap ownership (i.e. every plain Linux CI runner). start.mjs
      # supplies these; the defaults keep a bare `docker compose up` behaving as before.
      UID: ${TRINITY_E2E_UID:-991}
      GID: ${TRINITY_E2E_GID:-991}
    volumes:
      # ${TRINITY_E2E_STATE_DIR:-.} keeps this as ./data everywhere it already works;
      # see paths.mjs for the one environment where it must move.
      - ${TRINITY_E2E_STATE_DIR:-.}/data:/data
    # Bind Synapse's HTTP listener to the host too, so the harness can register users
    # through the shared-secret admin API directly.
    ports:
      - '127.0.0.1:8008:8008'
    networks:
      - trinity-e2e

  # A second homeserver for federation-sensitive journeys. It listens on a distinct
  # internal port too, so the netns CI override can run both servers on one loopback.
  homeserver-remote:
    image: ghcr.io/element-hq/synapse:v1.161.0
    container_name: trinity-e2e-homeserver-remote
    restart: 'no'
    environment:
      SYNAPSE_SERVER_NAME: caddy:9448
      SYNAPSE_REPORT_STATS: 'no'
      UID: ${TRINITY_E2E_UID:-991}
      GID: ${TRINITY_E2E_GID:-991}
    volumes:
      - ${TRINITY_E2E_STATE_DIR:-.}/remote-data:/data
    # Share Caddy's namespace so this server can authenticate requests from the
    # primary server name `localhost`: its signing key is available at localhost:443.
    network_mode: 'service:caddy'

  # The identity server. It shares Caddy's namespace, as the native runtime shares the
  # host's loopback: Caddy's https://localhost:8452 site reaches it on 127.0.0.1:8090, and
  # Sydent verifies OpenID tokens with Synapse through Caddy's localhost:8448. Its config
  # (written by synapse/adapter.mjs) and database live in ./data/sydent.
  sydent:
    image: mirror.gcr.io/matrixdotorg/sydent:v2.6.1
    container_name: trinity-e2e-sydent
    restart: 'no'
    # Sydent rewrites its config to save its signing key: run as us, as Synapse does. The
    # fallback is the image's own sydent user (993), as 991 is the Synapse image's.
    user: '${TRINITY_E2E_UID:-993}:${TRINITY_E2E_GID:-993}'
    # The image's own venv, through the harness launcher (see sydent/launch.py).
    command: ['/home/sydent/venv/bin/python', '/trinity-sydent/launch.py']
    volumes:
      - ${TRINITY_E2E_STATE_DIR:-.}/data/sydent:/data
      - ${TRINITY_E2E_STATE_DIR:-.}/sydent:/trinity-sydent:ro
    network_mode: 'service:caddy'

  # Synapse calls the identity server as https://localhost:8452 from its own namespace:
  # forward that port, still TLS, to Caddy. The netns override drops this, since there
  # Synapse already shares Caddy's loopback.
  identity-forward:
    image: mirror.gcr.io/alpine/socat:1.8.0.3
    container_name: trinity-e2e-identity-forward
    restart: 'no'
    command: ['TCP-LISTEN:8452,fork,reuseaddr,bind=127.0.0.1', 'TCP:caddy:8452']
    network_mode: 'service:homeserver'
    depends_on:
      - caddy

  caddy:
    depends_on:
      - homeserver
    ports:
      - '127.0.0.1:8452:8452'

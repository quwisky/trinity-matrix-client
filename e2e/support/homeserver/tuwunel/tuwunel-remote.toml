# Remote Tuwunel for the federation journeys (server_name caddy:9448 or localhost:9448,
# set by the compose file). Test-only settings: never copy any of this to a real server.

[global]
address = ["0.0.0.0"]
# Distinct from the primary's even inside the container: the netns CI override puts both
# servers on one loopback.
port = 8009
database_path = "/var/lib/tuwunel"

# message-links registers here with m.login.dummy, and the harness may use the shared secret.
allow_registration = true
yes_i_am_very_very_sure_i_want_an_open_registration_server_prone_to_abuse = true
registration_shared_secret = "trinity-e2e-shared-secret"
grant_admin_to_first_user = false

allow_federation = true
trusted_servers = []
allow_invalid_tls_certificates = true
ip_range_denylist = []
query_over_tcp_only = true

allow_public_room_directory_over_federation = true

default_room_version = "10"

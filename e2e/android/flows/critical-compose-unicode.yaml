appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
# Set the clipboard before focusing: it can move focus away from the app, which
# leaves the input method state nondeterministic. The flow never calls
# hideKeyboard because Maestro implements it as an unconditional Android Back,
# which leaves the Room whenever the keyboard is already hidden. Send stays
# reachable above the keyboard because the WebView resizes natively.
- setClipboard: ${MESSAGE}
- tapOn:
    id: composer-input
- eraseText
- pasteText

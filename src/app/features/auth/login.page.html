<ion-header>
  <ion-toolbar>
    <ion-title>Sign in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input
        label="Homeserver"
        labelPlacement="stacked"
        autocapitalize="off"
        autocorrect="off"
        placeholder="matrix.org"
        [value]="homeserverInput()"
        (ionInput)="homeserverInput.set($any($event.target).value)"
        [disabled]="busy()"
      ></ion-input>
    </ion-item>
  </ion-list>

  @if (!baseUrl()) {
    <ion-button expand="block" [disabled]="busy()" (click)="discover()">
      @if (busy()) { <ion-spinner name="dots"></ion-spinner> } @else { Continue }
    </ion-button>
  } @else {
    <p>
      <ion-text color="medium">Homeserver: {{ baseUrl() }}</ion-text>
    </p>

    @if (passwordSupported()) {
      <ion-list>
        <ion-item>
          <ion-input
            label="Username"
            labelPlacement="stacked"
            autocapitalize="off"
            autocorrect="off"
            placeholder="@you:server.org or you"
            [value]="username()"
            (ionInput)="username.set($any($event.target).value)"
            [disabled]="busy()"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            [value]="password()"
            (ionInput)="password.set($any($event.target).value)"
            [disabled]="busy()"
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="block" [disabled]="busy()" (click)="loginPassword()">
        @if (busy()) { <ion-spinner name="dots"></ion-spinner> } @else { Sign in }
      </ion-button>
    }

    @if (ssoSupported()) {
      <ion-button expand="block" fill="outline" [disabled]="busy()" (click)="startSso()">
        Continue with SSO
      </ion-button>
    }
  }

  @if (error(); as e) {
    <p><ion-text color="danger">{{ e }}</ion-text></p>
  }
</ion-content>
